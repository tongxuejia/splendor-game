<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>璀璨宝石 Splendor · 对战版</title>
<style>
:root{
  --cw:148px; --ch:206px;
  --cW:#e8e4dc; --cB:#3b78c2; --cG:#2e9e5b; --cR:#d33a3a; --cK:#2b2b2b; --cO:#d4af37;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:#171a18; color:#eee; font-family:"Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh; padding:14px;
}
/* ═══════ 背景图试做（整块删除即可完全还原） ═══════ */
body::before{                 /* 背景图层；锚在画面中段（桥与城堡），避开底部高光水面 */
  content:""; position:fixed; inset:0; z-index:-2;
  background:url("assets/bakground/bgp5.1.jpeg") center/cover no-repeat;
  filter:brightness(.78);
}
[data-skin="cartoon"] body::before{display:none;}  /* 卡通皮肤保持纯浅底 */
body.no-bg::before{display:none;}  /* 未勾选"添加背景"时,只显示纯色底 */
/* ═══════════════ 背景图试做 END ═══════════════ */
h1{font-size:20px; margin-bottom:8px; color:#f0d98c; letter-spacing:2px; white-space:nowrap; flex-shrink:0;}
#setup{
  max-width:520px; margin:80px auto; background:#1c2530; border:1px solid #33404f;
  border-radius:12px; padding:28px;
}
#setup h1{margin-bottom:18px; text-align:center;}
#setup label{display:block; margin:14px 0 6px; color:#9ab;}
#setup select,#setup input{
  width:100%; padding:8px 10px; border-radius:6px; border:1px solid #33404f;
  background:#101822; color:#eee; font-size:15px;
}
#setup .setup-hidden{display:none;}
#setup input:disabled{color:#8a9bb0; cursor:not-allowed;}
/* 复选框行(如"添加背景"):不套用文本框的整宽样式 */
#setup label.check{display:flex; align-items:center; gap:8px; margin:16px 0 0; color:#9ab; font-size:15px; cursor:pointer;}
#setup label.check input{width:18px; height:18px; padding:0; accent-color:#f0d98c; cursor:pointer;}
/* 设置页显示时,把它在视口中居中;flex + margin:auto 在内容超高时会自动退回顶对齐,不会裁切 */
body:has(#setup:not([hidden])){display:flex; min-height:100vh;}
body:has(#setup:not([hidden])) #setup{margin:auto;}
.btn{
  display:inline-block; padding:8px 18px; border:none; border-radius:8px;
  background:#2e5f8a; color:#fff; cursor:pointer; font-size:14px; margin-top:16px;
}
.btn:hover{background:#3a74a5;}
.btn.gold{background:#8a6d1d;}
.btn.gold:hover{background:#a58526;}
.btn:disabled{background:#333; color:#777; cursor:not-allowed;}
.btn.small{padding:3px 10px; font-size:12px; margin:2px 2px 0 0;}

/* 游戏主界面布局 */
#game{max-width:1280px; margin:0 auto;}
#topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
#turnHint{font-size:16px; font-weight:bold; color:#7fd4a0;}
.topline{display:flex; justify-content:flex-end; align-items:baseline; gap:8px;}
#roundHint{font-size:14px; font-weight:bold; color:#f0d98c; white-space:nowrap;}
#log{font-size:12px; color:#c2d2e6; max-height:60px; overflow-y:auto; text-align:right;}
#log div{line-height:1.6;}

/* 贵族 */
#nobles{
  display:flex; justify-content:center; gap:10px;
  margin-bottom:12px; min-height:120px; flex-wrap:wrap;
}
.noble{
  width:120px; height:120px; background:#f4f1e8; color:#222;
  border:2px solid #8a6d1d; border-radius:8px; overflow:hidden;
  display:flex; flex-direction:column; position:relative; cursor:default;
  box-shadow:0 3px 9px rgba(0,0,0,.42);
}
.noble-art{
  min-height:0; flex:1; position:relative;
  overflow:hidden; background:#4b453d;
}
.noble-art img{
  width:100%; height:100%; display:block; object-fit:cover;
  object-position:center 20%;
}
.noble-art::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(to bottom,rgba(20,16,12,.02),rgba(20,16,12,.48));
  pointer-events:none;
}
.noble-art.art-failed::before{
  content:"贵族"; position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; color:#e6d6ad; font-size:13px; font-weight:bold;
}
.noble .pts{
  position:absolute; top:5px; right:5px; z-index:2;
  width:27px; height:27px; padding:0; display:grid; place-items:center;
  clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
  background:linear-gradient(145deg,#fff0bd 0%,#c99b43 22%,#795416 52%,#e2bd68 100%);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.62));
}
.noble .pts::before{
  content:""; position:absolute; inset:2px;
  clip-path:inherit;
  background:linear-gradient(145deg,#fffef8 0%,#f3ead6 52%,#ddcca9 100%);
  box-shadow:inset 0 1px 2px #fff,inset 0 -1px 2px rgba(125,91,32,.18);
}
.noble .pts > span{
  position:relative; z-index:1; color:#303638; font-family:Georgia,serif;
  font-size:22px; line-height:1; font-weight:bold; transform:translateY(-2px);
  text-shadow:0 1px 0 #fff,0 0 3px rgba(255,255,255,.55);
}
.noble-info{
  flex:0 0 30px; padding:4px 6px; display:flex;
  align-items:center; justify-content:center;
}
.noble-title{
  position:absolute; left:7px; bottom:35px; z-index:2;
  color:#fff; font-size:10px; font-weight:bold; text-shadow:0 1px 3px #000;
}
.noble .req{display:flex; gap:4px; flex-wrap:wrap;}
.noble .cost-gem{width:22px; height:22px; font-size:13px;}
.noble-taken{position:absolute; right:5px; bottom:35px; z-index:2; color:#fff; font-size:10px;}

/* 宝石库 */
/* 三列网格:左右两列等宽,中列的宝石组因此在整行里真正居中 */
#bank{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; margin:12px 0; align-items:center;}
.bank-gems{grid-column:2; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;}
/* 宝石库右侧:选中卡牌后的「买 / 留」操作组 */
#cardActs{grid-column:3; justify-self:end; display:flex; gap:8px; align-items:center;}
#cardActs .cap{color:#8a9bb0; font-size:12px;}
#cardActs .btn{margin:0; padding:8px 20px; font-size:15px; min-width:82px;}
/* 「买」与「留」额外拉开(实际间距 = gap 8px + margin 10px = 18px),避免误触 */
#cardActs .btn + .btn{margin-left:10px;}

.gem{
  width:44px; height:44px; border-radius:8px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; color:#111; font-weight:bold;
  font-size:13px; border:3px solid rgba(255,255,255,.25); cursor:pointer;
  user-select:none; position:relative; box-shadow:0 2px 6px rgba(0,0,0,.4);
  transition:transform .12s, box-shadow .12s, filter .12s, opacity .12s;
}
button.gem{padding:0; appearance:none; font-family:inherit;}
button.gem:focus-visible{outline:3px solid #7fd4a0; outline-offset:2px;}
button.gem:disabled{opacity:.55; cursor:default;}
button.gem:disabled:hover{transform:none;}
.gem:hover{transform:scale(1.1);}
.gem .n{font-size:18px; line-height:1;}
.gem.t{cursor:default;}
.gem.t:hover{transform:none;}
.gem.sel{outline:none; filter:drop-shadow(0 0 4px #7fd4a0); transform:scale(1.08);}
.gem.sel{animation:pulse 1.2s ease-in-out infinite;}
.gem.empty{opacity:.25; cursor:default;}
.gem.gold{background:radial-gradient(circle at 35% 30%, #ffe9a0, #d4af37);}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 0 2px rgba(127,212,160,.65));}
  50%{filter:drop-shadow(0 0 7px rgba(127,212,160,1));}
}

.gW{background:radial-gradient(circle at 35% 30%, #fff, #cfc9bd);}
.gB{background:radial-gradient(circle at 35% 30%, #7db3ec, #2c5c99);}
.gG{background:radial-gradient(circle at 35% 30%, #6ed99a, #1f7a43);}
.gR{background:radial-gradient(circle at 35% 30%, #f28383, #a52222);}
.gK{background:radial-gradient(circle at 35% 30%, #6a6a6a, #1a1a1a); color:#eee;}
.gO{background:radial-gradient(circle at 35% 30%, #ffe9a0, #b8912e);}

/* 各色使用不同宝石切割轮廓，颜色之外也能快速区分。 */
.gem.gW,.cost-gem.gW,.bgem.gW::before{
  border-radius:0;
  clip-path:polygon(50% 0,75% 7%,93% 25%,100% 50%,93% 75%,75% 93%,50% 100%,25% 93%,7% 75%,0 50%,7% 25%,25% 7%);
}
.gem.gB,.cost-gem.gB,.bgem.gB::before{
  border-radius:50%;
  clip-path:circle(49% at 50% 50%);
}
.gem.gG,.cost-gem.gG,.bgem.gG::before{
  border-radius:0;
  clip-path:polygon(22% 4%,78% 4%,96% 22%,96% 78%,78% 96%,22% 96%,4% 78%,4% 22%);
}
.gem.gR,.cost-gem.gR,.bgem.gR::before{
  border-radius:0;
  clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);
}
.gem.gK,.cost-gem.gK,.bgem.gK::before{
  border-radius:20%;
  clip-path:inset(4% round 18%);
}
.gem.gold,.gem.gO,.cost-gem.gO,.bgem.gO::before{
  border-radius:50%;
  clip-path:circle(49% at 50% 50%);
}

/* 卡牌区 */
#board{display:flex; flex-direction:column; gap:12px; margin:14px 0;}
.levelRow{
  display:flex; justify-content:center; gap:10px;
  align-items:flex-start; flex-wrap:wrap;
}
.deck{
  width:74px; height:100px; border-radius:8px; background:#233043;
  border:2px solid #445568; display:flex; flex-direction:column;
  align-items:center; justify-content:center; cursor:pointer; color:#9ab;
  font-size:12px; text-align:center; transition:border-color .15s, transform .15s;
}
.deck:hover{border-color:#7fd4a0; transform:translateY(-2px);}
.deck .cnt{font-size:18px; color:#eee; margin-top:4px;}
.deck .blind{color:#7fd4a0; margin-top:6px;}

.card{
  width:var(--cw); height:var(--ch); border-radius:8px; background:#f4f1e8;
  color:#222; display:flex; flex-direction:column; position:relative; overflow:hidden;
  border:1px solid rgba(205,178,112,.48); box-shadow:0 4px 12px rgba(0,0,0,.52);
  transition:transform .15s, box-shadow .15s, outline-color .15s;
}
.card:hover{transform:translateY(-4px); box-shadow:0 10px 22px rgba(0,0,0,.64);}
.card .card-art{
  min-height:0; flex:1; position:relative; overflow:hidden;
  background:#5f675f;
}
.card .card-art::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(to bottom,rgba(10,12,11,.04),rgba(10,12,11,.58));
  pointer-events:none;
}
.card .card-art.art-failed::before{
  content:"宝石商会"; position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; color:rgba(255,255,255,.82); font-size:13px; font-weight:bold;
}
.card .card-art img{
  width:100%; height:100%; display:block; object-fit:cover;
  transition:transform .35s ease;
}
.card:hover .card-art img{transform:scale(1.05);}
.card .card-top-strip{
  position:absolute; inset:0 0 auto; height:48px; z-index:1;
  transform:translateY(-6px);
  background:linear-gradient(180deg,rgba(255,255,255,.33),rgba(255,255,255,.2));
  box-shadow:0 1px 3px rgba(16,22,30,.08);
  backdrop-filter:blur(2px) saturate(.82);
  pointer-events:none;
}
.card .bonus-mark{
  position:absolute; top:7px; right:7px; z-index:2; width:27px; height:27px;
  border-radius:6px; border:2px solid rgba(255,255,255,.72);
  box-shadow:0 2px 6px rgba(0,0,0,.55);
}
.card .corner{
  width:27px; min-width:27px; height:27px; padding:0;
  position:absolute; top:7px; left:7px; z-index:2;
  clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
  background:linear-gradient(145deg,#fff0bd 0%,#c99b43 22%,#795416 52%,#e2bd68 100%);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.62));
}
.card .corner::before{
  content:""; position:absolute; inset:2px;
  clip-path:inherit;
  background:linear-gradient(145deg,#fffef8 0%,#f3ead6 52%,#ddcca9 100%);
  box-shadow:inset 0 1px 2px #fff,inset 0 -1px 2px rgba(125,91,32,.18);
}
.card .corner .pts{
  position:absolute; inset:0; z-index:1; color:#303638; font-family:Georgia,serif;
  font-weight:bold; font-size:22px; line-height:1; transform:translateY(-2px);
  display:grid; place-items:center;
  text-shadow:0 1px 0 #fff,0 0 3px rgba(255,255,255,.55);
}
.card .level-mark{
  position:absolute; left:8px; bottom:6px; z-index:2; color:#fff;
  font-size:10px; font-weight:bold; text-shadow:0 1px 3px #000;
}
.card .card-body{
  flex:0 0 38px; padding:5px 8px; display:flex; align-items:center;
  background:#f4f1e8;
}
.card .cost{display:flex; flex-wrap:wrap; gap:4px; min-height:28px;}
.card.afford{outline:2px solid #7fd4a0;}
#board .card,.player.cur .rmini{cursor:pointer;}
.card.sel,.rmini.sel{
  outline:3px solid #f0d98c; outline-offset:2px;
  box-shadow:0 0 0 6px rgba(240,217,140,.22),0 6px 16px rgba(0,0,0,.6);
  transform:translateY(-3px);
}
/* 成本被折扣覆盖的部分:变暗并打勾 */
.cost-gem.disc{opacity:.35; position:relative;}
.cost-gem.disc::after{
  content:"✓"; position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; color:#2e9e5b; font-size:16px; font-weight:900;
  text-shadow:0 0 3px #fff, 0 0 3px #fff;
}

.cost-gem{
  width:24px; height:24px; border-radius:4px; display:flex; align-items:center;
  justify-content:center; font-size:13px; font-weight:bold; color:#111;
  border:2px solid rgba(0,0,0,.15); position:relative;
}
.card .cost .cost-gem{width:28px; height:28px; font-size:19px;}

/* 玩家面板 */
#players{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin-top:16px;}
.player{
  background:#1c2530; border:1px solid #33404f; border-radius:10px; padding:12px;
}
.player.cur{border:2px solid #7fd4a0;}
.player .head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.player .name{font-weight:bold; font-size:15px;}
.player .score{font-size:22px; color:#f0d98c; font-weight:bold;}
.player .row{display:flex; align-items:center; gap:6px; margin:6px 0; flex-wrap:wrap;}
.player .tag{font-size:12px; color:#8a9bb0; width:34px;}
.player .resource-row{display:grid; grid-template-columns:34px minmax(0,1fr); gap:6px;}
.player .resource-slots{
  display:grid; grid-template-columns:repeat(6,34px); gap:2px; align-items:center;
}
.player .resource-slots > *{justify-self:center;}
.player .gems .gem{width:34px; height:34px; font-size:12px; cursor:default;}
.player .gem.clickable{cursor:pointer;}
.player .gem.clickable:hover{transform:scale(1.12);}
.player .gem.empty,.player .bgem.empty{visibility:hidden; pointer-events:none;}
.player-nobles{display:flex; gap:5px; flex-wrap:wrap;}
.player-noble{
  width:34px; height:42px; border:1px solid #8a6d1d; border-radius:4px;
  overflow:hidden; background:#4b453d;
}
.player-noble img{
  width:100%; height:100%; display:block; object-fit:cover;
  object-position:center 12%;
}
.bgem{
  width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
  border:3px solid #c69a3a; position:relative; overflow:hidden; isolation:isolate;
  background:linear-gradient(145deg,#fffdf6 0%,#d9d5c9 58%,#a9a497 100%);
  box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.9);
}
.bgem::before{
  content:""; position:absolute; left:50%; top:50%; width:29px; height:29px; z-index:0;
  transform:translate(-50%,-50%);
  background-position:center; background-repeat:no-repeat;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));
}
.bgem .bonus-count{
  position:relative; z-index:1; font-size:16px; line-height:1; font-weight:bold;
  color:#fff; text-shadow:0 1px 2px #000,0 0 3px #000;
}
.bgem.gW .bonus-count{
  color:#151515; text-shadow:0 1px 2px rgba(255,255,255,.95);
}
.player .reserved{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
.rmini{
  width:96px; height:118px; border-radius:6px; background:#f4f1e8; color:#222;
  overflow:hidden; font-size:10px; position:relative;
}
.rmini-art{height:89px; position:relative; overflow:hidden; background:#5f675f;}
.rmini-art img{width:100%; height:100%; object-fit:cover; display:block;}
.rmini-top-strip{
  position:absolute; inset:0 0 auto; height:28px; z-index:1;
  transform:translateY(-4px);
  background:linear-gradient(180deg,rgba(255,255,255,.33),rgba(255,255,255,.2));
  backdrop-filter:blur(1.5px) saturate(.82);
  pointer-events:none;
}
.rmini-art .mini-bonus{
  position:absolute; top:4px; right:4px; z-index:2; width:16px; height:16px;
  border-radius:4px; border:1px solid rgba(255,255,255,.75);
}
.rmini .pts{
  position:absolute; top:4px; left:4px; z-index:2; width:16px; min-width:16px; height:16px;
  padding:0; display:grid; place-items:center;
  clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
  border:1px solid #e3bd68; font-family:Georgia,serif;
  font-size:13px; line-height:1; font-weight:bold; color:#303638;
  transform:translateY(-2px);
  background:linear-gradient(145deg,#fffef8 0%,#f3ead6 52%,#ddcca9 100%);
  box-shadow:inset 0 1px 1px #fff;
  text-shadow:0 1px 0 #fff; filter:drop-shadow(0 2px 2px rgba(0,0,0,.55));
}
.rmini-body{height:29px; padding:5px 6px;}
.rmini .cost-gem{width:18px; height:18px; border-width:1px; font-size:11px;}
.rmini.afford{outline:2px solid #7fd4a0;}
.player .rmini.sel{
  outline:3px solid #f0d98c; outline-offset:2px;
  box-shadow:0 0 0 6px rgba(240,217,140,.22),0 6px 16px rgba(0,0,0,.6);
}
.player .purchased-row{
  display:grid; grid-template-columns:34px minmax(0,1fr); gap:6px;
  align-items:start; margin-top:9px;
}
.purchased-grid{
  display:grid; grid-template-columns:repeat(5,minmax(34px,68px));
  gap:6px; align-items:start; min-width:0;
}
.owned-stack{display:grid; min-width:0;}
.owned-card{
  grid-area:1/1; position:relative; width:100%; aspect-ratio:68/94;
  overflow:hidden; border-radius:5px; color:#fff;
  border:1px solid rgba(205,178,112,.62); background:#4f5752;
  box-shadow:0 3px 8px rgba(0,0,0,.48);
  transform:translateY(var(--stack-offset)); z-index:var(--stack-z);
}
.owned-card img{
  position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover;
}
.owned-card::after{
  content:""; position:absolute; inset:0; z-index:1;
  background:linear-gradient(to bottom,rgba(10,12,11,.02) 45%,rgba(10,12,11,.7));
  pointer-events:none;
}
.owned-card.art-failed::before{
  content:"宝石商会"; position:absolute; inset:0; display:grid; place-items:center;
  color:rgba(255,255,255,.82); font-size:9px; font-weight:bold;
}
.owned-card-top{
  position:absolute; inset:0 0 auto; height:22px; z-index:2;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.22));
  box-shadow:0 1px 2px rgba(16,22,30,.12);
  backdrop-filter:blur(1.5px) saturate(.85);
  pointer-events:none;
}
.owned-card-score{
  position:absolute; top:2px; left:3px; z-index:4;
  width:18px; height:18px; display:grid; place-items:center;
  clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
  background:linear-gradient(145deg,#fffef8,#e2d2b2);
  border:1px solid #d5ab52; color:#303638; font:700 13px/1 Georgia,serif;
  text-shadow:0 1px 0 #fff; filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));
}
.owned-card .owned-card-bonus{
  position:absolute; top:3px; right:3px; z-index:4;
  width:16px; height:16px; border-width:1px;
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.owned-card-level{
  position:absolute; left:4px; bottom:2px; z-index:4;
  color:#888; font-size:8px; font-weight:bold;
}
.owned-card-cost{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  display:flex; flex-wrap:wrap; gap:2px; padding:2px 3px 2px 16px;
  background:#f4f1e8; justify-content:center; align-items:center;
  border-top:1px solid rgba(0,0,0,.12);
}
.owned-card-cost .cost-gem{
  width:13px; height:13px; font-size:8px; border-width:1px;
}

/* 操作条 */
#actionbar{
  position:sticky; bottom:0; background:#10161e; border:1px solid #33404f;
  border-radius:10px; padding:10px 14px; display:flex; align-items:center;
  gap:14px; flex-wrap:wrap; margin-top:14px; z-index:5;
}
#actionbar .msg{color:#f0d98c; font-size:14px; flex:1;}
#selGems{display:flex; gap:6px; align-items:center;}
#selGems .gem{width:34px; height:34px; font-size:12px; cursor:default;}

/* 电脑回合状态 */
#aiThinking{
  position:fixed; top:14px; left:50%; z-index:25;
  width:min(440px,calc(100vw - 28px)); min-height:62px;
  display:flex; align-items:center; gap:13px; padding:10px 16px;
  color:#f7edcf; background:rgba(16,22,30,.97);
  border:1px solid rgba(224,184,91,.78); border-radius:8px;
  box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.07);
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translate(-50%,-120%);
  transition:opacity .22s ease,transform .28s ease,visibility .22s;
  overflow:hidden;
}
#aiThinking.show{
  opacity:1; visibility:visible; transform:translate(-50%,0);
}
#aiThinking::after{
  content:""; position:absolute; left:-45%; bottom:0;
  width:42%; height:2px;
  background:linear-gradient(90deg,transparent,#f0d98c,transparent);
  animation:aiScan 1.35s ease-in-out infinite;
}
.ai-thinking-gem{
  flex:0 0 38px; width:38px; height:38px; position:relative;
  display:grid; place-items:center;
}
.ai-thinking-gem::before{
  content:""; width:24px; height:24px;
  clip-path:polygon(50% 0,88% 22%,100% 62%,72% 100%,28% 100%,0 62%,12% 22%);
  background:linear-gradient(145deg,#fff2a9 0%,#c99a38 40%,#624515 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);
  animation:aiGemThink 1.15s ease-in-out infinite;
}
.ai-thinking-gem::after{
  content:""; position:absolute; inset:2px;
  border:2px solid rgba(240,217,140,.25);
  border-top-color:#f0d98c; border-radius:50%;
  animation:aiSpin .95s linear infinite;
}
.ai-thinking-copy{min-width:0; flex:1;}
.ai-thinking-copy strong{
  display:block; font-size:15px; line-height:1.35; color:#fff;
}
.ai-thinking-copy span{
  display:block; margin-top:2px; color:#b8c2cc; font-size:12px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ai-thinking-dots{display:flex; align-items:center; gap:4px; padding-left:4px;}
.ai-thinking-dots i{
  width:5px; height:5px; border-radius:50%; background:#f0d98c;
  animation:aiDot 1s ease-in-out infinite;
}
.ai-thinking-dots i:nth-child(2){animation-delay:.14s;}
.ai-thinking-dots i:nth-child(3){animation-delay:.28s;}
.ai-thinking #actionbar{
  border-color:rgba(224,184,91,.72);
  animation:aiActionPulse 1.3s ease-in-out infinite;
}
.player.cur.ai-turn{
  border-color:#e0b85b;
  animation:aiPanelPulse 1.3s ease-in-out infinite;
}
@keyframes aiSpin{to{transform:rotate(360deg);}}
@keyframes aiGemThink{
  0%,100%{transform:scale(.86) rotate(-5deg); filter:brightness(.9);}
  50%{transform:scale(1.08) rotate(5deg); filter:brightness(1.2);}
}
@keyframes aiDot{
  0%,100%{transform:translateY(2px); opacity:.35;}
  50%{transform:translateY(-3px); opacity:1;}
}
@keyframes aiScan{
  0%{left:-45%;}
  100%{left:105%;}
}
@keyframes aiActionPulse{
  0%,100%{box-shadow:0 0 0 rgba(224,184,91,0);}
  50%{box-shadow:0 0 16px rgba(224,184,91,.2);}
}
@keyframes aiPanelPulse{
  0%,100%{box-shadow:0 0 0 rgba(224,184,91,0);}
  50%{box-shadow:0 0 18px rgba(224,184,91,.28);}
}

/* 回合横幅:换人时闪现提醒 */
#turnBanner{
  position:fixed; top:18%; left:50%; transform:translateX(-50%) scale(.8);
  background:rgba(20,30,40,.95); border:2px solid #7fd4a0; color:#7fd4a0;
  padding:14px 44px; border-radius:14px; font-size:24px; font-weight:bold;
  letter-spacing:3px; z-index:30; pointer-events:none; opacity:0;
  transition:opacity .3s, transform .3s;
}
#turnBanner.show{opacity:1; transform:translateX(-50%) scale(1);}

/* ═══════════ 手机紧凑模式 ═══════════
   核心:牌库 + 4 张卡恒定单行不换行,卡宽随视口流动。
   换行是纵向滚动的主要来源——一旦换行,三级牌桌会从 3 行膨胀到 6~9 行。 */
@media (max-width: 720px){
  /* 卡宽不再用 100vw 猜算(100vw 含滚动条宽度,会导致卡片被 flex-shrink 意外压缩),
     改为 flex:1 1 0 + aspect-ratio 完全流式;高度由比例推导,牌库靠 align-self:stretch 对齐 */
  :root{
    --pad:5px; --rgap:3px; --deckw:30px;
  }
  body{padding:8px var(--pad);}
  h1{font-size:15px; letter-spacing:1px;}

  /* 开始设置页:去掉桌面留白,单屏可见 */
  #setup{margin:14px auto; padding:14px 16px;}
  #setup h1{margin-bottom:10px;}
  #setup label{margin:9px 0 4px; font-size:13px;}
  #setup select,#setup input{padding:7px 8px; font-size:14px;}
  #setup .btn{margin-top:12px;}

  /* 顶栏压缩,日志限约两行 */
  #topbar{margin-bottom:4px;}
  #turnHint{font-size:13px;}
  #roundHint{font-size:12px;}
  #log{max-height:30px; font-size:11px;}

  /* 贵族:强制单行,定尺寸小卡,避免整块撑高 */
  #nobles{gap:var(--rgap); margin-bottom:5px; min-height:0; flex-wrap:nowrap; justify-content:center;}
  .noble{width:66px; height:66px; flex:0 0 66px; min-width:0; aspect-ratio:1;}
  .noble .pts{width:15px; height:15px; top:1px; right:1px;}
  .noble .pts > span{font-size:12px; transform:none;}
  .noble-info{flex:0 0 17px; padding:1px 2px;}
  .noble .req{gap:1px;}
  .noble .cost-gem{width:11px; height:11px; font-size:8px; border-width:1px;}
  .noble-title{font-size:6px; left:2px; bottom:18px;}
  .noble-taken{font-size:6px; right:2px; bottom:18px;}

  /* 宝石库:6 颗宝石与「买 / 留」同行(小屏没有多余留白给左右平衡列,退回单行 flex) */
  #bank{display:flex; flex-wrap:wrap; gap:4px; margin:5px 0;}
  .bank-gems{gap:4px; flex:0 1 auto;}
  .gem{width:30px; height:30px; font-size:12px;}
  #cardActs{gap:4px; margin-left:auto;}
  #cardActs .cap{display:none;}
  #cardActs .btn{padding:4px 9px; font-size:12px; min-width:46px;}
  #cardActs .btn + .btn{margin-left:8px;} /* 小屏买/留间距 = 4 + 8 = 12px */

  /* 牌桌:三级各占一行,牌库 + 4 张卡恒定单行 */
  #board{gap:6px; margin:6px 0;}
  .levelRow{flex-wrap:nowrap; gap:var(--rgap);}
  .card{width:auto; height:auto; flex:1 1 0; min-width:0; max-width:104px; aspect-ratio:148/206; border-radius:6px;}
  /* 竖屏免滚动:牌桌恒为 3 行,卡高 = (视口高 - 其余区块)/3,视口变矮就压扁卡面。
     卡身成本行是 flex:0 0 21px 固定值,插画 flex:1 min-height:0,所以压高度只会吃掉插画。
     342/427 = 双人/多人(玩家面板换第二行)下除三行牌以外的全部纵向占用 + 约 15px 余量
     (余量留给中局面板增长与地址栏抖动,实测双人 vh≥520、多人 vh≥600 即不滚动)。 */
  .card{max-height:calc((100vh - 342px)/3); max-height:calc((100svh - 342px)/3); min-height:60px;}
  #game:has(#players .player:nth-child(3)) .card{
    max-height:calc((100vh - 427px)/3); max-height:calc((100svh - 427px)/3);
  }
  .deck{flex:0 0 var(--deckw); width:var(--deckw); height:auto; align-self:stretch; font-size:12px; line-height:1.2; border-width:1px; border-radius:6px;}
  .deck .dname{display:none;}
  .deck .dlvl{font-size:14px; color:#eee; font-weight:bold;}
  .deck .cnt{font-size:11px; margin-top:0;}
  .deck .blind{display:none;}

  /* 卡面元素等比收缩;成本强制单行——换行会被 .card 的 overflow:hidden 裁掉 */
  .card .card-top-strip{height:20px; transform:translateY(-3px);}
  .card .bonus-mark{width:13px; height:13px; top:2px; right:2px; border-width:1px; border-radius:3px;}
  .card .corner{width:14px; min-width:14px; height:14px; top:2px; left:2px; padding:0;}
  .card .corner::before{inset:1px;}
  .card .corner .pts{font-size:11px; transform:none;}
  .card .level-mark{font-size:6px; left:2px; bottom:1px;}
  .card .card-art.art-failed::before{font-size:8px;}
  .card .card-body{flex:0 0 21px; padding:1px 2px;}
  .card .cost{gap:1px; min-height:13px; flex-wrap:nowrap;}
  .card .cost .cost-gem{width:14px; height:14px; min-width:12px; font-size:11px; border-width:1px;}
  .cost-gem.disc::after{font-size:10px;}
  .card.sel,.rmini.sel{outline-width:2px; outline-offset:1px; box-shadow:none; transform:translateY(-2px);}
  .player .rmini.sel{outline-width:2px; box-shadow:none;}

  /* 玩家面板:窄屏两列,内部全部改流式栅格 */
  #players{grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:5px; margin-top:6px;}
  .player{padding:5px 6px; border-radius:8px;}
  .player .head{margin-bottom:1px;}
  .player .name{font-size:12px;}
  .player .score{font-size:15px;}
  .player .row{margin:2px 0; gap:3px;}
  .player .tag{font-size:9px; width:20px;}
  .player .resource-row{grid-template-columns:20px minmax(0,1fr); gap:3px;}
  .player .resource-slots{grid-template-columns:repeat(6,minmax(0,1fr)); gap:1px;}
  .player .gems .gem{width:100%; max-width:21px; height:21px; font-size:9px;}
  .player-nobles{gap:2px;}
  .player-noble{width:18px; height:23px;}
  .bgem{width:21px; height:21px; border-width:1px;}
  .bgem::before{width:16px; height:16px;}
  .bgem .bonus-count{font-size:10px;}
  .player .reserved{gap:3px; margin-top:2px;}
  .rmini{width:40px; height:52px;}
  .rmini-art{height:33px;}
  .rmini-top-strip{height:12px; transform:translateY(-2px);}
  .rmini-art .mini-bonus{width:10px; height:10px; top:1px; right:1px;}
  .rmini .pts{width:10px; min-width:10px; height:10px; top:1px; left:1px; font-size:8px; transform:none;}
  .rmini-body{height:19px; padding:1px 2px;}
  .rmini .cost-gem{width:10px; height:10px; font-size:7px;}
  .player .purchased-row{grid-template-columns:20px minmax(0,1fr); gap:3px; margin-top:3px;}
  .purchased-row .tag{width:20px;}
  .purchased-grid{grid-template-columns:repeat(5,minmax(0,1fr)); gap:2px; width:100%;}
  .owned-card-score{width:10px; height:10px; left:1px; font:700 9px/1 Georgia,serif;}
  .owned-card .owned-card-bonus{width:9px; height:9px; right:1px; top:1px;}
  .owned-card-top{height:14px;}
  .owned-card-cost{padding-left:8px;}
  .owned-card-cost .cost-gem{width:8px; height:8px; font-size:5px;}
  .owned-card-level{font-size:5px;}

  /* 操作条 */
  #actionbar{padding:5px 6px; gap:5px; margin-top:6px; border-radius:8px;}
  #actionbar .msg{font-size:11px; flex:1 1 100%;}
  #selGems{gap:2px;}
  #selGems .gem{width:24px; height:24px; font-size:9px;}
  #actionbar .btn{padding:5px 8px; font-size:12px; margin:0;}

  /* 悬浮提示 */
  #aiThinking{top:6px; min-height:48px; padding:6px 10px; gap:9px; width:min(400px,calc(100vw - 12px));}
  .ai-thinking-gem{flex-basis:28px; width:28px; height:28px;}
  .ai-thinking-gem::before{width:18px; height:18px;}
  .ai-thinking-copy strong{font-size:13px;}
  .ai-thinking-copy span{font-size:10px;}
  #turnBanner{font-size:15px; padding:7px 18px;}
}
@media (prefers-reduced-motion: reduce){
  #aiThinking,.ai-thinking-gem::before,.ai-thinking-gem::after,
  .ai-thinking-dots i,.ai-thinking #actionbar,.player.cur.ai-turn,#returnResultsBtn{
    animation:none; transition:none;
  }
}

/* 弹窗 */
#overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex;
  align-items:center; justify-content:center; z-index:20;
}
#overlay[hidden]{display:none;}
#modalBox{
  background:#1c2530; border:1px solid #445568; border-radius:12px;
  padding:26px; max-width:560px; width:92%; max-height:86vh; overflow-y:auto;
}
#modalBox h2{color:#f0d98c; margin-bottom:14px;}
#modalBox .noble{margin:8px 0; cursor:pointer;}
#modalBox .noble:hover{border-color:#7fd4a0;}
#modalBox .winner{font-size:22px; color:#7fd4a0; margin:10px 0;}
#returnResultsBtn{
  position:fixed; bottom:20px; right:20px; z-index:15;
  padding:10px 22px; font-size:15px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
  animation:returnBtnPulse 2.4s ease-in-out infinite;
}
#returnResultsBtn[hidden]{display:none;}
@keyframes returnBtnPulse{
  0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.5);}
  50%{box-shadow:0 4px 22px rgba(240,217,140,.35);}
}

/* 清新风宝石形状:可爱的圆润轮廓,与宝石色关联 */
[data-skin="cartoon"] .gem.gW,
[data-skin="cartoon"] .cost-gem.gW,
[data-skin="cartoon"] .bgem.gW::before{
  border-radius:30%; clip-path:inset(2% round 28%);
}
[data-skin="cartoon"] .gem.gB,
[data-skin="cartoon"] .cost-gem.gB,
[data-skin="cartoon"] .bgem.gB::before{
  border-radius:50%; clip-path:circle(48% at 50% 50%);
}
[data-skin="cartoon"] .gem.gG,
[data-skin="cartoon"] .cost-gem.gG,
[data-skin="cartoon"] .bgem.gG::before{
  border-radius:50% 0; clip-path:polygon(50% 2%,96% 50%,50% 98%,4% 50%);
}
[data-skin="cartoon"] .gem.gR,
[data-skin="cartoon"] .cost-gem.gR,

function validateGameData(){
  const expectedCounts = {1:40, 2:30, 3:20};
  const expectedPerColor = {1:8, 2:6, 3:4};
  const expectedScores = {
    1:{0:35, 1:5},
    2:{1:10, 2:15, 3:5},
    3:{3:5, 4:10, 5:5},
  };

  for(const lv of [1,2,3]){
    const cards = DECK_DATA[lv];
    if(cards.length !== expectedCounts[lv]){
      throw new Error(`等级 ${lv} 牌数错误:${cards.length}`);
    }
    for(const color of COLORS){
      if(cards.filter(card=>card.color===color).length !== expectedPerColor[lv]){
        throw new Error(`等级 ${lv} 的${COLOR_NAME[color]}色牌数量错误`);
      }
    }
    for(const [pts, count] of Object.entries(expectedScores[lv])){
      if(cards.filter(card=>card.pts===+pts).length !== count){
        throw new Error(`等级 ${lv} 的 ${pts} 分牌数量错误`);
      }
    }
    for(const card of cards){
      if(!Object.keys(card.cost).length ||
         Object.entries(card.cost).some(([color, amount])=>
           !COLORS.includes(color) || !Number.isInteger(amount) || amount <= 0)){
        throw new Error(`等级 ${lv} 存在非法卡牌成本`);
      }
    }
  }
  if(NOBLE_DATA.length !== 10 || NOBLE_ART.length !== NOBLE_DATA.length){
    throw new Error("贵族牌或贵族图片数量错误");
  }
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function newPlayer(name, isAI=false){

function initGame(participants, mode, aiDifficulty="normal", skin="court"){

  for(const lv of [1,2,3]){
    decks[lv] = shuffle(DECK_DATA[lv].map(c=>({...c})));

  }

                  .slice(0, n+1)

// 计算买卡的花费(考虑折扣和金币)
function costFor(player, card){
  let needGold = 0;
  const pay = {};
  for(const c of COLORS){
    const remain = Math.max(0, (card.cost[c]||0) - (player.bonus[c]||0));
    const useToken = Math.min(remain, player.tokens[c]);
    pay[c] = useToken;
    needGold += remain - useToken;
  }
  pay.O = needGold;
  return pay;   // pay.O 为需要的金币数
}
function canAfford(player, card){
  const pay = costFor(player, card);
  return pay.O <= player.tokens.O;
}
function totalTokens(player){
  return COLORS.reduce((s,c)=>s+player.tokens[c],0) + player.tokens.O;
}

/* ─────────────────── 前瞻内核:公开信息视图 + 抽样推演 ─────────────────── */
/*
 * easy / normal / hard 共用的唯一决策通路(master 走 aiGuideDecide),要点:
 *  1. 视图层 aiBaseView() 只读取「公开信息」:牌桌、各家宝石/折扣/分数/已买卡、
 *     牌库剩余「数量」、贵族池。绝不读取 S.decks 的顺序,也绝不读取对手 p.reserved 的内容
 *     (对手的预留通过公开数量反推,只保留张数 hiddenRes)。
 *  2. 未知牌用 determinization:对「牌库 ∪ 对手预留」这个公开可推算的牌的多重集做随机切分,
 *     每次抽样都给牌库一个合法的具体顺序,多次抽样取平均。
 *  3. 估值统一到「分等价」量纲:simScore = 分数 + 离 15 分的距离(play/race) + 折扣资产
 *     + 贵族可达性 + 金币时间价值 - 冗余宝石 - 阻断成本 - 回合机会成本。
 *  4. 决策 = samples 次抽样 × 全动作枚举(含单拿宝石、牌库盲留)× 1-ply 对手应手。
 *  这 3 档之间只差上面那组旋钮,所以任何一次改动都能用 tools/selfplay.js matrix 量化验证。
 */
const AI_END_pts = 15;

function aiRand(v){ v.seed = (v.seed*1664525 + 1013904223) >>> 0; return v.seed/4294967296; }
/* 卡片签名:同 level 下签名相同即视为同一张(牌库里存在完全相同的复制品) */
function aiSig(c){ return c.color+"|"+c.pts+"|"+COLORS.map(x=>c.cost[x]||0).join("."); }
function aiTotalTok(p){ return COLORS.reduce((s,c)=>s+p.tokens[c],0) + p.tokens.O; }
function aiSelKey(sel){ return COLORS.map(c=>sel[c]||0).join(","); }

/* —— 视图:仅公开信息 —— */
function aiBaseView(){
  const me = S.cur, n = S.players.length;
  const visibleAt = {1:new Map(),2:new Map(),3:new Map()};
  const add = c => {
    const m = visibleAt[c.lv], k = aiSig(c);
    m.set(k, (m.get(k)||0)+1);
  };
  for(const lv of [1,2,3]) S.board[lv].forEach(add);
  S.players.forEach(p=>p.purchased.forEach(add));
  S.players.forEach((p,i)=>{ if(i===me) p.reserved.forEach(add); });   /* 只算自己的预留 */

  /* 未现身的所有牌 = 整副 - 已现身的多重集;其中一部分在对手手里(内容未知) */
  const pool = {1:[],2:[],3:[]}, deckLen = {1:0,2:0,3:0};
  for(const lv of [1,2,3]){
    const left = new Map(visibleAt[lv]);
    for(const c of DECK_DATA[lv]){
      const k = aiSig(c), r = left.get(k)||0;
      if(r>0) left.set(k, r-1); else pool[lv].push(c);
    }
    deckLen[lv] = S.decks[lv].length;      /* 牌库余数是公开信息 */
  }
  return {
    me, n, endTriggeredBy:S.endTriggeredBy, seed:(Date.now()^0x9e3779b9)>>>0,
    tokens:{...S.tokens},
    board:{1:S.board[1].slice(),2:S.board[2].slice(),3:S.board[3].slice()},
    deckLen, pool,
    deck:{1:[],2:[],3:[]},
    nobles:S.nobles.map(x=>({
      cost:x.cost,
      taken:x.taken===null ? null : S.players.findIndex(p=>p.name===x.taken),
    })),
    players:S.players.map((p,i)=>({
      tokens:{...p.tokens}, bonus:{...p.bonus}, pts:p.pts, cards:p.cards,
      reserved:i===me ? p.reserved.slice() : [],
      hiddenRes:i===me ? 0 : p.reserved.length,
      nobles:[], isAI:Boolean(p.isAI),
    })),
  };
}
function aiViewClone(v){
  return {
    me:v.me, n:v.n, endTriggeredBy:v.endTriggeredBy, seed:v.seed,
    tokens:{...v.tokens},
    board:{1:v.board[1].slice(),2:v.board[2].slice(),3:v.board[3].slice()},
    deckLen:v.deckLen, pool:v.pool,
    deck:{1:v.deck[1].slice(),2:v.deck[2].slice(),3:v.deck[3].slice()},
    nobles:v.nobles.map(x=>({cost:x.cost, taken:x.taken})),
    players:v.players.map(p=>({
      tokens:{...p.tokens}, bonus:{...p.bonus}, pts:p.pts, cards:p.cards,
      reserved:p.reserved.slice(), hiddenRes:p.hiddenRes, nobles:p.nobles.slice(), isAI:p.isAI,
    })),
  };
}
/* 把「未现身的牌」随机切成 牌库 + 对手预留 两部分(同一份抽样内保持一致) */
function aiDeterminize(v){
  for(const lv of [1,2,3]){
    const cards = v.pool[lv].slice();
    for(let i=cards.length-1;i>0;i--){
      const j = Math.floor(aiRand(v)*(i+1));
      const t=cards[i]; cards[i]=cards[j]; cards[j]=t;
    }
    /* 前 deckLen 张进牌库;其余落在对手手里,前瞻中不会再回到牌桌 */
    v.deck[lv] = cards.slice(0, v.deckLen[lv]);
  }
}

/* —— 模拟动作 —— */
function aiRefill(v,lv){ if(v.board[lv].length<4 && v.deck[lv].length) v.board[lv].push(v.deck[lv].pop()); }
function aiEndTrigger(v,pi){ if(v.endTriggeredBy<0 && v.players[pi].pts>=AI_END_pts) v.endTriggeredBy=pi; }
function aiNobleDeny(v,pi,noble){
  let s=0;
  v.players.forEach((op,i)=>{
    if(i===pi) return;
    const gap = COLORS.reduce((a,c)=>a+Math.max(0,(noble.cost[c]||0)-op.bonus[c]),0);
    s += 3/(gap+1);
  });
  return s;
}
function aiSimNobles(v,pi){
  const p=v.players[pi];
  for(let guard=0; guard<3; guard++){
    const open = v.nobles.filter(x=>x.taken===null && COLORS.every(c=>p.bonus[c]>=(x.cost[c]||0)));
    if(!open.length) return;
    let best=open[0], bs=-Infinity;
    open.forEach(x=>{ const s=aiNobleDeny(v,pi,x); if(s>bs){ bs=s; best=x; } });
    best.taken = pi; p.pts += 3; p.nobles.push(best);
    aiEndTrigger(v,pi);
  }
}
function aiSimBuy(v,pi,card,fromRes){
  const p=v.players[pi];
  const pay = costFor(p, card);
  for(const c of COLORS){ p.tokens[c]-=pay[c]; v.tokens[c]+=pay[c]; }
  p.tokens.O-=pay.O; v.tokens.O+=pay.O;
  p.bonus[card.color]++; p.cards++; p.pts+=card.pts;
  if(fromRes){
    const k=p.reserved.indexOf(card); if(k>=0) p.reserved.splice(k,1);
  }else{
    const b=v.board[card.lv], k=b.indexOf(card);
    if(k>=0) b.splice(k,1);
    aiRefill(v,card.lv);
  }
  aiSimNobles(v,pi);
  aiEndTrigger(v,pi);
}
function aiSimReserve(v,pi,card,lv){
  const p=v.players[pi];
  if(p.reserved.length>=3) return;
  let got;
  if(card){
    const b=v.board[lv], k=b.indexOf(card);
    if(k>=0) b.splice(k,1);
    got=card; aiRefill(v,lv);
  }else{
    if(!v.deck[lv].length) return;
    got=v.deck[lv].pop();
  }
  p.reserved.push(got);
  if(v.tokens.O>0){ v.tokens.O--; p.tokens.O++; }
}
function aiSimTake(v,pi,sel){
  const p=v.players[pi];
  for(const c of COLORS){
    const k=Math.min(sel[c]||0, v.tokens[c]);
    v.tokens[c]-=k; p.tokens[c]+=k;
  }
  aiSimDiscard(v,pi);
}
function aiSimDiscard(v,pi){
  const p=v.players[pi];
  for(let guard=0; aiTotalTok(p)>10 && guard<12; guard++){
    let worst=null, ws=Infinity;
    [...COLORS,GOLD].forEach(c=>{
      if(p.tokens[c]<=0) return;
      const val = aiTokenKeepValue(v,pi,c);
      if(val<ws){ ws=val; worst=c; }
    });
    if(worst===null) return;
    p.tokens[worst]--; v.tokens[worst]++;
  }
}

/* —— 子评估函数 —— */
function aiNobleColorValueView(v,pi,color){
  const p=v.players[pi];
  let s=0;
  v.nobles.forEach(x=>{
    if(x.taken!==null) return;
    if(!x.cost[color] || p.bonus[color]>=(x.cost[color]||0)) return;
    const gap = COLORS.reduce((a,c)=>a+Math.max(0,(x.cost[c]||0)-p.bonus[c]),0);
    s += 1 + 3/(gap+1);
  });
  return s;
}
/* 单个宝石对该玩家当前目标的边际价值(用于剪枝、选宝石、弃牌) */
function aiTokenKeepValue(v,pi,color){
  if(color===GOLD) return 7;                        /* 金币万能,最后才弃 */
  const p=v.players[pi];
  let s = aiNobleColorValueView(v,pi,color)*1.1;
  const watch = p.reserved.concat(v.board[1],v.board[2],v.board[3]);
  watch.forEach(c=>{
    const gap = Math.max(0,(c.cost[color]||0)-p.bonus[color]-p.tokens[color]);
    if(gap<=0) return;
    const tot = COLORS.reduce((a,x)=>a+Math.max(0,(c.cost[x]||0)-p.bonus[x]-p.tokens[x]),0);
    if(tot<=3) s += (c.pts+0.5)*(3-tot)*0.45;
  });
  s -= Math.max(0, p.tokens[color]-3)*0.55;         /* 同色囤积边际递减 */
  return s;
}
function aiDiscountAsset(v,pi){
  const p=v.players[pi];
  let s=0;
  COLORS.forEach(c=>{ const b=p.bonus[c]; if(b>0) s += b + Math.max(0,b-3)*0.6; });
  return s;
}
function aiNobleCloseness(v,pi){
  const p=v.players[pi];
  let s=0;
  v.nobles.forEach(x=>{
    if(x.taken!==null) return;
    const gap = COLORS.reduce((a,c)=>a+Math.max(0,(x.cost[c]||0)-p.bonus[c]),0);
    s += gap===0 ? 3 : 3*Math.exp(-gap/2.5);
  });
  return s;
}
function aiTokenSurplus(v,pi){
  const p=v.players[pi];
  let s=0;
  COLORS.forEach(c=>{ s += Math.max(0, p.tokens[c]-4)*0.7; });
  const total = aiTotalTok(p);
  s += Math.max(0,total-10)*1.2 + Math.max(0,total-7)*0.12;
  return s;
}
/* 我把这张卡从市场上摘走,对手损失的期望分 */
function aiOpponentThreatGain(v,pi,card){
  let g=0;
  v.players.forEach((op,i)=>{
    if(i===pi) return;
    const need = COLORS.reduce((a,c)=>a+Math.max(0,(card.cost[c]||0)-op.bonus[c]-op.tokens[c]),0);
    const eff = need - Math.min(need, op.tokens.O);
    if(eff<=0) g += card.pts + 1.2;
    else if(eff<=2 && card.pts>=2) g += card.pts*0.6;
    else g += Math.max(0,card.pts-0.5)*0.2/(1+eff);
  });
  return card.pts>=3 ? g*1.3 : g;
}
/* 折扣引擎价值:这张卡的色彩能替未来省下多少现金
   (按在售/已预定卡在该色上的缺口累计;高手会为此买 0 分卡) */
function aiBonusLift(lists,color,bonus){
  let s=0;
  lists.forEach(list=>list.forEach(c=>{
    if(c.color!==color) return;
    const need=(c.cost[color]||0)-(bonus[color]||0);
    if(need>0) s += Math.min(need,2)*0.3;
  }));
  return s;
}
/* 距离最近的开放贵族在该色上还差几层折扣(贵族只认折扣,不认散宝石) */
function aiNobleNeed(v,pi,color){
  const p=v.players[pi];
  let g=0;
  v.nobles.forEach(x=>{
    if(x.taken!==null) return;
    const gap = COLORS.reduce((a,c)=>a+Math.max(0,(x.cost[c]||0)-p.bonus[c]),0);
    if(gap<=4) g = Math.max(g, Math.max(0,(x.cost[color]||0)-p.bonus[color]));
  });
  return g;
}
/* 贪心估算:该玩家还要几个回合到 15 分(越小越危险) */
function aiRaceTurns(v,pi){
  const p=v.players[pi];
  const tok={...p.tokens}, bonus={...p.bonus}, bank={...v.tokens};
  const board={1:v.board[1].slice(),2:v.board[2].slice(),3:v.board[3].slice()};
  const deck ={1:v.deck[1].slice(),2:v.deck[2].slice(),3:v.deck[3].slice()};
  const res  = p.reserved.slice();
  const fake = {tokens:tok, bonus};
  const lists = [res,board[1],board[2],board[3]];
  /* 贵族状态用本地覆盖集合模拟,绝不写回 v.nobles(共享对象) */
  const nTaken = new Set(); v.nobles.forEach(x=>{ if(x.taken!==null) nTaken.add(x); });
  const gapOf = c => COLORS.reduce((a,x)=>a+Math.max(0,(c.cost[x]||0)-bonus[x]-tok[x]),0);
  const drop  = (c,fromRes)=>{
    if(fromRes){ const k=res.indexOf(c); if(k>=0) res.splice(k,1); return; }
    const b=board[c.lv], k=b.indexOf(c);
    if(k>=0) b.splice(k,1);
    aiSimRefillLocal(board,deck,c.lv);
  };
  let pts=p.pts, turns=0;
  for(let guard=0; guard<20 && pts<AI_END_pts; guard++){
    /* 1) 先买当下就买得起、且真正有价值的卡(0 分卡只在缺该色折扣时才碰) */
    let buy=null, bs=-Infinity;
    const scanBuy=(list,fromRes)=>list.forEach(c=>{
      if(c.pts<=0 && bonus[c.color]>=2) return;
      const gap = gapOf(c);
      if(gap > tok.O) return;                       /* 买不起 */
      const sc = c.pts*1.5 + c.lv*0.5 + (c.pts>0?2:0) + (fromRes?0.4:0)
        + aiBonusLift(lists,c.color,bonus);
      if(sc>bs){ bs=sc; buy={card:c,fromRes}; }
    });
    scanBuy(res,true);
    for(const lv of [1,2,3]) scanBuy(board[lv],false);
    if(buy){
      const c=buy.card, pay=costFor(fake,c);
      for(const x of COLORS){ tok[x]-=pay[x]; bank[x]+=pay[x]; }
      tok.O-=pay.O; bank.O+=pay.O;
      bonus[c.color]++; pts+=c.pts; turns++;
      drop(c,buy.fromRes);
      /* 贵族是白送的 3 分:漏记会让 4-4-4 这类路线在模型里永远 0 进度 */
      v.nobles.forEach(x=>{
        if(nTaken.has(x)) return;
        if(COLORS.every(k=>bonus[k]>=(x.cost[k]||0))){ nTaken.add(x); pts+=3; }
      });
      continue;
    }
    /* 2) 买不起 → 锁定性价比最高的正分目标,按合法规则拿一轮宝石 */
    let tgt=null, tev=Infinity, tval=-Infinity;
    const scanTgt=(list)=>list.forEach(c=>{
      if(c.pts<=0) return;
      const gap = gapOf(c), eff = gap - Math.min(gap, tok.O);
      if(eff<=0) return;
      const val = (c.pts*2 + c.lv*0.8)/(1+eff);
      if(val>tval || (val===tval && eff<tev)){ tval=val; tev=eff; tgt=c; }
    });
    scanTgt(res);
    for(const lv of [1,2,3]) scanTgt(board[lv]);
    if(!tgt) break;
    const need={};
    COLORS.forEach(x=>{ need[x]=Math.max(0,(tgt.cost[x]||0)-bonus[x]-tok[x]); });
    const order=COLORS.filter(x=>need[x]>0).sort((a,b)=>need[b]-need[a] || bank[b]-bank[a]);
    let took=0;
    const give=(x,k)=>{ bank[x]-=k; tok[x]+=k; need[x]-=k; took+=k; };
    for(const x of order){ if(need[x]>=2 && bank[x]>=4){ give(x,2); break; } }   /* 2 同色 */
    if(took===0){                                                                /* ≤3 异色 */
      const picked=new Set();
      for(const x of order){
        if(picked.size>=3) break;
        if(need[x]>0 && bank[x]>0){ give(x,1); picked.add(x); }
      }
    }
    if(took===0) break;                                                          /* 市场已空 */
    turns++;
  }
  const luck = pi===v.me ? 0 : p.hiddenRes*0.35;     /* 对手暗牌带来的运气折减 */
  return turns + Math.max(0,AI_END_pts-pts)*0.6 - luck;
}
function aiSimRefillLocal(board,deck,lv){
  if(board[lv].length<4 && deck[lv].length) board[lv].push(deck[lv].pop());
}
function aiTurnsLeft(v){
  if(v.endTriggeredBy<0) return 99;
  return ((v.endTriggeredBy - v.me + v.n) % v.n) + 1;
}
/* 「回合机会成本」:race 模型对每类动作都假设完美转化,
   但只有买卡是把分数落袋,拿宝石/预定都是纸面进度 → 按回合数折价 */
function aiTempoCost(a,prof){
  const w=(prof&&prof.w)||{};
  if(a.kind==="buy") return 0;
  if(a.kind==="res") return w.tempoRes!==undefined ? w.tempoRes : 1.1;
  if(a.kind==="resdeck") return w.tempoDeck!==undefined ? w.tempoDeck : 2.2;
  return w.tempoGems!==undefined ? w.tempoGems : 0.6;
}
/* ── 轮流贪心推演:双方在同一个市场上交替行动到 15 分,直接估计「谁先撞线」 ── */
function aiPlayoutStep(v,pi){
  const p=v.players[pi];
  const lists=[p.reserved, v.board[1], v.board[2], v.board[3]];
  let best=null, bs=-Infinity;
  const scan=(list,fromRes)=>list.forEach(c=>{
    if(!canAfford(p,c)) return;
    if(c.pts<=0 && p.bonus[c.color]>=3) return;
    const sc = c.pts*3 + c.lv*1.5 + (fromRes?0.3:0) + (p.bonus[c.color]<2?0.8:0)
      + aiBonusLift(lists,c.color,p.bonus);
    if(sc>bs){ bs=sc; best={card:c,fromRes}; }
  });
  scan(p.reserved,true);
  for(const lv of [1,2,3]) scan(v.board[lv],false);
  if(best){ aiSimBuy(v,pi,best.card,best.fromRes); return; }
  let tgt=null, tv=-Infinity;
  const scanT=(list)=>list.forEach(c=>{
    if(c.pts<=0) return;
    const gap = COLORS.reduce((a,x)=>a+Math.max(0,(c.cost[x]||0)-p.bonus[x]-p.tokens[x]),0);
    const val=(c.pts*2+c.lv*0.8)/(1+gap);
    if(val>tv){ tv=val; tgt=c; }
  });
  scanT(p.reserved);
  for(const lv of [1,2,3]) scanT(v.board[lv]);
  const need={};
  COLORS.forEach(x=>{
    const cardGap = tgt ? Math.max(0,(tgt.cost[x]||0)-p.bonus[x]-p.tokens[x]) : 0;
    /* 贵族路线也要靠散宝石以外的折扣堆出来,否则推演里永远看不到 4-4-4 */
    need[x]= cardGap + aiNobleNeed(v,pi,x)*0.6;
  });
  const order=COLORS.slice().sort((a,b)=>need[b]-need[a] || v.tokens[b]-v.tokens[a]);
  const sel=emptyGemSelection();
  let took=0;
  for(const x of order){ if(need[x]>=2 && v.tokens[x]>=4){ sel[x]=2; took=2; break; } }
  if(took===0) for(const x of order){ if(took>=3) break; if(v.tokens[x]>0){ sel[x]++; took++; } }
  aiSimTake(v,pi,sel);
}
function aiPlayout(v,pi,rounds){
  const g=aiViewClone(v);
  const ops=[]; g.players.forEach((o,i)=>{ if(i!==pi) ops.push(i); });
  const maxOf = () => Math.max(...ops.map(i=>g.players[i].pts));
  const myPts = () => g.players[pi].pts;
  for(let r=0; r<(rounds||10); r++){
    aiPlayoutStep(g,pi);
    if(myPts()>=AI_END_pts) return AI_END_pts + Math.max(0, AI_END_pts - maxOf());
    for(const oi of ops){
      aiPlayoutStep(g,oi);
      if(g.players[oi].pts>=AI_END_pts) return -(AI_END_pts + Math.max(0, AI_END_pts - myPts()));
    }
  }
  return myPts() - maxOf();
}
function simScore(v,pi,prof,block,tempo){
  const w=prof.w, p=v.players[pi];
  const endgame = aiTurnsLeft(v)<=3;
  let s = p.pts * (endgame?w.ptsEnd:w.pts);
  if(p.pts>=AI_END_pts) s += 12;
  if(w.play){
    s += aiPlayout(v,pi,w.rounds||10) * w.play;
  }else if(w.race){
    const mine = aiRaceTurns(v,pi);
    let threat = 99;
    v.players.forEach((o,i)=>{ if(i!==pi) threat = Math.min(threat, aiRaceTurns(v,i)); });
    s += (threat - mine) * w.race * (endgame?0.5:1);
  }
  s += aiDiscountAsset(v,pi) * w.discount;
  s += aiNobleCloseness(v,pi) * w.noble;
  s += p.tokens.O * (endgame?w.goldEnd:w.gold) * 0.6;
  s -= aiTokenSurplus(v,pi) * w.surplus;
  if(block) s -= block * (endgame?w.blockEnd:w.block);
  if(tempo) s -= tempo * (w.race||1) * (endgame?1.4:1);
  return s;
}

/* ═════════════════ 大师档:二人局攻略规则引擎 ═════════════════
 * 「效率至上,攻防一体」——不搜索、不抽样、不建模对手,严格照攻略三阶段出牌:
 *   开局:先看全场定关键资源色(三级牌需求色) → 抢高性价比牌,目标高分牌用黄金预约;
 *   中期:一次拿宝石至少推进两张牌,顺手卡住对手的「命门色」;
 *   后期:有人接近 10 分即进入冲刺 —— 轮次大于一切,能绝杀就预约绝杀,否则囤关键色。
 * 信息约束与前瞻内核一致:只用牌桌 / 公共池 / 公开折扣与分数 / 贵族池,
 * 不读牌库顺序,也不读对手预留内容(只知张数)。
 * 分值量纲与内核相同(分等价),但只在本档内部横向比较。
 */
const GUIDE_END_pts = 10;   /* 攻略:「有人接近 10 分」= 进入冲刺阶段 */
const GUIDE_TIER = {        /* 攻略给的性价比档位表:总宝石花费 → 分数 */
  1:{"4,1":4, "3,0":3, "4,0":2, "5,0":1},
  2:{"6,3":4, "5,2":3, "7,2":2, "8,2":2, "7,1":1, "8,1":1},
  3:{"10,5":4, "7,4":3, "12,4":2, "14,3":1},
};
function guideCostTotal(card){ return COLORS.reduce((s,c)=>s+(card.cost[c]||0),0); }
function guideTier(card){
  const t = GUIDE_TIER[card.lv];
  return (t && t[guideCostTotal(card)+","+card.pts]) || 1;
}
/* 分数是主菜,攻略认定的性价比与折扣层级是配菜 */
function guideCardValue(card){ return card.pts + guideTier(card)*.4 + card.lv*.12; }
function guideGap(p,card){ return COLORS.reduce((s,c)=>s+Math.max(0,(card.cost[c]||0)-p.bonus[c]-p.tokens[c]),0); }
function guideEff(p,card){ const g=guideGap(p,card); return g - Math.min(g, p.tokens.O); }
function guidePhase(v,pi){
  if(v.endTriggeredBy >= 0 || v.players.some(o=>o.pts >= GUIDE_END_pts)) return "end";
  return v.players[pi].cards < 3 ? "open" : "mid";
}
function guideCtx(){
  const v=aiBaseView(), pi=v.me, p=v.players[pi];
  const phase=guidePhase(v,pi);
  const boardAll=[].concat(v.board[1],v.board[2],v.board[3]);
  /* 开局「先看全场」:三级牌极难被翻新 → 它的需求色就是本局的关键资源色 */
  const key=emptyGemSelection();
  const addKey=(c,w)=>COLORS.forEach(x=>{ const n=c.cost[x]||0; if(n) key[x]+=w*Math.min(n,3); });
  boardAll.forEach(c=>addKey(c, c.lv===3?3 : c.lv===2?1.2 : .3));
  p.reserved.forEach(c=>addKey(c,2));                       /* 已宣告的目标 */
  COLORS.forEach(x=>{ key[x]+= p.bonus[x]*2.5 + Math.min(p.tokens[x],3)*.4; });
  const keyMax=Math.max(1e-6, key.W, key.B, key.G, key.R, key.K);
  /* 对手的「命门」:公开折扣色 + 只差这一色就能买走的分数牌 */
  const oppNeed=emptyGemSelection();
  const others=v.players.filter((o,i)=>i!==pi);
  COLORS.forEach(x=>{ others.forEach(op=>{ oppNeed[x]+=op.bonus[x]*1.1; }); });
  others.forEach(op=>{
    boardAll.forEach(c=>{
      if(c.pts<=0) return;
      let tot=0; const gaps=[];
      COLORS.forEach(x=>{
        const g=Math.max(0,(c.cost[x]||0)-op.bonus[x]-op.tokens[x]);
        if(g>0){ gaps.push([x,g]); tot+=g; }
      });
      if(!tot || tot>3 || tot-Math.min(tot,op.tokens.O)>3) return;
      gaps.forEach(([x,g])=>{ oppNeed[x]+= (c.pts*.5 + c.lv*.4)*(g/tot); });
    });
  });
  /* 目标牌:还没买得起、但已在方向上的高性价比牌;冲刺阶段只留「一步能兑现的分」。 */
  const pool=[];
  p.reserved.concat(boardAll).forEach(c=>{
    const gap=guideGap(p,c); if(gap<=0) return;
    const eff=guideEff(p,c); if(eff<=0) return;
    const tier=guideTier(c);
    if(phase==="end"){ if(c.pts<=0 || eff>3) return; }
    else if(tier<2 && c.pts<2) return;
    pool.push({card:c, gap, eff, value:guideCardValue(c)});
  });
  pool.sort((a,b)=>b.value/(1+b.eff) - a.value/(1+a.eff));
  /* 可及范围随发展深度放宽 —— 开局就死盯三级牌是本档最初的死法:
     五个宝石的缺口补不满,手里十颗宝石全是废色。 */
  const reach = Math.min(6, 3 + p.cards);
  const near = pool.filter(t=>t.eff<=reach);
  /* 主攻目标只留头部三个:攻略要「方向清晰」,把宝石摊到十张牌上等于什么都没推进;
     但也不能只盯一张 —— 那样一次拿宝石就只能推进一条线,效率反而最低。
     一张都够不着时(开局)退回头看最优先的那张,至少方向不是瞎选的。 */
  const focus = near.length ? near.slice(0,3) : pool.slice(0,1);
  return {v, pi, p, phase, key, keyMax, oppNeed, focus};
}
/* 买下这张牌能否立刻请来贵族(攻略未提,但 +3 分是实打实的回合收益) */
function guideNobleGain(v,pi,card){
  const p=v.players[pi];
  let gain=0;
  v.nobles.forEach(x=>{
    if(x.taken!==null) return;
    const gap=COLORS.reduce((s,c)=>s+Math.max(0,(x.cost[c]||0)-p.bonus[c]-(c===card.color?1:0)),0);
    if(gap===0) gain=3;
  });
  return gain;
}
/* 摘掉这张牌给对手造成的损失 */
function guideDeny(ctx,card){ return aiOpponentThreatGain(ctx.v,ctx.pi,card); }
/* 为这张牌已经投入多少:攻略要保护「已经宣告的目标」,不半途而废 */
function guideCommit(ctx,card){
  const p=ctx.p;
  let tot=0, have=0, dirs=0, hit=0;
  COLORS.forEach(x=>{
    const need=card.cost[x]||0; if(!need) return;
    tot+=need; have+=Math.min(need, p.bonus[x]+p.tokens[x]);
    dirs++; if(ctx.key[x] >= ctx.keyMax*.5) hit++;
  });
  if(!tot) return 1;
  return Math.min(1, have/tot*.8 + hit/dirs*.4);
}
/* 预约的战略价值:绝杀 > 抢高分牌 > (不占预留位) */
function guideReserveValue(ctx,card){
  const {v,pi,p,phase}=ctx;
  /* 绝杀:对手下回合买走它就能撞线 → 哪怕用不上也必须摘掉 */
  let alarm=0;
  v.players.forEach((op,i)=>{
    if(i===pi || guideEff(op,card)>0) return;
    alarm=Math.max(alarm, op.pts+card.pts+guideNobleGain(v,i,card));
  });
  if(alarm>=AI_END_pts) return 40;          /* 绝杀 */
  if(phase==="end") return 0;               /* 后期不做长期布局 */
  if(card.lv===1) return 0;                 /* 一级牌会不断翻新,不值得占预留位 */
  if(p.reserved.length>=3) return 0;
  const tier=guideTier(card);
  if(tier<3) return 0;                      /* 只抢攻略认定的高分性价比牌 */
  /* 长期布局型预约:只为自己真正在做的方向占位 —— 预约一张永远买不到的牌
     等于白送对手一个信息 + 浪费一个回合。价值高于「随手拿三个宝石」,但绝不高于「这回合就买牌」。 */
  const commit=guideCommit(ctx,card);
  /* 「已投入」门槛只管中期的顺路占位:攻略要求开局就在投入之前把目标锁下来 */
  if(phase!=="open" && commit < .35) return 0;
  const deny=Math.min(guideDeny(ctx,card),3);
  let s = 1.3*commit + tier*.3 + card.pts*.28 + deny*.3;
  /* 开局抢预约本身是一次变现:既锁定未来的高分牌,又向对手宣告方向。
     所以按落袋量纲给分(可以和拿宝石正面竞争),但仍不高于「这回合就能买走的牌」。 */
  if(phase==="open") return Math.min(3.4, s + .4 + card.pts*.3);
  return Math.min(2.2, s);
}
/* 合法拿宝石组合:最多 3 个;同色双拿要求公共池 >= 4(与本实现的人类侧规则一致) */
function guideGemCombos(ctx){
  const v=ctx.v, out=[], seen=new Set();
  const push=arr=>{
    const sel=emptyGemSelection(); arr.forEach(c=>sel[c]++);
    const k=aiSelKey(sel);
    if(seen.has(k)) return;
    seen.add(k); out.push(sel);
  };
  for(let i=0;i<5;i++) for(let j=i+1;j<5;j++) for(let k=j+1;k<5;k++){
    const a=COLORS[i],b=COLORS[j],c=COLORS[k];
    if(v.tokens[a]&&v.tokens[b]&&v.tokens[c]) push([a,b,c]);
  }
  COLORS.forEach(c=>{ if(v.tokens[c]>=4) push([c,c]); });
  for(let i=0;i<5;i++) for(let j=i+1;j<5;j++)
    if(v.tokens[COLORS[i]]&&v.tokens[COLORS[j]]) push([COLORS[i],COLORS[j]]);
  COLORS.forEach(c=>{ if(v.tokens[c]) push([c]); });
  return out;
}
/* 拿宝石是「投资」,买牌是「落袋」——两者必须换算到同一量纲才可比:
 *   进度分 = 目标价值 × (这次推进多少 / 还差多少) × 等待折算
 *   完成分 = 目标价值 × 兑现折算(下回合就能买走,已接近立刻落袋)
 * 折算永远小于 1(含 guideGemScore 里的 near 乘子:前期 1.5 × .62 = .93,
 * 后期 near 恒为 1 → 1 × .95 = .95,两条都 < 1),
 * 所以「这回合买牌」恒大于「为下回合买牌拿宝石」——
 * 这正是攻略的「用最少的行动换来最多的分数」。 */
const GUIDE_PROGRESS = .35;   /* 远期进度:一个回合的等待要重折 */
const GUIDE_FINISH   = .62;   /* 下回合即可买走 */
const GUIDE_PROGRESS_END = .10;   /* 冲刺阶段:远期进度基本无意义 */
const GUIDE_FINISH_END   = .95;   /* 冲刺阶段:轮次大于一切,一步到位最值 */
function guideGemScore(ctx,sel){
  const p=ctx.p, end=ctx.phase==="end";
  const n=COLORS.reduce((s,c)=>s+(sel[c]||0),0);
  const fw = end ? GUIDE_FINISH_END : GUIDE_FINISH;
  const pw = end ? GUIDE_PROGRESS_END : GUIDE_PROGRESS;
  /* 手里已经堆了一把宝石:此时再拿「还差得远」的颜色就是纯囤积,一律重折 */
  const cash = !end && aiTotalTok(p) >= 6;
  let adv=0, sum=0, best=0, done=0;
  ctx.focus.forEach(t=>{
    let ng=0;
    COLORS.forEach(c=>{ ng += Math.max(0,(t.card.cost[c]||0)-p.bonus[c]-p.tokens[c]-(sel[c]||0)); });
    const left = Math.max(0, ng - p.tokens.O);         /* 黄金能补的部分视为已到位 */
    const gained = t.eff - left;
    if(gained<=0) return;
    adv++;
    let w = left===0 ? fw : pw;
    if(cash && left>0) w *= .3;
    /* 一步之遥的目标优先推完,但上限必须守住下面那条量纲契约:
       max(near) × fw < 1,否则「为下回合买牌而拿宝石」会反超「这回合就买牌」。
       后期 fw 已经等于 .95(本身就在表达"一步到位"),near 再乘一次是重复计价,
       且 1.5×.95>1 会直接破约 —— 所以后期不再加成。 */
    const near = end ? 1 : t.eff<=1 ? 1.5 : t.eff<=2 ? 1.3 : 1;
    const g = t.value*(gained/Math.max(1,t.eff))*w*near;
    sum+=g; if(g>best) best=g;
    /* 这次拿完下回合就能买走的牌,值多少分 —— 用来判断「值不值得为它空转一回合」 */
    if(left===0 && t.card.pts>0) done=Math.max(done, t.value+guideNobleGain(ctx.v,ctx.pi,t.card));
  });
  /* 主攻目标之间只给少量协同加成:同时推进两张是好棋,但不能靠多线摊薄刷分 */
  let s = best + (sum-best)*.25;
  if(adv>=2 && !end) s += .25;
  let blk=0;                                              /* 「防」的三项加成单独累计,见下方封顶 */
  COLORS.forEach(c=>{
    const k=sel[c]||0; if(!k) return;
    blk += k*(ctx.key[c]/ctx.keyMax)*.14;                 /* 同价时优先囤方向色 */
    /* 卡命门:攻略要求「抢走对手急需的颜色」,后期升级成「囤积关键色让他拿不到」 */
    const need=Math.min(ctx.oppNeed[c],4);
    blk += k*need*(end?1.0:.18);
    if(ctx.v.tokens[c]-k<=0) blk += need*(end?1.8:.9);    /* 抽干公共池 = 这一色彻底封锁 */
    /* 避免无意义囤积:主攻目标完全用不上的颜色才扣分,单色堆过量再罚 */
    let want=0;
    ctx.focus.forEach(t=>{ want += Math.max(0,(t.card.cost[c]||0)-p.bonus[c]-p.tokens[c]); });
    if(!end && ctx.focus.length){
      if(want===0) s -= k*.5;
      if(p.tokens[c]+k>5) s -= (p.tokens[c]+k-5)*.4;
    }
  });
  /* 攻防一体 ≠ 以防为主:封锁是加法项且可三项叠加,不封顶时一颗卡位宝石就能顶上半张三级牌,
     「这回合买牌 / 下回合撞线」永远比不过「顺手卡他一下」。所以给防的总和设上限,
     让它只在推进程度相当时决定挑哪几颗宝石 —— 符合攻略「轮次大于一切,囤色是辅助」。 */
  s += Math.min(blk, end ? 2.0 : 1.0);
  if(aiTotalTok(p)+n>9) s -= end ? .3 : 1.2;
  return {s, done};
}
/* 攻略版弃牌:黄金 > 目标牌缺口色 > 方向色 > 卡位色,丢掉冗余 */
function guideTokenKeepValue(ctx,color){
  if(color===GOLD) return 9;
  const p=ctx.p;
  let s=(ctx.key[color]/ctx.keyMax)*1.2 + Math.min(ctx.oppNeed[color],4)*.15;
  ctx.focus.forEach(t=>{
    const g=Math.max(0,(t.card.cost[color]||0)-p.bonus[color]-p.tokens[color]);
    if(g>0) s += Math.min(g,2)*t.value*.25;
  });
  s -= Math.max(0, p.tokens[color]-4)*.4;
  return s;
}
function aiGuideDecide(){
  const ctx=guideCtx();
  const {v,pi,p,phase}=ctx;
  const boardAll=[].concat(v.board[1],v.board[2],v.board[3]);
  /* ── 铁律 1:撞线买牌 —— 「轮次大于一切」,一回合结束比赛 ── */
  let win=null;
  const scanWin=(list,fromRes)=>list.forEach(c=>{
    if(!canAfford(p,c)) return;
    const after=p.pts+c.pts+guideNobleGain(v,pi,c);
    if(after>=AI_END_pts && (!win || after>win.after))
      win={after, a:{kind:"buy", card:c, fromRes, level:c.lv}};
  });
  scanWin(p.reserved,true);
  for(const lv of [1,2,3]) scanWin(v.board[lv],false);
  if(win) return win.a;
  /* ── 铁律 2:绝杀 —— 对手下回合买走这张就撞线,买走 > 预约摘掉 ── */
  let kill=null;
  boardAll.forEach(c=>{
    v.players.forEach((op,i)=>{
      if(i===pi || guideEff(op,c)>0) return;                     /* 对手现在买不起 */
      if(op.pts+c.pts+guideNobleGain(v,i,c) < AI_END_pts) return;/* 买走也撞不了线 */
      const sc = c.pts - guideEff(p,c)*0.2;                      /* 自己用上更好 */
      if(!kill || sc>kill.sc) kill={sc, card:c, level:c.lv};
    });
  });
  if(kill){
    if(canAfford(p,kill.card)) return {kind:"buy", card:kill.card, fromRes:false, level:kill.level};
    if(p.reserved.length<3) return {kind:"res", card:kill.card, fromRes:false, level:kill.level};
  }
  /* ① 能买到手的牌:落袋优先,冲刺阶段不为 0 分牌浪费回合 */
  let buy=null;
  const consider=(card,fromRes)=>{
    const noble=guideNobleGain(v,pi,card);
    let val=guideCardValue(card)+noble+guideDeny(ctx,card)*.6+(fromRes?.4:0);
    if(phase==="end" && card.pts===0) val-=9;
    else if(card.pts===0 && guideTier(card)<=2) val-=1;
    if(!buy || val>buy.val) buy={val, a:{kind:"buy", card, fromRes, level:card.lv}};
  };
  p.reserved.forEach(c=>{ if(canAfford(p,c)) consider(c,true); });
  for(const lv of [1,2,3]) v.board[lv].forEach(c=>{ if(canAfford(p,c)) consider(c,false); });
  /* ② 预约:开局抢高分牌(绝杀已由铁律 2 处理) */
  let res=null;
  if(p.reserved.length<3){
    for(const lv of [1,2,3]) v.board[lv].forEach(c=>{
      const val=guideReserveValue(ctx,c);
      if(val>0 && (!res || val>res.val)) res={val, a:{kind:"res", card:c, fromRes:false, level:lv}};
    });
  }
  /* ③ 拿宝石:聚焦推进 + 卡位 */
  let gem=null;
  guideGemCombos(ctx).forEach(sel=>{
    const r=guideGemScore(ctx,sel);
    if(!gem || r.s>gem.val) gem={val:r.s, done:r.done, a:{kind:"gems", sel}};
  });
  /* 效率至上:能变现就绝不空转 —— 除非这批宝石下回合就能兑现一张更大的分。
     攻略的「用最少的行动换最多的分数」按「分数/回合」计:这回合能换回分数的牌就是一次变现,
     1 分牌也不例外(它常常比再攒两回合去买 3 分牌更快);0 分牌只是引擎,
     除非它在攻略性价比表里排到头部,否则不配落袋溢价。 */
  const worth = buy && (phase==="end" || buy.a.card.pts>=1 || guideTier(buy.a.card)>=3);
  const cashBonus = worth ? 1 + buy.a.card.pts : .3;
  if(worth && !(gem && gem.done >= buy.val + .5)) return buy.a;
  const cands=[];
  if(buy)  cands.push({val:buy.val+cashBonus, a:buy.a});
  if(res)  cands.push({val:res.val,     a:res.a});
  if(gem)  cands.push({val:gem.val,     a:gem.a});
  cands.sort((x,y)=>y.val-x.val);
  if(cands.length) return cands[0].a;
  /* 兜底:牌库盲留(优先三级) → 拿宝石 → 交给上层跳过回合 */
  if(p.reserved.length<3){
    for(const lv of [3,2,1]) if(v.deckLen[lv]>0) return {kind:"resdeck", card:null, level:lv};
  }
  const any=guideGemCombos(ctx)[0];
  return any ? {kind:"gems", sel:any} : null;
}
/* ═════════════════ 宗师档:六级优先级瀑布(严格档) ═════════════════
 * 逐字照「二人局高手AI逻辑(完整详尽版)」实现。六个层级按优先级串成硬瀑布:
 *   层级0 终局阻断 → 层级1 高分牌预约 → 层级2 贵族冲刺 → 层级3 购买一级牌
 *   → 层级4 拿宝石(含卡位) → 层级5 保底拿取
 * 上一层级只要给出可执行动作就直接出牌,不再与下一层级比价 —— 这是它与大师档
 * (buy/res/gems 三路打分归并)的根本区别:在这里「优先级」本身就是结论。
 * 三原则:阻断优先(层级0 亏节奏也在所不惜)/ 效率至上(跳过一切亏本交易)/
 *        贵族备选(层级2 不产动作,只把缺色写进层级3/4 的需求分)。
 * 信息约束与各档一致:只读公开信息,不读牌库顺序,也不读对手预留内容(只知张数)。
 * 规格书的留白与自相矛盾之处都在对应函数就地补齐,并写明取舍理由。
 * 代价:硬瀑布不做「这张牌 vs 这颗宝石」的回报比较,买牌回合占比低于困难档,
 *   因此压不过困难档;强弱关系与实测数字见 AI_DIFFICULTIES 的注释。
 */
const STRICT = {
  /* 第五部分关键参数表:WIN_SCORE=15 就是 AI_END_pts,BLOCK_BUY_TURNS 折算成下面的成本窗口 */
  BLOCK_TRIGGER_SCORE:10, BLOCK_WINDOW_COST:6,   /* 缺 ≤6 个宝石 ≈ 1-2 回合能买到 */
  PREMIUM_3_SCORE:4, PREMIUM_2_SCORE:3, RESERVE_DISCOUNT_MIN:2,
  GOLD_MAX_FOR_RESERVE:2, GOLD_RESERVE_EMERGENCY:1,
  NOBLE_MAX_MISSING:2, NOBLE_COST_PER_POINT_MAX:3,
  PURCHASE_1_GOOD_COST:4, PURCHASE_1_GOOD_SCORE:1, PURCHASE_1_CHEAP_COST:3,
  GEM_MAX:10,
  /* 攻略留白补齐:层级3 只认一级 A/B/C,而撞线要 15 分 —— 光靠 1 分牌永远赢不了。
     于是「拿不动宝石」时必须有个兑现出口:宝石空间 ≤ SAT_ROOM(即已有 8 个以上)就允许
     把资源换成分数最高的牌。这不是给攻略加权,而是它的水位线本身:握着 10 个宝石再过一轮
     就要白丢,那才是真正的亏本交易。 */
  SAT_ROOM:2,
  /* 攻略把 B/C 类(0 分一级牌)定位为「建引擎」,却没给停止条件 —— 实测它会一路买到 15 张牌
     仍在买 0 分卡:折扣越堆越多,分数永远停在 12-13。0 分卡只在引擎窗口内值得占一个回合,
     超过张数就只算「资源饱和兑现」(rank 14),否则一律让给层级4 的定向拿取。 */
  ENGINE_MAX_CARDS:6,
  BUY_TIER_MIN:3,   /* 层级3 落袋门槛:性价比表头部 */
  PREMIUM_MAX_GAP:6,   /* 层级1 只锁「1-2 回合内买得下来」的高分牌,否则预约=死资产 */
  /* 层级3 同优先级细分:场上需求次数 0.3 / 贵族匹配 1.0 / 对手最缺色 0.5 */
  W_DEMAND:.3, W_NOBLE_MATCH:1.0, W_BLOCK_COLOR:.5,
  ADVANCE_BONUS:1.5,   /* 模式 A:一次拿宝石同时推进 ≥2 张待购牌 */
};
/* 这张牌在 color 上「扣掉折扣后还差着」。只用折扣不用宝石:
   攻略禁忌「对手已有大量折扣的颜色卡位无效」正好由此自动成立(折扣覆盖 → 需求为 0)。 */
function strictNeeds(card,color,bonus){ return (card.cost[color]||0) - (bonus[color]||0) > 0; }
/* 一次决策的公共上下文:层级4 的「待购牌需求」与「对手最缺色」都要全场统计,
   每层重算既浪费又容易前后不一致,所以整轮只算一次。 */
function strictCtx(){
  const v=aiBaseView(), pi=v.me, p=v.players[pi];
  const boardAll=[].concat(v.board[1],v.board[2],v.board[3]);
  const others=v.players.map((o,i)=>({o,i})).filter(x=>x.i!==pi);
  const ctx={ v, pi, p, boardAll, others, gold:p.tokens.O||0,
              endRound:v.endTriggeredBy>=0, demand:emptyGemSelection(),
              pendSelf:[], oppPend:[], oppLack:null, plan:{targets:[], colors:new Set()} };
  boardAll.forEach(c=>COLORS.forEach(x=>{ if(c.cost[x]) ctx.demand[x]++; }));
  /* 「待购牌」只能按公开信息取:自己 = 预留 + 场上缺口在窗口内 yet 买不起的牌;
     对手 = 场上同样在窗口内的牌(对手预留内容不可见)。场上牌各取价值/效率比最高的 4 张 ——
     次数类统计必须有界,否则五种颜色的需求会被整张牌桌摊平,得分失去分辨力。
     预留牌则无条件全收:它们是层级1 已经宣告的目标,攻略「保护已投入的目标」正在于此。 */
  const pendOf=(pl,list)=>{
    const s=list.map(c=>({c, eff:guideEff(pl,c), gap:guideGap(pl,c)}))
                .filter(x=>x.gap>0 && x.eff>0 && x.gap<=STRICT.BLOCK_WINDOW_COST)
                .map(x=>({c:x.c, r:guideCardValue(x.c)/(1+x.eff)}));
    s.sort((a,b)=>b.r-a.r);
    return s.slice(0,4).map(x=>x.c);
  };
  ctx.pendSelf=p.reserved.slice().concat(pendOf(p, boardAll));
  ctx.oppPend=others.map(x=>({bonus:x.o.bonus, cards:pendOf(x.o, boardAll)}));
  const lack=emptyGemSelection();
  ctx.oppPend.forEach(e=>e.cards.forEach(c=>COLORS.forEach(x=>{ if(strictNeeds(c,x,e.bonus)) lack[x]++; })));
  COLORS.forEach(x=>{ if(lack[x]>0 && (ctx.oppLack===null || lack[x]>lack[ctx.oppLack])) ctx.oppLack=x; });
  ctx.plan=strictNoblePlan(ctx);
  return ctx;
}
/* 层级2:贵族冲刺。不产动作,只产出「正在凑的贵族缺色」,供层级3/4 加分。 */
function strictNoblePlan(ctx){
  const p=ctx.p, targets=[], colors=new Set();
  ctx.v.nobles.forEach(n=>{
    if(n.taken!==null) return;
    let sat=0, miss=0; const missing=[];
    COLORS.forEach(c=>{
      if(!(n.cost[c]||0)) return;
      const need=(n.cost[c]||0)-p.bonus[c];
      if(need>0){ miss+=need; missing.push(c); } else sat++;
    });
    if(sat<2 || miss>STRICT.NOBLE_MAX_MISSING) return;       /* 已满足 ≥2 色,且缺牌 ≤2 张 */
    if(miss*4/3 > STRICT.NOBLE_COST_PER_POINT_MAX) return;   /* 每分成本 ≤3 个宝石(每张按 4 估) */
    targets.push({cost:n.cost, missing, miss});
    missing.forEach(c=>colors.add(c));
  });
  return {targets, colors};
}
/* 这次拿宝石把多少张待购牌的缺口真正往前推了(黄金能补的部分视为已到位) */
function strictAdvance(ctx,sel){
  const p=ctx.p;
  let n=0;
  ctx.pendSelf.forEach(c=>{
    const before=guideEff(p,c);
    const gap=COLORS.reduce((s,x)=>s+Math.max(0,(c.cost[x]||0)-p.bonus[x]-p.tokens[x]-(sel[x]||0)),0);
    if(Math.max(0,gap-p.tokens.O) < before) n++;
  });
  return n;
}
/* 层级4 的「拿哪几种宝石」:规格书只给了方向(推进待购牌 / 凑贵族 / 卡对手),没给评价式。
   下面把那三个方向写成可加的边际分 —— 单颗宝石的分量 = 它在自己待购牌上还差着(需求越集中
   权重越高) + 是不是正在凑的贵族缺色 + 是不是对手最缺的那一色,再按已有量递减。
   层级判据与层内评价式都出自规格书本身,不借用其它档位的权重。 */
function strictColorScore(ctx,color,have){
  const p=ctx.p;
  let need=0;
  ctx.pendSelf.forEach(c=>{ if(strictNeeds(c,color,p.bonus)) need++; });
  let s = need * (1 + ctx.demand[color]*STRICT.W_DEMAND);
  if(ctx.plan.colors.has(color)) s += STRICT.W_NOBLE_MATCH;
  if(ctx.oppLack===color)        s += STRICT.W_BLOCK_COLOR;
  return s * Math.max(.25, 1 - Math.min(have,4)*.25);
}
/* 层级4 + 层级5:模式 A(同时推进 ≥2 张待购牌,首选)> 模式 B(卡位)/C(囤关键色)。
   规格书规定先 A 后 B/C 的次序,所以候选集按 A 收窄,再在收窄后的集合里取方向分最高的一组。 */
function strictTake(ctx){
  const p=ctx.p;
  const room=STRICT.GEM_MAX - aiTotalTok(p);
  if(room<=0) return null;
  const pool=guideGemCombos(ctx).filter(sel=>COLORS.reduce((s,c)=>s+sel[c],0) <= room);
  if(!pool.length) return null;
  /* 禁忌:已有 ≥4 的颜色不再拿;拿不动时退回不限禁忌,交由方向分自己递减扣分 */
  const fresh=pool.filter(sel=>COLORS.every(c=> !sel[c] || (p.tokens[c]||0) < 4));
  const src=fresh.length ? fresh : pool;
  const scoreSel=sel=>COLORS.reduce((t,c)=>{
    let v=0;
    for(let i=0;i<sel[c];i++) v+=strictColorScore(ctx,c,(p.tokens[c]||0)+i);
    return t+v;
  },0);
  const modeA=src.filter(sel=>strictAdvance(ctx,sel)>=2);
  let best=null;
  (modeA.length ? modeA : src).forEach(sel=>{
    const s=scoreSel(sel) + (strictAdvance(ctx,sel)>=2 ? STRICT.ADVANCE_BONUS : 0);
    if(!best || s>best.s) best={s, sel};
  });
  return best ? {kind:"gems", sel:best.sel} : null;
}
/* 层级3 的分类表:只认攻略列出的 A/B/C 三类一级牌,其余(含成本 ≥5 的 0 分 D 类)一律不买 */
function strictBuyClass(card){
  if(card.lv!==1) return 0;
  const cost=guideCostTotal(card);
  if(card.pts>=STRICT.PURCHASE_1_GOOD_SCORE && cost<=STRICT.PURCHASE_1_GOOD_COST) return 1; /* A */
  if(card.pts===0 && cost<=STRICT.PURCHASE_1_CHEAP_COST) return 2;                           /* B */
  if(card.pts===0 && cost===STRICT.PURCHASE_1_GOOD_COST) return 3;                           /* C */
  return 0;                                                                                   /* D */
}
function strictBuy1Score(ctx,card){
  let s=card.pts*2 - guideCostTotal(card) + ctx.demand[card.color]*STRICT.W_DEMAND;
  if(ctx.plan.colors.has(card.color)) s+=STRICT.W_NOBLE_MATCH;             /* 顺路补贵族 */
  if(ctx.oppLack && card.color===ctx.oppLack) s+=STRICT.W_BLOCK_COLOR;     /* 抢对手最缺的色 */
  return s;
}
/* 黄金管理(第三部分):黄金当万能宝石买牌一律禁止,只放开两条通道 ——
   ① 获胜的最后一手(由铁律 A 处理)与终局轮的带分牌;② 兑现层级1 预约的高分牌
   (预约它的目的就是为了买得起)。其余情况永远保留 1 个应急黄金。 */
function strictGoldOK(ctx,card,fromRes){
  const use=costFor(ctx.p,card).O;
  if(use<=0) return true;
  if(fromRes && card.lv>=2) return true;
  if(ctx.endRound && card.pts>0) return true;
  return card.pts>=2 && use <= ctx.gold - STRICT.GOLD_RESERVE_EMERGENCY;
}
/* 层级3:购买。补齐 —— 攻略的层级3 只写了一级牌,但那样层级1 预约的高分资产永远兑现不了
   (几乎赢不了),所以购买层同时接受「可兑现的预留牌」与「当场落袋的攻略头部高分牌」。
   再补一条水位线:宝石多到快拿不动(room ≤ SAT_ROOM)时,把资源换成分数最高的牌 ——
   握着 10 个宝石等弃牌阶段白送,比买一张「不在性价比表里」的牌亏得多。 */
function strictBuy(ctx){
  const {v,pi,p}=ctx;
  const room = STRICT.GEM_MAX - aiTotalTok(p);
  const sat = room <= STRICT.SAT_ROOM;
  /* 宝石已到顶 → 拿取只剩"拿一弃一"的原地空转,此时黄金禁忌必须让路。
     否则本档会在一手好牌全部差 1 个黄金时既买不动又不肯买,和对手一轮一个宝石互抽到
     回合上限(实测出现过双方各握 10 宝石、四千多步谁也动不了的死局)。 */
  const capped = room <= 0;
  let best=null;
  const push=(rank,val,a)=>{
    if(!best || rank<best.rank || (rank===best.rank && val>best.val)) best={rank, val, a};
  };
  const consider=(card,fromRes)=>{
    if(!canAfford(p,card)) return;
    if(card.lv===1){
      if(costFor(p,card).O>0 && !capped) return;           /* 一级引擎牌不吃黄金(到顶时除外) */
      const cls=strictBuyClass(card);
      /* A 类带分,任何时候都算「即时收益」;B/C 类 0 分,只有引擎还没成型时才值得占回合。 */
      const inEngine = !card.pts ? p.cards < STRICT.ENGINE_MAX_CARDS : true;
      if(cls && inEngine) push(10+cls, strictBuy1Score(ctx,card), {kind:"buy", card, fromRes, level:1});
      /* sat 这个出口不能再按 cls / pts 收窄:宝石到顶(room=0)时层级4 与层级5 都必返 null,
         预留也满 → 这里是唯一还有产出的分支。曾照规格书「D 类永远不买」收紧过一次,
         结果一半以上回合无事可做,还复现了上面那个死局,胜率明显下滑。
         所以宁可违背这条禁忌:宝石拿不动时买任何买得动的牌,都好过整轮无事可做。 */
      else if(sat) push(14, strictBuy1Score(ctx,card), {kind:"buy", card, fromRes, level:1});
      return;
    }
    if(!fromRes && !sat && guideTier(card)<STRICT.BUY_TIER_MIN) return;   /* 场上只落袋性价比表头部的高分牌 */
    if(!capped && !strictGoldOK(ctx,card,fromRes)) return;
    const val=guideCardValue(card)+guideNobleGain(v,pi,card)+guideDeny(ctx,card)*.6;
    push(fromRes?0:(sat?2:1), val, {kind:"buy", card, fromRes, level:card.lv});
  };
  p.reserved.forEach(c=>consider(c,true));
  for(const lv of [1,2,3]) v.board[lv].forEach(c=>consider(c,false));
  return best ? best.a : null;
}
/* 层级0:终局阻断 —— 唯一一个「绝对优先」的动作,即使亏了节奏也在所不惜。
   攻略写「手里至少 1 个黄金才能用黄金预约该牌」,那是因为该写法里预约要花黄金;
   本实现预约反而 +1 黄金 → 前置条件天然满足,阻断无条件执行。
   多张候选取对手最快能买到的(有效缺口最小);自己买得动就直接买走 ——
   同样摘掉这张牌还白拿分数,同时满足「阻断优先」与「效率至上」。 */
function strictBlock(ctx){
  const {v,p}=ctx;
  let best=null, threatened=false;
  for(const lv of [1,2,3]) v.board[lv].forEach(c=>{
    let eff=null;
    v.players.forEach((op,i)=>{
      if(i===ctx.pi || op.pts<STRICT.BLOCK_TRIGGER_SCORE) return;
      if(op.pts + c.pts + guideNobleGain(v,i,c) < AI_END_pts) return;   /* 买走也撞不了线 */
      const e=guideEff(op,c);
      if(e>STRICT.BLOCK_WINDOW_COST) return;                            /* 不在 1-2 回合窗口内 */
      if(eff===null || e<eff) eff=e;
    });
    if(eff===null) return;
    threatened=true;
    const a = canAfford(p,c) ? {kind:"buy", card:c, fromRes:false, level:lv}
              : (p.reserved.length<3 ? {kind:"res", card:c, level:lv} : null);
    if(!a) return;
    const key=(a.kind==="buy"?100:0) - eff*10 + c.pts;   /* 买 > 拦,对手拦得越急越好 */
    if(!best || key>best.key) best={key, a};
  });
  if(best) return best.a;
  /* 预留位已满又买不动 → 按攻略改为拿对手最需要的颜色拖延(层级4 的卡位权重正是这件事) */
  return threatened ? strictTake(ctx) : null;
}
/* 层级1:高分牌预约。评分 = 性价比×3 + 对手折扣×0.5 + 贵族匹配 1.0(正文的 0.5 与
   伪代码/参数表冲突,取后者)。现在就能买走的牌不在这里处理 —— 落袋永远优于占位。 */
function strictReserve(ctx){
  const {v,p}=ctx;
  if(p.reserved.length>=3) return null;
  /* 黄金窗口:伪代码与 3.1 表是 1 ≤ gold ≤ 2,3.2 又有「gold == 0 时优先预约补黄金」——
     本实现预约 +1 黄金,所以只放宽下限(上限仍按 GOLD_MAX_FOR_RESERVE=2 执行)。 */
  if(ctx.gold > STRICT.GOLD_MAX_FOR_RESERVE) return null;
  let best=null;
  for(const lv of [2,3]) v.board[lv].forEach(c=>{
    if(lv===3 && c.pts<STRICT.PREMIUM_3_SCORE) return;
    if(lv===2 && c.pts<STRICT.PREMIUM_2_SCORE) return;
    if(p.bonus[c.color] < STRICT.RESERVE_DISCOUNT_MIN) return;   /* 折扣 ≥2,否则预约下来也买不起 */
    if(canAfford(p,c)) return;
    /* 攻略没写的前置:预约是「锁定未来资产」,前提是这座资产收得回来。
       缺口超过 1-2 回合的量(PREMIUM_MAX_GAP)就放弃 —— 占着预留位买不下来的牌是死资产,
       实测会直接把整局拖成「三个人各留三张三级牌然后互相干瞪眼」的死局。 */
    if(guideEff(p,c) > STRICT.PREMIUM_MAX_GAP) return;
    const opp=v.players.reduce((s,o,i)=> i===ctx.pi ? s : s+(o.bonus[c.color]||0), 0);
    const total = c.pts/guideCostTotal(c)*3 + opp*0.5 + (ctx.plan.colors.has(c.color) ? 1.0 : 0);
    if(!best || total>best.total) best={total, a:{kind:"res", card:c, level:lv}};
  });
  return best ? best.a : null;
}
/* 宗师档弃牌:规格书只规定「黄金永远最后丢」,没给彩色宝石的弃牌价序,

   层级4 的 strictColorScore 不适合当弃牌价序:它对「当前没人要」的颜色一律给 0,
   三档并列时弃谁完全由遍历顺序决定,等于把最有弹性的万能色先丢出去。 */
function strictTokenKeepValue(ctx,color){
  if(color===GOLD) return 99;   /* 攻略:始终保留至少 1 个应急黄金 */
  if(!ctx.g) ctx.g = guideCtx();   /* 与层级4 出牌同源;ctx 每轮重建,备忘不会跨轮失效 */
  return guideTokenKeepValue(ctx.g, color);

function aiStrictDecide(){
  const ctx=strictCtx();
  const {v,pi,p}=ctx;
  /* ── 铁律 A:自己撞线买牌 —— 规格书只写了拦对手,漏了「我这回合就能赢」。
      「轮次大于一切」对双方都成立:能一回合结束比赛,就绝不停在 14 分去搞阻断。 ── */
  let win=null;
  const scanWin=(list,fromRes)=>list.forEach(c=>{
    if(!canAfford(p,c)) return;
    const after=p.pts+c.pts+guideNobleGain(v,pi,c);
    if(after>=AI_END_pts && (!win || after>win.after))
      win={after, a:{kind:"buy", card:c, fromRes, level:c.lv}};
  });
  scanWin(p.reserved,true);
  for(const lv of [1,2,3]) scanWin(v.board[lv],false);
  if(win) return win.a;
  if(!ctx.endRound){
    const blk=strictBlock(ctx);   if(blk) return blk;   /* 层级0 终局阻断 */
    const res=strictReserve(ctx); if(res) return res;   /* 层级1 高分牌预约 */
    /* 层级2 贵族冲刺不产动作:缺色已写进 ctx.plan,由层级3/4 承接 */
  }
  /* 铁律 B:终局轮(有人已撞线)只剩最后一个回合 → 只做即时分,一律跳过 0/1/2 级的投资。
     实现方式:上面已经跳过节流的层级0/1,层级3 在这里成为唯一的兑现口,层级4/5 照常。 */
  /* ── 层级3 购买 → 层级4 拿宝石 → 层级5 保底:规格书的三条互斥层级,按硬排序逐个尝试。 ── */
  const buy=strictBuy(ctx); if(buy) return buy;
  const gem=strictTake(ctx); if(gem) return gem;
  /* ── 层级5 保底:得分最高的 3 个不同色,不足 3 色则拿 2 个同色。

  const room=STRICT.GEM_MAX - aiTotalTok(p);
  if(room>0){

  }
  /* 公共池被抽空:唯一还能执行的合法动作是牌库盲留(优先三级),否则交给上层跳过回合 */
  if(p.reserved.length<3){
    for(const lv of [3,2,1]) if(v.deckLen[lv]>0) return {kind:"resdeck", card:null, level:lv};
  }
  return null;
}
/* —— 动作空间(比旧 AI 完整:含单拿宝石与牌库盲留) —— */
function aiGemCombos(v,pi){
  const legal=[];
  const build=arr=>{ const sel=emptyGemSelection(); arr.forEach(c=>sel[c]++); return sel; };
  const u=arr=>arr.reduce((s,c)=>s+aiTokenKeepValue(v,pi,c),0);
  for(let i=0;i<COLORS.length;i++)
    for(let j=i+1;j<COLORS.length;j++)
      for(let k=j+1;k<COLORS.length;k++){
        const a=COLORS[i],b=COLORS[j],c=COLORS[k];
        if(v.tokens[a]&&v.tokens[b]&&v.tokens[c]) legal.push({sel:build([a,b,c]), val:u([a,b,c])+0.6});
      }
  COLORS.forEach(c=>{ if(v.tokens[c]>=4) legal.push({sel:build([c,c]), val:aiTokenKeepValue(v,pi,c)*1.8}); });
  for(let i=0;i<COLORS.length;i++)
    for(let j=i+1;j<COLORS.length;j++)
      if(v.tokens[COLORS[i]]&&v.tokens[COLORS[j]])
        legal.push({sel:build([COLORS[i],COLORS[j]]), val:u([COLORS[i],COLORS[j]])*0.8});
  COLORS.forEach(c=>{ if(v.tokens[c]) legal.push({sel:build([c]), val:aiTokenKeepValue(v,pi,c)*0.7}); });
  legal.sort((a,b)=>b.val-a.val);
  const out=[], seen=new Set();
  for(const x of legal){
    const k=aiSelKey(x.sel);
    if(seen.has(k)) continue;
    seen.add(k); out.push(x.sel);
    if(out.length>=8) break;
  }
  return out;
}
function aiKernelActions(v){
  const pi=v.me, p=v.players[pi], acts=[];
  const room = p.reserved.length<3;
  p.reserved.forEach(c=>{ if(canAfford(p,c)) acts.push({kind:"buy", card:c, fromRes:true, level:c.lv}); });
  for(const lv of [1,2,3]){
    v.board[lv].forEach(c=>{
      if(canAfford(p,c)) acts.push({kind:"buy", card:c, fromRes:false, level:lv});
      if(room) acts.push({kind:"res", card:c, fromRes:false, level:lv});
    });
    if(room && v.deck[lv].length) acts.push({kind:"resdeck", card:null, level:lv});
  }
  aiGemCombos(v,pi).forEach(sel=>acts.push({kind:"gems", sel}));
  acts.forEach(a=>{
    a.block = a.card ? aiOpponentThreatGain(v,pi,a.card) : 0;
    a.key = a.kind==="buy"   ? "buy|"+(a.fromRes?"r"+p.reserved.indexOf(a.card):"b"+a.level+"|"+v.board[a.level].indexOf(a.card))
          : a.kind==="res"   ? "res|b"+a.level+"|"+v.board[a.level].indexOf(a.card)
          : a.kind==="resdeck" ? "res|d"+a.level
          : "gem|"+aiSelKey(a.sel);
  });
  return acts;
}
function aiCheapScore(v,pi,a){
  const p=v.players[pi];
  if(a.kind==="buy"){
    const need = COLORS.reduce((s,c)=>s+Math.max(0,(a.card.cost[c]||0)-p.bonus[c]-p.tokens[c]),0);
    const eff  = need - Math.min(need, p.tokens.O);
    return a.card.pts*3 + a.card.lv*1.5 - eff*1.2 + (a.fromRes?0.5:0);
  }
  if(a.kind==="res")  return a.card.pts*1.6 + a.card.lv + a.block*1.1
    - COLORS.reduce((s,c)=>s+Math.max(0,(a.card.cost[c]||0)-p.bonus[c]-p.tokens[c]),0)*0.5;
  if(a.kind==="resdeck") return 0.2;
  return COLORS.reduce((s,c)=>s+(a.sel[c]||0)*aiTokenKeepValue(v,pi,c),0);
}
function aiApply(v,pi,a){
  if(a.kind==="buy") aiSimBuy(v,pi,a.card,a.fromRes);
  else if(a.kind==="res") aiSimReserve(v,pi,a.card,a.level);
  else if(a.kind==="resdeck") aiSimReserve(v,pi,null,a.level);
  else aiSimTake(v,pi,a.sel);
}
/* 对手 1-ply 应手:oppPolicy="greedy" 只看眼前性价比;
   "play" 借用推演政策(会算折扣引擎与贵族),master 用它预判高手对手 */
function aiOpponentStep(v,oi){
  if(aiProfile().oppPolicy === "play"){ aiPlayoutStep(v,oi); return; }
  const op=v.players[oi];
  let best=null, bs=-Infinity;
  for(const lv of [1,2,3]) v.board[lv].forEach(c=>{
    if(!canAfford(op,c)) return;
    const sc = c.pts*3 + c.lv*2;
    if(sc>bs){ bs=sc; best=c; }
  });
  if(best){ aiSimBuy(v,oi,best,false); return; }
  const sel = aiGemCombos(v,oi)[0] || emptyGemSelection();
  aiSimTake(v,oi,sel);

function aiKernelDecide(){
  const prof=aiProfile();
  if(prof.policy === "guide") return aiGuideDecide();   /* 大师档:攻略规则引擎,不进内核 */
  if(prof.policy === "strict") return aiStrictDecide();  /* 宗师档:优先级瀑布,同样不进内核 */
  return aiKernelSearch(prof);

/* 纯搜索:给定权重,对动作空间做「落子 → 对手应手 → 估值」排序。

function aiKernelSearch(prof){
  const root=aiViewClone(aiBaseView()); aiDeterminize(root);
  let acts=aiKernelActions(root);
  if(!acts.length) return null;
  acts.forEach(a=>{ a.cheap = aiCheapScore(root,root.me,a); });
  /* 分桶剪枝:保证每一类动作都有代表,不让「拿宝石」挤光「买卡」 */
  const QUOTA = prof.quota || {buy:5,res:3,resdeck:1,gems:3};
  const cap=Math.max(2, prof.kFollow||8);
  const buckets={buy:[],res:[],resdeck:[],gems:[]};
  acts.forEach(a=>{ (buckets[a.kind]||(buckets[a.kind]=[])).push(a); });
  Object.values(buckets).forEach(list=>list.sort((a,b)=>b.cheap-a.cheap));
  const ranked=[], rest=[];
  for(const kind of ["buy","res","resdeck","gems"]){
    const list=buckets[kind]||[];
    ranked.push(...list.slice(0, QUOTA[kind]||1));
    rest.push(...list.slice(QUOTA[kind]||1));
  }
  if(ranked.length<cap){ rest.sort((a,b)=>b.cheap-a.cheap); ranked.push(...rest.slice(0, cap-ranked.length)); }
  const agg = new Map();
  for(let s=0;s<(prof.samples||1);s++){

    v.seed = (root.seed + s*7919 + 17) >>> 0;

      const tp = aiTempoCost(a, prof);
      const c = aiViewClone(v);
      aiApply(c, c.me, a);
      const after = simScore(c, c.me, prof, a.block, tp);
      let val = after;
      const lam = prof.lookahead !== undefined ? prof.lookahead : 0.6;
      /* 终局只剩自己一步时,前瞻没有意义 → 跳过;lam=0 时同样直接省掉整次克隆 */

        const c2 = aiViewClone(c);

        const le = lam * (a.kind==="gems" ? 0.7 : 1);
        val = after*(1-le) + simScore(c2, c2.me, prof, a.block, tp)*le;
      }
      const cur = agg.get(a.key);
      if(cur){ cur.t+=val; cur.k++; } else agg.set(a.key, {t:val, k:1, a});
    }

  agg.forEach(x=>scored.push({m:x.t/x.k, a:x.a}));
