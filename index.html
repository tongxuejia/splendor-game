     eps=0 → 严格 argmax;eps 越大越"手软",这是低档位唯一的犯错来源。 */
  const eps = prof.epsilon || 0;
  if(eps<=0 || scored.length<2) return scored[0].a;
  const top = scored.slice(0,3);
  const spread = top.reduce((s,x)=>s+Math.abs(x.m-top[0].m),0)/top.length;
  const T = Math.max(1e-6, eps*(spread + Math.abs(top[0].m)*0.1));
  let total=0;
  top.forEach(x=>{ x.p = Math.exp((x.m-top[0].m)/T); total += x.p; });
  let r = aiRand(root)*total;
  for(const x of top){ r -= x.p; if(r<=0) return x.a; }
  return top[top.length-1].a;
}
function aiKernelAct(){
  const p=cp();
  const a = aiKernelDecide();
  if(!a){ logMsg(`${p.name} 无可执行动作,跳过回合`); nextTurn(); return; }
  if(a.kind==="buy") buyCard(a.card, a.fromRes, a.level);
  else if(a.kind==="res") reserveCard(a.card, a.level);
  else if(a.kind==="resdeck") reserveCard(null, a.level);
  else { S.gemSel = a.sel; takeGems(); }
}
function aiKernelDiscard(){
  const p=cp(), v=aiBaseView(), pv=v.players[v.me];
  const pol = aiProfile().policy;
  const discarded=emptyGemSelection();
  while(aiTotalTok(pv)>10){
    /* 攻略档/宗师档每轮基于最新真实状态重建一次公开视图,弃牌口径与出牌口径保持一致 */
    const ctx = pol==="guide" ? guideCtx() : pol==="strict" ? strictCtx() : null;
    let worst=null, ws=Infinity;
    [...COLORS,GOLD].forEach(c=>{
      if(pv.tokens[c]<=0) return;
      const val = pol==="guide" ? guideTokenKeepValue(ctx,c)
                : pol==="strict" ? strictTokenKeepValue(ctx,c)
                : aiTokenKeepValue(v,v.me,c);
      if(val<ws){ ws=val; worst=c; }
    });
    if(worst===null) break;
    pv.tokens[worst]--; v.tokens[worst]++;
    p.tokens[worst]--; S.tokens[worst]++;
    discarded[worst]++;
  }
  return discarded;
}
/* 多贵族来访时择优:分值都是 +3,取「最能卡住对手」的那位 */

  eligible.forEach(n=>{
    let s=0;
    S.players.forEach(op=>{
      if(op===player) return;
      const gap = COLORS.reduce((a,c)=>a+Math.max(0,(n.cost[c]||0)-op.bonus[c]),0);
      s += 3/(gap+1);
    });
    if(s>bs){ bs=s; best=n; }
  });
  return best;
}

function aiTakeAction(){ aiKernelAct(); }
function runAITurn(){
  aiTimer = null;
  if(!isAITurn()) return;
  if(S.phase==="discard"){
    aiDiscardTokens();
    return;
  }
  if(S.phase==="action") aiTakeAction();
}
function scheduleAITurn(delay=1450){
  clearTimeout(aiTimer);
  if(!isAITurn()) return;
  aiTimer = setTimeout(runAITurn,delay);
}

/* ───────────────────────── 回合动作 ───────────────────────── */
function takeGems(){
  if(S.actionTaken) return;
  const sel = S.gemSel;
  const p = cp();
  const total = COLORS.reduce((s,c)=>s+sel[c],0);
  if(total<1) return;

  /* 拿宝石动画:修改状态前先捕获宝石库中各选中色的位置并克隆 */
  const flyers = [];
  for(const c of COLORS){
    const count = sel[c];
    if(count<=0) continue;
    if(S.tokens[c]<count){ msg("该颜色宝石不足!"); return; }
    const bankGem = document.querySelector(`#bank .gem[data-c="${c}"]`);
    if(bankGem){
      const rect = bankGem.getBoundingClientRect();
      for(let i=0;i<count;i++){
        const clone = bankGem.cloneNode(true);
        clone.classList.remove('sel','empty');
        flyers.push({flyer:clone, sourceRect:rect, color:c});
      }
    }
  }

  for(const c of COLORS){
    const k = sel[c];
    for(let i=0;i<k;i++){ S.tokens[c]--; p.tokens[c]++; }
  }
  logMsg(`${p.name} 拿了 ${gemSelText(sel)}`);
  S.gemSel = {W:0,B:0,G:0,R:0,K:0};
  S.actionTaken = true;

  if(flyers.length && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    flyGemsToPlayer(flyers, ()=>afterAction());
  }else{
    afterAction();
  }
}
function gemSelText(sel){
  const parts=[];
  for(const c of COLORS) if(sel[c]) parts.push(sel[c]>1?`${sel[c]}个${COLOR_NAME[c]}`:`${COLOR_NAME[c]}宝石`);
  return parts.join("+");
}

function buyCard(card, fromReserved, levelIdx){
  if(S.actionTaken) return;
  const p = cp();
  if(!canAfford(p, card)){ msg("宝石不够,买不了这张卡"); return; }

  /* 买牌动画:修改状态前先捕获源卡牌位置并克隆 */
  let sourceEl = null;
  if(!fromReserved && levelIdx){
    const cid = S.board[levelIdx].indexOf(card);
    sourceEl = document.querySelector(`.card[data-lv="${levelIdx}"][data-cid="${cid}"]`);
  }else if(fromReserved){
    const resIdx = p.reserved.indexOf(card);
    const pEl = document.querySelectorAll('.player')[S.cur];
    if(pEl) sourceEl = pEl.querySelectorAll('.rmini')[resIdx] || null;
  }
  const sourceRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
  const flyer = sourceEl ? sourceEl.cloneNode(true) : null;
  if(flyer) flyer.classList.remove('afford','sel');

  const pay = costFor(p, card);
  for(const c of COLORS){ p.tokens[c] -= pay[c]; S.tokens[c] += pay[c]; }
  p.tokens.O -= pay.O; S.tokens.O += pay.O;
  p.bonus[card.color]++; p.cards++; p.pts += card.pts;
  p.purchased.push(card);

  if(fromReserved) p.reserved = p.reserved.filter(x=>x!==card);
  else {
    const b = S.board[card.lv];
    b.splice(b.indexOf(card),1);
    if(S.decks[card.lv].length) b.push(S.decks[card.lv].pop());
  }
  logMsg(`${p.name} 购买了 ${COLOR_NAME[card.color]}色 ${card.pts}分卡(花费 ${costText(pay)})`);
  S.actionTaken = true;
  S.sel = null;

  if(flyer && sourceRect && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    flyCardAnimate(flyer, sourceRect, ()=>{
      const pEl = document.querySelectorAll('.player')[S.cur];
      if(!pEl) return null;
      const st = pEl.querySelectorAll('.owned-stack')[COLORS.indexOf(card.color)];
      if(!st) return null;
      const oc = st.querySelectorAll('.owned-card');
      return oc.length ? oc[oc.length-1] : null;
    }, ()=>afterAction());
  }else{
    afterAction();
  }
}

/* 动画收尾兜底:onfinish 是「回合交接」的唯一推进路径(→ afterAction → finishTurn → 下一位),
   但标签页被冻结、webview 省电、无合成环境等情况下 Web Animations 的时间轴可能永不推进,
   onfinish 不触发就会表现成「AI 永远不思考」的假死。这里把收尾包成「最多执行一次」,
   并挂一个比动画时长更长的定时器:谁先到谁负责清理,后到的那个是空操作。 */
function guardedDone(done, ms){
  let fired = false;
  const settle = ()=>{ if(fired) return; fired = true; done(); };
  setTimeout(settle, ms);
  return settle;
}

/* 卡牌飞行动画:克隆卡牌从源位置滑入目标位置 */
function flyCardAnimate(flyer, sourceRect, findTarget, done){
  render();
  const targetEl = findTarget();
  if(!targetEl){ flyer.remove(); done(); return; }
  const tgtRect = targetEl.getBoundingClientRect();
  flyer.style.cssText = `position:fixed;left:${sourceRect.left}px;top:${sourceRect.top}px;width:${sourceRect.width}px;height:${sourceRect.height}px;margin:0;padding:0;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.6);transition:none;`;
  document.body.appendChild(flyer);
  targetEl.style.visibility = 'hidden';
  const dx = (tgtRect.left+tgtRect.width/2)-(sourceRect.left+sourceRect.width/2);
  const dy = (tgtRect.top+tgtRect.height/2)-(sourceRect.top+sourceRect.height/2);
  const scale = tgtRect.width / sourceRect.width;
  const settle = guardedDone(()=>{
    flyer.remove();
    targetEl.style.visibility = '';
    done();
  }, 560 + 600);
  flyer.animate([
    {transform:'translate(0,0) scale(1)', opacity:1},
    {transform:`translate(${dx}px,${dy}px) scale(${scale})`, opacity:1, offset:.82},
    {transform:`translate(${dx}px,${dy}px) scale(${scale})`, opacity:0}
  ], {duration:560, easing:'cubic-bezier(.4,0,.2,1)'}).onfinish = settle;
}

/* 拿宝石飞行动画:克隆宝石从宝石库滑入玩家面板 */
function flyGemsToPlayer(flyers, done){
  render();
  const playerEl = document.querySelectorAll('.player')[S.cur];
  let remaining = flyers.length;
  const finish = ()=>{ if(--remaining===0) done(); };
  flyers.forEach(({flyer,sourceRect,color}, idx)=>{
    let targetEl = null;
    if(playerEl) targetEl = playerEl.querySelector(`.resource-slots .gem[data-c="${color}"]`);
    if(!targetEl){ flyer.remove(); finish(); return; }
    const tgtRect = targetEl.getBoundingClientRect();
    flyer.style.cssText = `position:fixed;left:${sourceRect.left}px;top:${sourceRect.top}px;width:${sourceRect.width}px;height:${sourceRect.height}px;margin:0;padding:0;z-index:100;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.5);transition:none;`;
    document.body.appendChild(flyer);
    targetEl.style.visibility = 'hidden';
    const dx = (tgtRect.left+tgtRect.width/2)-(sourceRect.left+sourceRect.width/2);
    const dy = (tgtRect.top+tgtRect.height/2)-(sourceRect.top+sourceRect.height/2);
    const scale = tgtRect.width / sourceRect.width;
    const settle = guardedDone(()=>{
      flyer.remove();
      targetEl.style.visibility = '';
      finish();
    }, 440 + idx*90 + 600);
    flyer.animate([
      {transform:'translate(0,0) scale(1)', opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(${scale})`, opacity:1, offset:.82},
      {transform:`translate(${dx}px,${dy}px) scale(${scale})`, opacity:0}
    ], {duration:440, delay:idx*90, easing:'cubic-bezier(.4,0,.2,1)'}).onfinish = settle;
  });
}
function costText(pay){
  const parts=[];
  for(const c of [...COLORS,GOLD]) if(pay[c]) parts.push(`${pay[c]}${COLOR_NAME[c]}`);
  return parts.join(" ");
}

function reserveCard(card, level){
  if(S.actionTaken) return;
  const p = cp();
  if(p.reserved.length>=3){ msg("最多预留 3 张卡"); return; }

  /* 预留动画:修改状态前先捕获源卡牌位置并克隆 */
  let sourceEl = null;
  if(card){
    const cid = S.board[level].indexOf(card);
    sourceEl = document.querySelector(`.card[data-lv="${level}"][data-cid="${cid}"]`);
  }else{
    sourceEl = document.querySelector(`.deck[data-lv="${level}"]`);
  }
  const sourceRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
  const flyer = sourceEl ? sourceEl.cloneNode(true) : null;
  if(flyer) flyer.classList.remove('afford','sel');

  if(card){
    const b = S.board[level];
    b.splice(b.indexOf(card),1);
    if(S.decks[level].length) b.push(S.decks[level].pop());
    p.reserved.push(card);
  }else{
    const c = S.decks[level].pop();
    if(!c){ msg("牌库已空"); return; }
    p.reserved.push(c);
  }
  const gotGold = S.tokens.O>0;
  if(S.tokens.O>0){ S.tokens.O--; p.tokens.O++; }
  S.actionTaken = true;
  S.sel = null;
  logMsg(`${p.name} 预留了${card?"场上":"牌库"}一张卡${gotGold?"(+1金币)":"(金币已空,未获得)"}`);

  if(flyer && sourceRect && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    flyCardAnimate(flyer, sourceRect, ()=>{
      const pEl = document.querySelectorAll('.player')[S.cur];
      if(!pEl) return null;
      const rm = pEl.querySelectorAll('.rmini');
      return rm.length ? rm[rm.length-1] : null;
    }, ()=>afterAction());
  }else{
    afterAction();
  }
}

/* 动作之后:弃币 → 贵族 → 下一回合 */
function afterAction(){
  const p = cp();
  if(totalTokens(p) > 10){
    S.phase = "discard";
    render();
    msg(p.isAI
      ? `${p.name} 正在弃置多余宝石...`
      : `${p.name} 超过 10 个宝石,点击自己面板中的宝石弃掉多余的(还需弃 ${totalTokens(p)-10} 个)`);
    if(p.isAI) scheduleAITurn(450);
    return;
  }
  finishTurn();
}

function finishTurn(){
  // 贵族来访
  const p = cp();
  const eligible = S.nobles.filter(n=>n.taken===null && COLORS.every(c=>p.bonus[c]>=(n.cost[c]||0)));
  if(eligible.length===1){
    grantNoble(eligible[0]); /* grantNoble 内已 nextTurn,须直接返回避免回合推进两次 */
    return;
  }else if(eligible.length>1){
    if(p.isAI){
      grantNoble(aiPickNoble(p, eligible));
      return;
    }
    S.phase = "noble";
    render();
    showModal(`<h2>👑 多位贵族同时来访!</h2><p style="color:#8a9bb0;">只能选择一位(每位 +3 分)</p>`, eligible.map(n=>nobleHTML(n,true)).join(""),
      el=>{ el.querySelectorAll(".noble").forEach(x=>x.onclick=()=>{ grantNoble(S.nobles[+x.dataset.id]); hideModal(); }); });
    return;
  }
  nextTurn();
}
function grantNoble(n){
  const p = cp();
  n.taken = p.name;
  p.nobles.push(n);
  p.pts += 3;
  logMsg(`👑 贵族来访!${p.name} +3 分(当前 ${p.pts} 分)`);
  nextTurn();
}

function nextTurn(){
  const p = cp();
  if(p.pts>=15 && S.endTriggeredBy<0){
    S.endTriggeredBy = S.cur;
    logMsg(`⭐ ${p.name} 达到 ${p.pts} 分!完成本轮后结算`);
  }
  // 轮到触发者本人时,所有人回合数已相等,游戏结束
  const next = (S.cur+1) % S.players.length;
  if(S.endTriggeredBy>=0 && next===S.endTriggeredBy){
    gameOver(); return;
  }
  S.cur = next;
  S.turnCount++;
  S.phase = "action";
  S.actionTaken = false;
  S.gemSel = {W:0,B:0,G:0,R:0,K:0};
  S.sel = null;
  showTurnBanner(cp().name);
  render();
  scheduleAITurn();
}

/* 回合切换横幅:闪现 1.2 秒 */
let bannerTimer = null;
function showTurnBanner(name){
  const b = $("turnBanner");
  b.textContent = `轮到 ${name}`;
  b.classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(()=>b.classList.remove("show"), 1200);
}

function gameOver(){
  clearTimeout(aiTimer);
  S.phase = "over";
  render();
  showGameOverModal();
}

function showGameOverModal(){
  const ranked = [...S.players].sort((a,b)=> b.pts-a.pts || a.cards-b.cards);
  const win = ranked[0];
  showModal(`<h2>🏆 游戏结束</h2><div class="winner">冠军:${win.name}(${win.pts} 分)</div>`,
    ranked.map((p,i)=>`<div>${i+1}. ${p.name} — ${p.pts} 分 / ${p.cards} 张卡 / 贵族 ${p.nobles.length} 位</div>`).join("")
    + `<div style="margin-top:10px; font-weight:bold; color:#f0d98c;">总轮次：${roundNumber()}</div>`
    + `<div style="display:flex;gap:10px;margin-top:16px;">`
    + `<button class="btn" style="flex:1;" id="viewBoardBtn">👁 看终局场面</button>`
    + `<button class="btn gold" style="flex:1;" onclick="location.reload()">再来一局</button>`
    + `</div>`,
    el=>{
      el.querySelector('#viewBoardBtn').onclick = ()=>{
        hideModal();
        $('returnResultsBtn').hidden = false;
      };
    });
}
$('returnResultsBtn').onclick = ()=>{
  $('returnResultsBtn').hidden = true;
  showGameOverModal();
};
function msg(t){ $("msg").textContent = t; }

/* ───────────────────────── 渲染 ───────────────────────── */
function render(){
  renderTurn(); renderRound(); renderNobles(); renderBoard(); renderBank(); renderPlayers(); renderSel();
  renderAIThinking();
  if(S.phase==="action") msg(turnHintText());
  $("cancelBtn").disabled = S.phase!=="action" || cp().isAI;
  $("surrenderBtn").disabled = S.phase!=="action" || cp().isAI;
  $("log").innerHTML = [...S.log].reverse().map(t=>`<div>${t}</div>`).join("");
}
function renderTurn(){
  const aiLabel = cp().isAI ? ` · AI(${aiProfile().label})` : "";
  //$("turnHint").textContent = `第 ${S.cur+1} 位玩家 · ${cp().name}${aiLabel} · ${cp().pts} 分` + (S.endTriggeredBy>=0?` ⏹ 终局轮`:"");
  $("turnHint").textContent = `${cp().name}${aiLabel}:${cp().pts} 分` + (S.endTriggeredBy>=0?` ⏹ 终局轮`:"");
}
/* 一轮 = 每位玩家各行动一次 */
function roundNumber(){ return Math.floor(S.turnCount / S.players.length) + 1; }
function renderRound(){
  $("roundHint").textContent = `第 ${roundNumber()} 轮`;
}
function renderAIThinking(){
  const active = isAITurn();
  const panel = $("aiThinking");
  panel.classList.toggle("show",active);
  panel.setAttribute("aria-hidden",String(!active));
  document.body.classList.toggle("ai-thinking",active);
  if(!active) return;
  $("aiThinkingTitle").textContent = `${cp().name} 正在思考`;
  $("aiThinkingDetail").textContent = S.phase==="discard"
    ? "正在整理多余宝石"
    : `${aiProfile().label}难度 · 正在评估卡牌、宝石与对手`;
}
function nobleHTML(n, clickable){
  const reqs = Object.entries(n.cost).map(([c,k])=>`<div class="cost-gem ${COLOR_CLASS(c)}">${k}</div>`).join("");
  return `<div class="noble" ${clickable?`data-id="${n.id}" title="点击选择"`:""}>
    <div class="noble-art">
      <img src="${nobleArtURL(n)}" alt="贵族肖像 ${n.artIndex+1}" loading="eager" decoding="async"
        onerror="this.parentElement.classList.add('art-failed');this.remove()">
    </div>
    <span class="pts"><span>3</span></span>
    <div class="noble-info">
      <span class="noble-title">贵族</span>
      <span class="req">${reqs}</span>
      ${n.taken?`<span class="noble-taken">→ ${n.taken}</span>`:""}
    </div>
  </div>`;
}
function renderNobles(){
  $("nobles").innerHTML = S.nobles.filter(n=>n.taken===null).map(n=>nobleHTML(n,false)).join("")
    || `<span style="color:#8a9bb0;">贵族已被领完</span>`;
}
function costGemsHTML(cost, player){
  return Object.entries(cost).filter(([c])=>c!==GOLD).map(([c,k])=>{
    const disc = player && (player.bonus[c]||0) >= k;   // 折扣完全覆盖该成本
    return `<div class="cost-gem ${COLOR_CLASS(c)} ${disc?"disc":""}" title="${COLOR_NAME[c]}${disc?"(折扣已覆盖)":""}">${k}</div>`;
  }).join("");
}
function cardHTML(card, extra="", cls=""){
  const afford = S.phase==="action" && !cp().isAI && canAfford(cp(), card);
  return `<div class="card ${afford?"afford":""}${cls}" ${extra}>
    <div class="card-art">
      <img src="${cardArtURL(card)}" alt="${card.lv}级${COLOR_NAME[card.color]}色发展卡插画"
        loading="eager" decoding="async"
        onerror="this.parentElement.classList.add('art-failed');this.remove()">
      <div class="card-top-strip"></div>
      <div class="bonus-mark cost-gem ${COLOR_CLASS(card.color)}" title="永久${COLOR_NAME[card.color]}色折扣"></div>
      ${card.pts?`<div class="corner hasPts"><div class="pts">${card.pts}</div></div>`:""}
      <span class="level-mark">${["","I","II","III"][card.lv]} 级</span>
    </div>
    <div class="card-body">
      <div class="cost">${costGemsHTML(card.cost, cp())}</div>
    </div>
  </div>`;
}
function renderBoard(){
  const box = $("board");
  let html = "";
  for(const lv of [3,2,1]){
    html += `<div class="levelRow"><div class="deck" data-lv="${lv}" title="点击盲留一张(暗牌)+1金币">
      <div class="dlabel"><span class="dlvl">${lv}</span><span class="dname"> 级牌库</span></div><div class="cnt">${S.decks[lv].length}</div><div class="blind">点击盲留</div></div>`;
    for(let i=0;i<S.board[lv].length;i++){
      const card = S.board[lv][i];
      const picked = S.sel && S.sel.src==="board" && S.sel.lv===lv && S.sel.idx===i;
      html += cardHTML(card, `data-lv="${lv}" data-cid="${i}"`, picked?" sel":"");
    }
    html += `</div>`;
  }
  box.innerHTML = html;
  // 点击卡牌 = 选中 / 取消选中,买与留由宝石库右侧的按钮触发
  box.querySelectorAll(".card").forEach(el=>{
    const lv = +el.dataset.lv, idx = +el.dataset.cid;
    if(!S.board[lv]?.[idx]) return;
    el.onclick = ()=>selectCard({src:"board", lv, idx});
  });
  box.querySelectorAll(".deck").forEach(el=>{
    const lv = +el.dataset.lv;
    el.onclick = ()=>{ if(S.phase==="action" && !cp().isAI) reserveCard(null,lv); };
  });
}

/* ── 卡牌选中态 ── */
function selectedCard(){
  const s = S.sel;
  if(!s) return null;
  return s.src==="board" ? (S.board[s.lv]?.[s.idx] || null) : (cp().reserved[s.idx] || null);
}
function selectCard(sel){
  if(S.phase!=="action" || cp().isAI || S.actionTaken) return;
  const cur = S.sel;
  S.sel = (cur && cur.src===sel.src && cur.lv===sel.lv && cur.idx===sel.idx) ? null : sel;
  if(S.sel) S.gemSel = {W:0,B:0,G:0,R:0,K:0};   // 拿宝石与买/留互斥:选卡时清空已选宝石
  renderBoard(); renderPlayers(); renderBank(); renderSel();
  const card = selectedCard();
  msg(card ? `已选 ${COLOR_NAME[card.color]}色 ${card.pts}分 ${card.lv}级卡 —— 点「买」或「留」执行`
           : turnHintText());
}
function turnHintText(){
  /* 玩家回合不再显示操作提示(玩法说明见开始页),仅 AI 回合保留"正在思考" */
  return cp().isAI ? `${cp().name} 正在思考...` : "";
}
function renderBank(){
  let gems = "";
  for(const c of COLORS){
    const n = S.tokens[c];
    const sel = S.gemSel[c];
    const disabled = S.phase!=="action" || cp().isAI || n<=0;
    gems += `<button type="button" class="gem ${COLOR_CLASS(c)} ${n?"":"empty"} ${sel?"sel":""}"
      data-c="${c}" aria-label="${COLOR_NAME[c]}色宝石,剩余 ${n}" ${disabled?"disabled":""}>
      <span class="n">${n}</span></button>`;
  }
  gems += `<div class="gem gold t" title="金币:预留卡时获得,可当任意颜色"><span class="n">${S.tokens.O}</span></div>`;
  /* 宝石单独成组,配合 #bank 的三列网格在整行里居中(右侧买/留不参与居中基准) */
  let html = `<div class="bank-gems">${gems}</div>`;
  /* 宝石库右侧:先选卡,再买/留 */
  const p = cp();
  const sc = selectedCard();
  const canAct = S.phase==="action" && !p.isAI && !S.actionTaken && !!sc;
  const buyOk = canAct && canAfford(p, sc);
  const resOk = canAct && S.sel.src==="board" && p.reserved.length<3;
  html += `<div id="cardActs">
    <span class="cap">${sc?`已选 ${COLOR_NAME[sc.color]}色 ${sc.pts}分`:"未选卡牌"}</span>
    <button type="button" class="btn ${buyOk?"gold":""}" id="buyBtn" title="购买选中的卡牌" ${buyOk?"":"disabled"}>买</button>
    <button type="button" class="btn" id="resBtn" title="预留选中的卡牌(+1金币)" ${resOk?"":"disabled"}>留</button>
  </div>`;
  $("bank").innerHTML = html;
  $("bank").querySelectorAll(".gem[data-c]").forEach(el=>{
    el.onclick = ()=>{ if(!cp().isAI) clickBankGem(el.dataset.c); };
  });
  $("buyBtn").onclick = ()=>{
    const s = S.sel; if(!s) return;
    if(s.src==="board") buyCard(S.board[s.lv][s.idx], false, s.lv);
    else buyCard(cp().reserved[s.idx], true);
  };
  $("resBtn").onclick = ()=>{
    const s = S.sel; if(!s || s.src!=="board") return;
    reserveCard(S.board[s.lv][s.idx], s.lv);
  };
}
function clickBankGem(c){
  if(S.phase!=="action" || S.actionTaken || cp().isAI) return;
  if(S.tokens[c]<=0){ msg(`${COLOR_NAME[c]}色宝石已没了`); return; }
  const sel = S.gemSel;
  const total = COLORS.reduce((s,x)=>s+sel[x],0);
  if(sel[c]>0){                         // 取消选择
    sel[c] = 0;
    renderBank(); renderSel();
    return;
  }
  if(total>=3){ msg("最多拿 3 个宝石"); return; }
  // 是否已有颜色选了 2 个(同色双拿时不能再拿第三个)
  const doubled = COLORS.some(x=>sel[x]===2);
  if(doubled){ msg("已选择同色 2 个,不能再拿第三个"); return; }
  sel[c] = 1;
  if(S.sel){ S.sel = null; renderBoard(); renderPlayers(); }  // 拿宝石与买/留互斥
  renderBank(); renderSel();
  msg(turnHintText());
}
// 同色双拿:点击自己已选中的宝石一次 → 变成拿 2 个
function clickSelGem(c){
  if(S.phase!=="action" || S.actionTaken || cp().isAI) return;
  const sel = S.gemSel;
  if(sel[c]===1 && S.tokens[c]>=4 && S.tokens[c]>=2){
    sel[c]=2;
  }else if(sel[c]===2){
    sel[c]=1;
  }
  renderBank(); renderSel();
}
function renderSel(){
  const sel = S.gemSel;
  let html = `<span style="color:#8a9bb0;font-size:13px;">已选:</span>`;
  let any=false;
  for(const c of COLORS){
    for(let i=0;i<sel[c];i++){
      html += `<button type="button" class="gem ${COLOR_CLASS(c)}" data-c="${c}"
        aria-label="调整已选${COLOR_NAME[c]}色宝石"><span class="n">${S.tokens[c]}</span></button>`;
      any=true;
    }
  }
  $("selGems").innerHTML = any?html+`<span style="color:#8a9bb0;font-size:12px;">(再点同色宝石可双拿)</span>`:"<span style='color:#556;font-size:12px;'>未选择</span>";
  $("selGems").querySelectorAll(".gem").forEach(el=>{ el.onclick=()=>{ if(!cp().isAI) clickSelGem(el.dataset.c); }; });
  const total = COLORS.reduce((s,c)=>s+sel[c],0);
  $("okBtn").disabled = !(S.phase==="action" && !cp().isAI && total>=1);
}

function renderPlayers(){
  $("players").innerHTML = S.players.map((p,i)=>{
    const isCur = i===S.cur;
    const gems = [...COLORS,GOLD].map(c=>{
      const amount = p.tokens[c];
      const clickable = amount>0 && isCur && !p.isAI && S.phase==="discard";
      return `<div class="gem ${COLOR_CLASS(c)} ${amount?"":"empty"} ${clickable?"clickable":""}"
        data-p="${i}" data-c="${c}" title="${COLOR_NAME[c]}色宝石 ×${amount}">
        <span class="n">${amount}</span>
      </div>`;
    }).join("");
    const bonus = COLORS.map(c=>{
      const amount = p.bonus[c];
      return `<div class="bgem ${COLOR_CLASS(c)} ${amount?"":"empty"}"
        title="永久${COLOR_NAME[c]}折扣 ×${amount}"><span class="bonus-count">${amount}</span></div>`;
    }).join("");
    const reserved = p.reserved.map((card,j)=>{
      const afford = isCur && S.phase==="action" && canAfford(p,card);
      const picked = isCur && S.sel && S.sel.src==="res" && S.sel.idx===j;
      return `<div class="rmini ${afford?"afford":""}${picked?" sel":""}" data-res="${j}">
        <div class="rmini-art">
          <img src="${cardArtURL(card)}" alt="${card.lv}级${COLOR_NAME[card.color]}色预留卡插画"
            loading="lazy" decoding="async"
            onerror="this.parentElement.classList.add('art-failed');this.remove()">
          <div class="rmini-top-strip"></div>
          <div class="mini-bonus cost-gem ${COLOR_CLASS(card.color)}"></div>
          ${card.pts?`<span class="pts">${card.pts}</span>`:""}
        </div>
        <div class="rmini-body">
          <div class="cost" style="display:flex; flex-wrap:wrap; gap:3px;">${costGemsHTML(card.cost, p)}</div>
        </div>
      </div>`;
    }).join("");
    const purchased = p.purchased || [];
    const purchasedStacks = COLORS.map(c=>{
      const cards = purchased.filter(card=>card.color===c);
      return `<div class="owned-stack" style="padding-bottom:${Math.max(0,cards.length-1)*22}px">${
        cards.map((card,j)=>`<div class="owned-card"
          style="--stack-offset:${j*22}px;--stack-z:${j+1}"
          title="${COLOR_NAME[c]}色发展卡 · ${card.pts} 分 · ${["","I","II","III"][card.lv]} 级 · 成本${costText(card.cost)}">
          <img src="${cardArtURL(card)}" alt="${card.lv}级${COLOR_NAME[c]}色已购发展卡插画"
            loading="lazy" decoding="async"
            onerror="this.parentElement.classList.add('art-failed');this.remove()">
          <div class="owned-card-top"></div>
          ${card.pts?`<span class="owned-card-score">${card.pts}</span>`:""}
          <span class="owned-card-bonus cost-gem ${COLOR_CLASS(c)}"></span>
          <div class="owned-card-cost">${costGemsHTML(card.cost, null)}</div>
          <span class="owned-card-level">${["","I","II","III"][card.lv]}</span>
        </div>`).join("")
      }</div>`;
    }).join("");
    const nobles = p.nobles.length?`<div class="row"><span class="tag">贵族</span><div class="player-nobles">${
      p.nobles.map(n=>`<span class="player-noble" title="贵族 · 3 分">
        <img src="${nobleArtURL(n)}" alt="已获得的贵族肖像" loading="lazy" decoding="async">
      </span>`).join("")
    }</div></div>`:"";
    return `<div class="player ${isCur?"cur":""} ${isCur&&p.isAI?"ai-turn":""}">
      <div class="head"><span class="name">${isCur?"▶ ":""}${p.name}${p.isAI?" · AI":""}</span><span class="score">${p.pts}</span></div>
      <div class="row resource-row gems"><span class="tag">宝石</span><div class="resource-slots">${gems}</div></div>
      <div class="row resource-row"><span class="tag">折扣</span><div class="resource-slots">${bonus}<span aria-hidden="true"></span></div></div>
      ${nobles}
      ${reserved?`<div class="row"><span class="tag">预留</span><div class="reserved">${reserved}</div></div>`:""}
      ${purchased.length?`<div class="row purchased-row"><span class="tag">卡牌</span><div class="purchased-grid">${purchasedStacks}</div></div>`:""}
    </div>`;
  }).join("");
  // 弃币阶段:点击当前玩家的宝石
  $("players").querySelectorAll(".gem.clickable").forEach(el=>{
    el.onclick = ()=>{
      if(S.phase!=="discard") return;
      const p = cp(), c = el.dataset.c;
      if(p.tokens[c]<=0) return;
      p.tokens[c]--; S.tokens[c]++;
      if(totalTokens(p)<=10){
        S.phase="action";
        S.gemSel = {W:0,B:0,G:0,R:0,K:0};
        logMsg(`${p.name} 弃置宝石至 10 个`);
        finishTurn();
      }else{
        render();   // 全量刷新:宝石库(含金币)数量也要同步更新
        msg(`还需弃 ${totalTokens(p)-10} 个宝石`);
      }
    };
  });
  // 点击自己的预留卡 = 选中,再按宝石库右侧的「买」
  const curEl = $("players").querySelectorAll(".player")[S.cur];
  if(curEl) curEl.querySelectorAll(".rmini").forEach(el=>{
    const j = +el.dataset.res;
    el.onclick = ()=>selectCard({src:"res", lv:null, idx:j});
  });
}

/* ───────────────────────── 弹窗 ───────────────────────── */
function showModal(head, body, after){
  $("overlay").hidden = false;
  $("modalBox").innerHTML = head + body;
  after && after($("modalBox"));
}
function hideModal(){ $("overlay").hidden = true; }

/* ───────────────────────── 事件绑定 ───────────────────────── */
$("okBtn").onclick = ()=>{
  if(S.phase!=="action" || cp().isAI) return;
  const total = COLORS.reduce((s,c)=>s+S.gemSel[c],0);
  if(total<1) return;
  // 校验:同色 2 个时不能有第三个
  if(COLORS.some(c=>S.gemSel[c]===2) && total>2){ msg("同色双拿时只能拿这 2 个"); return; }
  takeGems();
};
$("cancelBtn").onclick = ()=>{
  if(cp().isAI) return;
  S.gemSel = {W:0,B:0,G:0,R:0,K:0};
  renderBank(); renderSel();
};
$("surrenderBtn").onclick = ()=>{
  if(S.phase!=="action" || cp().isAI) return;
  if(confirm("确定要认输吗?将直接进入终局结算。")) gameOver();
};

// 设置界面:模式、人数与名字
const modeSelect = $("modeSelect");
const difficultySelect = $("difficultySelect");
const DIFFICULTY_HINTS = {
  easy:"会推演几步,但看不远、带决策噪声。",
  normal:"搜索更深、严格取最优,不会失误。",
  hard:"旋钮档最强:最深的推演 + 会预判对手应手。",
  master:"攻略档:按「效率至上、攻防一体」的二人局打法出牌。",
  grandmaster:"攻略完整档:把那份打法拆成六条优先级逐条照做,比大师档更严格,所以稳压大师档。"+
              "但它只按套路出牌、不推演,碰上前推演很深的困难档会吃亏;"+
              "想要电脑整体最难缠,选困难档。",
};
const showDifficultyHint = ()=>{ $("difficultyHint").textContent = DIFFICULTY_HINTS[difficultySelect.value] || ""; };
difficultySelect.onchange = showDifficultyHint;
showDifficultyHint();
const pcSelect = $("pcSelect");
const bgCheck = $("bgCheck");
// 背景图开关:勾选=有背景,取消勾选立即去掉背景图,开始游戏后保持同一状态
const applyBg = ()=>document.body.classList.toggle("no-bg", !bgCheck.checked);
bgCheck.onchange = applyBg;
function renderNameInputs(){
  const box = $("nameInputs");
  const previous = [...box.querySelectorAll(".pname")].map(input=>input.value);
  const aiMode = modeSelect.value==="ai";
  $("difficultyLabel").classList.toggle("setup-hidden", !aiMode);
  difficultySelect.classList.toggle("setup-hidden", !aiMode);
  difficultySelect.disabled = !aiMode;
  $("difficultyHint").classList.toggle("setup-hidden", !aiMode);
  $("pcLabel").classList.toggle("setup-hidden", aiMode);
  pcSelect.classList.toggle("setup-hidden", aiMode);
  pcSelect.disabled = aiMode;
  box.replaceChildren();
  const addField = (labelText,value,{player=false,disabled=false}={})=>{
    const label = document.createElement("label");
    const input = document.createElement("input");
    label.textContent = labelText;
    input.value = value;
    input.disabled = disabled;
    if(player) input.className = "pname";
    box.append(label,input);
  };
  if(aiMode){
    addField("玩家名字",previous[0]||"玩家1",{player:true});
    addField("电脑对手","电脑",{disabled:false});
    return;
  }
  const n = +pcSelect.value;
  for(let i=0;i<n;i++) addField(`玩家 ${i+1} 名字`,previous[i]||`玩家${i+1}`,{player:true});
}
modeSelect.onchange = renderNameInputs;
pcSelect.onchange = renderNameInputs;
renderNameInputs();
$("startBtn").onclick = ()=>{
  const names = [...document.querySelectorAll(".pname")].map(x=>x.value.trim()||"玩家");
  const aiMode = modeSelect.value==="ai";
  const participants = aiMode
    ? [{name:names[0], isAI:false}, {name:names[0]==="电脑"?"电脑对手":"电脑", isAI:true}]
    : names.map(name=>({name, isAI:false}));
  if(new Set(participants.map(player=>player.name)).size !== participants.length){
    alert("玩家名字不能重复"); return;
  }
  initGame(participants, modeSelect.value, aiMode?difficultySelect.value:"normal");
};
</script>
