/* ─────────────────── 前瞻内核:公开信息视图 + 抽样推演 ─────────────────── */
/*
 * 所有档位唯一的决策通路,要点:
 *  1. 视图层 aiBaseView() 只读取「公开信息」:牌桌、各家宝石/折扣/分数/已买卡、
 *     牌库剩余「数量」、贵族池。绝不读取 S.decks 的顺序,也绝不读取对手 p.reserved 的内容
 *     (对手的预留通过公开数量反推,只保留张数 hiddenRes)。
 *  2. 未知牌用 determinization:对「牌库 ∪ 对手预留」这个公开可推算的牌的多重集做随机切分,
 *     每次抽样都给牌库一个合法的具体顺序,多次抽样取平均。
 *  3. 估值统一到「分等价」量纲:simScore = 分数 + 离 15 分的距离(play/race) + 折扣资产
 *     + 贵族可达性 + 金币时间价值 - 冗余宝石 - 阻断成本 - 回合机会成本。
 *  4. 决策 = samples 次抽样 × 全动作枚举(含单拿宝石、牌库盲留)× 1-ply 对手应手。
 *  档位之间只差上面那组旋钮,所以任何一次改动都能用 tools/selfplay.js matrix 量化验证。
 */
const AI_END_pts = 15;

function aiRand(v){ v.seed = (v.seed*1664525 + 1013904223) >>> 0; return v.seed/4294967296; }
/* 卡片签名:同 level 下签名相同即视为同一张(牌库里存在完全相同的复制品) */
function aiSig(c){ return c.color+"|"+c.pts+"|"+COLORS.map(x=>c.cost[x]||0).join("."); }
function aiTotalTok(p){ return COLORS.reduce((s,c)=>s+p.tokens[c],0) + p.tokens.O; }
function aiSelKey(sel){ return COLORS.map(c=>sel[c]||0).join(","); }

/* —— 视图:仅公开信息 —— */
function aiBaseView(){
  const me = S.cur, n = S.players.length;
  const visibleAt = {1:new Map(),2:new Map(),3:new Map()};
  const add = c => {
    const m = visibleAt[c.lv], k = aiSig(c);
    m.set(k, (m.get(k)||0)+1);
  };
  for(const lv of [1,2,3]) S.board[lv].forEach(add);
  S.players.forEach(p=>p.purchased.forEach(add));
  S.players.forEach((p,i)=>{ if(i===me) p.reserved.forEach(add); });   /* 只算自己的预留 */

  /* 未现身的所有牌 = 整副 - 已现身的多重集;其中一部分在对手手里(内容未知) */
  const pool = {1:[],2:[],3:[]}, deckLen = {1:0,2:0,3:0};
  for(const lv of [1,2,3]){
    const left = new Map(visibleAt[lv]);
    for(const c of DECK_DATA[lv]){
      const k = aiSig(c), r = left.get(k)||0;
      if(r>0) left.set(k, r-1); else pool[lv].push(c);
    }
    deckLen[lv] = S.decks[lv].length;      /* 牌库余数是公开信息 */
  }
  return {
    me, n, endTriggeredBy:S.endTriggeredBy, seed:(Date.now()^0x9e3779b9)>>>0,
    tokens:{...S.tokens},
    board:{1:S.board[1].slice(),2:S.board[2].slice(),3:S.board[3].slice()},
    deckLen, pool,
    deck:{1:[],2:[],3:[]},
    nobles:S.nobles.map(x=>({
      cost:x.cost,
      taken:x.taken===null ? null : S.players.findIndex(p=>p.name===x.taken),
    })),
    players:S.players.map((p,i)=>({
      tokens:{...p.tokens}, bonus:{...p.bonus}, pts:p.pts, cards:p.cards,
      reserved:i===me ? p.reserved.slice() : [],
      hiddenRes:i===me ? 0 : p.reserved.length,
      nobles:[], isAI:Boolean(p.isAI),
    })),
  };
}
function aiViewClone(v){
  return {
    me:v.me, n:v.n, endTriggeredBy:v.endTriggeredBy, seed:v.seed,
    tokens:{...v.tokens},
    board:{1:v.board[1].slice(),2:v.board[2].slice(),3:v.board[3].slice()},
    deckLen:v.deckLen, pool:v.pool,
    deck:{1:v.deck[1].slice(),2:v.deck[2].slice(),3:v.deck[3].slice()},
    nobles:v.nobles.map(x=>({cost:x.cost, taken:x.taken})),
    players:v.players.map(p=>({
      tokens:{...p.tokens}, bonus:{...p.bonus}, pts:p.pts, cards:p.cards,
      reserved:p.reserved.slice(), hiddenRes:p.hiddenRes, nobles:p.nobles.slice(), isAI:p.isAI,
    })),
  };
}
/* 把「未现身的牌」随机切成 牌库 + 对手预留 两部分(同一份抽样内保持一致) */
function aiDeterminize(v){
  for(const lv of [1,2,3]){
    const cards = v.pool[lv].slice();
    for(let i=cards.length-1;i>0;i--){
      const j = Math.floor(aiRand(v)*(i+1));
      const t=cards[i]; cards[i]=cards[j]; cards[j]=t;
    }
    /* 前 deckLen 张进牌库;其余落在对手手里,前瞻中不会再回到牌桌 */
    v.deck[lv] = cards.slice(0, v.deckLen[lv]);
  }
}

/* —— 模拟动作 —— */
function aiRefill(v,lv){ if(v.board[lv].length<4 && v.deck[lv].length) v.board[lv].push(v.deck[lv].pop()); }
function aiEndTrigger(v,pi){ if(v.endTriggeredBy<0 && v.players[pi].pts>=AI_END_pts) v.endTriggeredBy=pi; }
function aiNobleDeny(v,pi,noble){
  let s=0;
  v.players.forEach((op,i)=>{
    if(i===pi) return;
    const gap = COLORS.reduce((a,c)=>a+Math.max(0,(noble.cost[c]||0)-op.bonus[c]),0);
    s += 3/(gap+1);
  });
  return s;
}
function aiSimNobles(v,pi){
  const p=v.players[pi];
  for(let guard=0; guard<3; guard++){
    const open = v.nobles.filter(x=>x.taken===null && COLORS.every(c=>p.bonus[c]>=(x.cost[c]||0)));
    if(!open.length) return;
    let best=open[0], bs=-Infinity;
    open.forEach(x=>{ const s=aiNobleDeny(v,pi,x); if(s>bs){ bs=s; best=x; } });
    best.taken = pi; p.pts += 3; p.nobles.push(best);
    aiEndTrigger(v,pi);
  }
}
function aiSimBuy(v,pi,card,fromRes){
  const p=v.players[pi];
  const pay = costFor(p, card);
  for(const c of COLORS){ p.tokens[c]-=pay[c]; v.tokens[c]+=pay[c]; }
  p.tokens.O-=pay.O; v.tokens.O+=pay.O;
  p.bonus[card.color]++; p.cards++; p.pts+=card.pts;
  if(fromRes){
    const k=p.reserved.indexOf(card); if(k>=0) p.reserved.splice(k,1);
  }else{
    const b=v.board[card.lv], k=b.indexOf(card);
    if(k>=0) b.splice(k,1);
    aiRefill(v,card.lv);
  }
  aiSimNobles(v,pi);
  aiEndTrigger(v,pi);
}
function aiSimReserve(v,pi,card,lv){
  const p=v.players[pi];
  if(p.reserved.length>=3) return;
  let got;
  if(card){
    const b=v.board[lv], k=b.indexOf(card);
    if(k>=0) b.splice(k,1);
    got=card; aiRefill(v,lv);
  }else{
    if(!v.deck[lv].length) return;
    got=v.deck[lv].pop();
  }
  p.reserved.push(got);
  if(v.tokens.O>0){ v.tokens.O--; p.tokens.O++; }
}
function aiSimTake(v,pi,sel){
  const p=v.players[pi];
  for(const c of COLORS){
    const k=Math.min(sel[c]||0, v.tokens[c]);
    v.tokens[c]-=k; p.tokens[c]+=k;
  }
  aiSimDiscard(v,pi);
}
function aiSimDiscard(v,pi){
  const p=v.players[pi];
  for(let guard=0; aiTotalTok(p)>10 && guard<12; guard++){
    let worst=null, ws=Infinity;
    [...COLORS,GOLD].forEach(c=>{
      if(p.tokens[c]<=0) return;
      const val = aiTokenKeepValue(v,pi,c);
      if(val<ws){ ws=val; worst=c; }
    });
    if(worst===null) return;
    p.tokens[worst]--; v.tokens[worst]++;
  }
}

/* —— 子评估函数 —— */
function aiNobleColorValueView(v,pi,color){
  const p=v.players[pi];
  let s=0;
  v.nobles.forEach(x=>{
    if(x.taken!==null) return;
    if(!x.cost[color] || p.bonus[color]>=(x.cost[color]||0)) return;
    const gap = COLORS.reduce((a,c)=>a+Math.max(0,(x.cost[c]||0)-p.bonus[c]),0);
    s += 1 + 3/(gap+1);
  });
  return s;
}
/* 单个宝石对该玩家当前目标的边际价值(用于剪枝、选宝石、弃牌) */
function aiTokenKeepValue(v,pi,color){
  if(color===GOLD) return 7;                        /* 金币万能,最后才弃 */
  const p=v.players[pi];
  let s = aiNobleColorValueView(v,pi,color)*1.1;
  const watch = p.reserved.concat(v.board[1],v.board[2],v.board[3]);
  watch.forEach(c=>{
    const gap = Math.max(0,(c.cost[color]||0)-p.bonus[color]-p.tokens[color]);
    if(gap<=0) return;
    const tot = COLORS.reduce((a,x)=>a+Math.max(0,(c.cost[x]||0)-p.bonus[x]-p.tokens[x]),0);
    if(tot<=3) s += (c.pts+0.5)*(3-tot)*0.45;
  });
  s -= Math.max(0, p.tokens[color]-3)*0.55;         /* 同色囤积边际递减 */
  return s;
}
function aiDiscountAsset(v,pi){
  const p=v.players[pi];
  let s=0;
  COLORS.forEach(c=>{ const b=p.bonus[c]; if(b>0) s += b + Math.max(0,b-3)*0.6; });
  return s;
}
function aiNobleCloseness(v,pi){
  const p=v.players[pi];
  let s=0;
  v.nobles.forEach(x=>{
    if(x.taken!==null) return;
    const gap = COLORS.reduce((a,c)=>a+Math.max(0,(x.cost[c]||0)-p.bonus[c]),0);
    s += gap===0 ? 3 : 3*Math.exp(-gap/2.5);
  });
  return s;
}
function aiTokenSurplus(v,pi){
  const p=v.players[pi];
  let s=0;
  COLORS.forEach(c=>{ s += Math.max(0, p.tokens[c]-4)*0.7; });
  const total = aiTotalTok(p);
  s += Math.max(0,total-10)*1.2 + Math.max(0,total-7)*0.12;
  return s;
}
/* 我把这张卡从市场上摘走,对手损失的期望分 */
function aiOpponentThreatGain(v,pi,card){
  let g=0;
  v.players.forEach((op,i)=>{
    if(i===pi) return;
    const need = COLORS.reduce((a,c)=>a+Math.max(0,(card.cost[c]||0)-op.bonus[c]-op.tokens[c]),0);
    const eff = need - Math.min(need, op.tokens.O);
    if(eff<=0) g += card.pts + 1.2;
    else if(eff<=2 && card.pts>=2) g += card.pts*0.6;
    else g += Math.max(0,card.pts-0.5)*0.2/(1+eff);
  });
  return card.pts>=3 ? g*1.3 : g;
}
/* 折扣引擎价值:这张卡的色彩能替未来省下多少现金
   (按在售/已预定卡在该色上的缺口累计;高手会为此买 0 分卡) */
function aiBonusLift(lists,color,bonus){
  let s=0;
  lists.forEach(list=>list.forEach(c=>{
    if(c.color!==color) return;
    const need=(c.cost[color]||0)-(bonus[color]||0);
    if(need>0) s += Math.min(need,2)*0.3;
  }));
  return s;
}
/* 距离最近的开放贵族在该色上还差几层折扣(贵族只认折扣,不认散宝石) */
function aiNobleNeed(v,pi,color){
  const p=v.players[pi];
  let g=0;
  v.nobles.forEach(x=>{
    if(x.taken!==null) return;
    const gap = COLORS.reduce((a,c)=>a+Math.max(0,(x.cost[c]||0)-p.bonus[c]),0);
    if(gap<=4) g = Math.max(g, Math.max(0,(x.cost[color]||0)-p.bonus[color]));
  });
  return g;
}
/* 贪心估算:该玩家还要几个回合到 15 分(越小越危险) */
function aiRaceTurns(v,pi){
  const p=v.players[pi];
  const tok={...p.tokens}, bonus={...p.bonus}, bank={...v.tokens};
  const board={1:v.board[1].slice(),2:v.board[2].slice(),3:v.board[3].slice()};
  const deck ={1:v.deck[1].slice(),2:v.deck[2].slice(),3:v.deck[3].slice()};
  const res  = p.reserved.slice();
  const fake = {tokens:tok, bonus};
  const lists = [res,board[1],board[2],board[3]];
  /* 贵族状态用本地覆盖集合模拟,绝不写回 v.nobles(共享对象) */
  const nTaken = new Set(); v.nobles.forEach(x=>{ if(x.taken!==null) nTaken.add(x); });
  const gapOf = c => COLORS.reduce((a,x)=>a+Math.max(0,(c.cost[x]||0)-bonus[x]-tok[x]),0);
  const drop  = (c,fromRes)=>{
    if(fromRes){ const k=res.indexOf(c); if(k>=0) res.splice(k,1); return; }
    const b=board[c.lv], k=b.indexOf(c);
    if(k>=0) b.splice(k,1);
    aiSimRefillLocal(board,deck,c.lv);
  };
  let pts=p.pts, turns=0;
  for(let guard=0; guard<20 && pts<AI_END_pts; guard++){
    /* 1) 先买当下就买得起、且真正有价值的卡(0 分卡只在缺该色折扣时才碰) */
    let buy=null, bs=-Infinity;
    const scanBuy=(list,fromRes)=>list.forEach(c=>{
      if(c.pts<=0 && bonus[c.color]>=2) return;
      const gap = gapOf(c);
      if(gap > tok.O) return;                       /* 买不起 */
      const sc = c.pts*1.5 + c.lv*0.5 + (c.pts>0?2:0) + (fromRes?0.4:0)
        + aiBonusLift(lists,c.color,bonus);
      if(sc>bs){ bs=sc; buy={card:c,fromRes}; }
    });
    scanBuy(res,true);
    for(const lv of [1,2,3]) scanBuy(board[lv],false);
    if(buy){
      const c=buy.card, pay=costFor(fake,c);
      for(const x of COLORS){ tok[x]-=pay[x]; bank[x]+=pay[x]; }
      tok.O-=pay.O; bank.O+=pay.O;
      bonus[c.color]++; pts+=c.pts; turns++;
      drop(c,buy.fromRes);
      /* 贵族是白送的 3 分:漏记会让 4-4-4 这类路线在模型里永远 0 进度 */
      v.nobles.forEach(x=>{
        if(nTaken.has(x)) return;
        if(COLORS.every(k=>bonus[k]>=(x.cost[k]||0))){ nTaken.add(x); pts+=3; }
      });
      continue;
    }
    /* 2) 买不起 → 锁定性价比最高的正分目标,按合法规则拿一轮宝石 */
    let tgt=null, tev=Infinity, tval=-Infinity;
    const scanTgt=(list)=>list.forEach(c=>{
      if(c.pts<=0) return;
      const gap = gapOf(c), eff = gap - Math.min(gap, tok.O);
      if(eff<=0) return;
      const val = (c.pts*2 + c.lv*0.8)/(1+eff);
      if(val>tval || (val===tval && eff<tev)){ tval=val; tev=eff; tgt=c; }
    });
    scanTgt(res);
    for(const lv of [1,2,3]) scanTgt(board[lv]);
    if(!tgt) break;
    const need={};
    COLORS.forEach(x=>{ need[x]=Math.max(0,(tgt.cost[x]||0)-bonus[x]-tok[x]); });
    const order=COLORS.filter(x=>need[x]>0).sort((a,b)=>need[b]-need[a] || bank[b]-bank[a]);
    let took=0;
    const give=(x,k)=>{ bank[x]-=k; tok[x]+=k; need[x]-=k; took+=k; };
    for(const x of order){ if(need[x]>=2 && bank[x]>=4){ give(x,2); break; } }   /* 2 同色 */
    if(took===0){                                                                /* ≤3 异色 */
      const picked=new Set();
      for(const x of order){
        if(picked.size>=3) break;
        if(need[x]>0 && bank[x]>0){ give(x,1); picked.add(x); }
      }
    }
    if(took===0) break;                                                          /* 市场已空 */
    turns++;
  }
  const luck = pi===v.me ? 0 : p.hiddenRes*0.35;     /* 对手暗牌带来的运气折减 */
  return turns + Math.max(0,AI_END_pts-pts)*0.6 - luck;
}
function aiSimRefillLocal(board,deck,lv){
  if(board[lv].length<4 && deck[lv].length) board[lv].push(deck[lv].pop());
}
function aiTurnsLeft(v){
  if(v.endTriggeredBy<0) return 99;
  return ((v.endTriggeredBy - v.me + v.n) % v.n) + 1;
}
/* 「回合机会成本」:race 模型对每类动作都假设完美转化,
   但只有买卡是把分数落袋,拿宝石/预定都是纸面进度 → 按回合数折价 */
function aiTempoCost(a,prof){
  const w=(prof&&prof.w)||{};
  if(a.kind==="buy") return 0;
  if(a.kind==="res") return w.tempoRes!==undefined ? w.tempoRes : 1.1;
  if(a.kind==="resdeck") return w.tempoDeck!==undefined ? w.tempoDeck : 2.2;
  return w.tempoGems!==undefined ? w.tempoGems : 0.6;
}
/* ── 轮流贪心推演:双方在同一个市场上交替行动到 15 分,直接估计「谁先撞线」 ── */
function aiPlayoutStep(v,pi){
  const p=v.players[pi];
  const lists=[p.reserved, v.board[1], v.board[2], v.board[3]];
  let best=null, bs=-Infinity;
  const scan=(list,fromRes)=>list.forEach(c=>{
    if(!canAfford(p,c)) return;
    if(c.pts<=0 && p.bonus[c.color]>=3) return;
    const sc = c.pts*3 + c.lv*1.5 + (fromRes?0.3:0) + (p.bonus[c.color]<2?0.8:0)
      + aiBonusLift(lists,c.color,p.bonus);
    if(sc>bs){ bs=sc; best={card:c,fromRes}; }
  });
  scan(p.reserved,true);
  for(const lv of [1,2,3]) scan(v.board[lv],false);
  if(best){ aiSimBuy(v,pi,best.card,best.fromRes); return; }
  let tgt=null, tv=-Infinity;
  const scanT=(list)=>list.forEach(c=>{
    if(c.pts<=0) return;
    const gap = COLORS.reduce((a,x)=>a+Math.max(0,(c.cost[x]||0)-p.bonus[x]-p.tokens[x]),0);
    const val=(c.pts*2+c.lv*0.8)/(1+gap);
    if(val>tv){ tv=val; tgt=c; }
  });
  scanT(p.reserved);
  for(const lv of [1,2,3]) scanT(v.board[lv]);
  const need={};
  COLORS.forEach(x=>{
    const cardGap = tgt ? Math.max(0,(tgt.cost[x]||0)-p.bonus[x]-p.tokens[x]) : 0;
    /* 贵族路线也要靠散宝石以外的折扣堆出来,否则推演里永远看不到 4-4-4 */
    need[x]= cardGap + aiNobleNeed(v,pi,x)*0.6;
  });
  const order=COLORS.slice().sort((a,b)=>need[b]-need[a] || v.tokens[b]-v.tokens[a]);
  const sel=emptyGemSelection();
  let took=0;
  for(const x of order){ if(need[x]>=2 && v.tokens[x]>=4){ sel[x]=2; took=2; break; } }
  if(took===0) for(const x of order){ if(took>=3) break; if(v.tokens[x]>0){ sel[x]++; took++; } }
  aiSimTake(v,pi,sel);
}
function aiPlayout(v,pi,rounds){
  const g=aiViewClone(v);
  const ops=[]; g.players.forEach((o,i)=>{ if(i!==pi) ops.push(i); });
  const maxOf = () => Math.max(...ops.map(i=>g.players[i].pts));
  const myPts = () => g.players[pi].pts;
  for(let r=0; r<(rounds||10); r++){
    aiPlayoutStep(g,pi);
    if(myPts()>=AI_END_pts) return AI_END_pts + Math.max(0, AI_END_pts - maxOf());
    for(const oi of ops){
      aiPlayoutStep(g,oi);
      if(g.players[oi].pts>=AI_END_pts) return -(AI_END_pts + Math.max(0, AI_END_pts - myPts()));
    }
  }
  return myPts() - maxOf();
}
function simScore(v,pi,prof,block,tempo){
  const w=prof.w, p=v.players[pi];
  const endgame = aiTurnsLeft(v)<=3;
  let s = p.pts * (endgame?w.ptsEnd:w.pts);
  if(p.pts>=AI_END_pts) s += 12;
  if(w.play){
    s += aiPlayout(v,pi,w.rounds||10) * w.play;
  }else if(w.race){
    const mine = aiRaceTurns(v,pi);
    let threat = 99;
    v.players.forEach((o,i)=>{ if(i!==pi) threat = Math.min(threat, aiRaceTurns(v,i)); });
    s += (threat - mine) * w.race * (endgame?0.5:1);
  }
  s += aiDiscountAsset(v,pi) * w.discount;
  s += aiNobleCloseness(v,pi) * w.noble;
  s += p.tokens.O * (endgame?w.goldEnd:w.gold) * 0.6;
  s -= aiTokenSurplus(v,pi) * w.surplus;
  if(block) s -= block * (endgame?w.blockEnd:w.block);
  if(tempo) s -= tempo * (w.race||1) * (endgame?1.4:1);
  return s;
}

/* —— 动作空间(比旧 AI 完整:含单拿宝石与牌库盲留) —— */
function aiGemCombos(v,pi){
  const legal=[];
  const build=arr=>{ const sel=emptyGemSelection(); arr.forEach(c=>sel[c]++); return sel; };
  const u=arr=>arr.reduce((s,c)=>s+aiTokenKeepValue(v,pi,c),0);
  for(let i=0;i<COLORS.length;i++)
    for(let j=i+1;j<COLORS.length;j++)
      for(let k=j+1;k<COLORS.length;k++){
        const a=COLORS[i],b=COLORS[j],c=COLORS[k];
        if(v.tokens[a]&&v.tokens[b]&&v.tokens[c]) legal.push({sel:build([a,b,c]), val:u([a,b,c])+0.6});
      }
  COLORS.forEach(c=>{ if(v.tokens[c]>=4) legal.push({sel:build([c,c]), val:aiTokenKeepValue(v,pi,c)*1.8}); });
  for(let i=0;i<COLORS.length;i++)
    for(let j=i+1;j<COLORS.length;j++)
      if(v.tokens[COLORS[i]]&&v.tokens[COLORS[j]])
        legal.push({sel:build([COLORS[i],COLORS[j]]), val:u([COLORS[i],COLORS[j]])*0.8});
  COLORS.forEach(c=>{ if(v.tokens[c]) legal.push({sel:build([c]), val:aiTokenKeepValue(v,pi,c)*0.7}); });
  legal.sort((a,b)=>b.val-a.val);
  const out=[], seen=new Set();
  for(const x of legal){
    const k=aiSelKey(x.sel);
    if(seen.has(k)) continue;
    seen.add(k); out.push(x.sel);
    if(out.length>=8) break;
  }
  return out;
}
function aiKernelActions(v){
  const pi=v.me, p=v.players[pi], acts=[];
  const room = p.reserved.length<3;
  p.reserved.forEach(c=>{ if(canAfford(p,c)) acts.push({kind:"buy", card:c, fromRes:true, level:c.lv}); });
  for(const lv of [1,2,3]){
    v.board[lv].forEach(c=>{
      if(canAfford(p,c)) acts.push({kind:"buy", card:c, fromRes:false, level:lv});
      if(room) acts.push({kind:"res", card:c, fromRes:false, level:lv});
    });
    if(room && v.deck[lv].length) acts.push({kind:"resdeck", card:null, level:lv});
  }
  aiGemCombos(v,pi).forEach(sel=>acts.push({kind:"gems", sel}));
  acts.forEach(a=>{
    a.block = a.card ? aiOpponentThreatGain(v,pi,a.card) : 0;
    a.key = a.kind==="buy"   ? "buy|"+(a.fromRes?"r"+p.reserved.indexOf(a.card):"b"+a.level+"|"+v.board[a.level].indexOf(a.card))
          : a.kind==="res"   ? "res|b"+a.level+"|"+v.board[a.level].indexOf(a.card)
          : a.kind==="resdeck" ? "res|d"+a.level
          : "gem|"+aiSelKey(a.sel);
  });
  return acts;
}
function aiCheapScore(v,pi,a){
  const p=v.players[pi];
  if(a.kind==="buy"){
    const need = COLORS.reduce((s,c)=>s+Math.max(0,(a.card.cost[c]||0)-p.bonus[c]-p.tokens[c]),0);
    const eff  = need - Math.min(need, p.tokens.O);
    return a.card.pts*3 + a.card.lv*1.5 - eff*1.2 + (a.fromRes?0.5:0);
  }
  if(a.kind==="res")  return a.card.pts*1.6 + a.card.lv + a.block*1.1
    - COLORS.reduce((s,c)=>s+Math.max(0,(a.card.cost[c]||0)-p.bonus[c]-p.tokens[c]),0)*0.5;
  if(a.kind==="resdeck") return 0.2;
  return COLORS.reduce((s,c)=>s+(a.sel[c]||0)*aiTokenKeepValue(v,pi,c),0);
}
function aiApply(v,pi,a){
  if(a.kind==="buy") aiSimBuy(v,pi,a.card,a.fromRes);
  else if(a.kind==="res") aiSimReserve(v,pi,a.card,a.level);
  else if(a.kind==="resdeck") aiSimReserve(v,pi,null,a.level);
  else aiSimTake(v,pi,a.sel);
}
/* 对手 1-ply 应手:oppPolicy="greedy" 只看眼前性价比;
   "play" 借用推演政策(会算折扣引擎与贵族),master 用它预判高手对手 */
function aiOpponentStep(v,oi){
  if(aiProfile().oppPolicy === "play"){ aiPlayoutStep(v,oi); return; }
  const op=v.players[oi];
  let best=null, bs=-Infinity;
  for(const lv of [1,2,3]) v.board[lv].forEach(c=>{
    if(!canAfford(op,c)) return;
    const sc = c.pts*3 + c.lv*2;
    if(sc>bs){ bs=sc; best=c; }
  });
  if(best){ aiSimBuy(v,oi,best,false); return; }
  const sel = aiGemCombos(v,oi)[0] || emptyGemSelection();
  aiSimTake(v,oi,sel);
}
function aiKernelDecide(){
  const prof=aiProfile(), base=aiBaseView();
  const root=aiViewClone(base); aiDeterminize(root);
  const acts=aiKernelActions(root);
  if(!acts.length) return null;
  acts.forEach(a=>{ a.cheap = aiCheapScore(root,root.me,a); });
  /* 分桶剪枝:保证每一类动作都有代表,不让「拿宝石」挤光「买卡」 */
  const QUOTA = prof.quota || {buy:5,res:3,resdeck:1,gems:3};
  const cap=Math.max(2, prof.kFollow||8);
  const buckets={buy:[],res:[],resdeck:[],gems:[]};
  acts.forEach(a=>{ (buckets[a.kind]||(buckets[a.kind]=[])).push(a); });
  Object.values(buckets).forEach(list=>list.sort((a,b)=>b.cheap-a.cheap));
  const ranked=[], rest=[];
  for(const kind of ["buy","res","resdeck","gems"]){
    const list=buckets[kind]||[];
    ranked.push(...list.slice(0, QUOTA[kind]||1));
    rest.push(...list.slice(QUOTA[kind]||1));
  }
  if(ranked.length<cap){ rest.sort((a,b)=>b.cheap-a.cheap); ranked.push(...rest.slice(0, cap-ranked.length)); }
  const agg = new Map();
  for(let s=0;s<(prof.samples||1);s++){
    const v = aiViewClone(root);
    v.seed = (root.seed + s*7919 + 17) >>> 0;
    aiDeterminize(v);
    const left = aiTurnsLeft(v);
    for(const a of ranked){
      const tp = aiTempoCost(a, prof);
      const c = aiViewClone(v);
      aiApply(c, c.me, a);
      const after = simScore(c, c.me, prof, a.block, tp);
      let val = after;
      const lam = prof.lookahead !== undefined ? prof.lookahead : 0.6;
      /* 终局只剩自己一步时,前瞻没有意义 → 跳过;lam=0 时同样直接省掉整次克隆 */
      if(lam>0 && left>2 && c.endTriggeredBy<0){
        const nx = (c.me+1) % c.n;
        const c2 = aiViewClone(c);
        aiOpponentStep(c2, nx);
        const le = lam * (a.kind==="gems" ? 0.7 : 1);
        val = after*(1-le) + simScore(c2, c2.me, prof, a.block, tp)*le;
      }
      const cur = agg.get(a.key);
      if(cur){ cur.t+=val; cur.k++; } else agg.set(a.key, {t:val, k:1, a});
    }
  }
  const scored=[];
  agg.forEach(x=>scored.push({m:x.t/x.k, a:x.a}));
  scored.sort((x,y)=>y.m-x.m);
  /* epsilon:在 Top-3 内按 softmax(分差 / (eps×分差离散度)) 抽样。
     eps=0 → 严格 argmax;eps 越大越"手软",这是低档位唯一的犯错来源。 */
  const eps = prof.epsilon || 0;
  if(eps<=0 || scored.length<2) return scored[0].a;
  const top = scored.slice(0,3);
  const spread = top.reduce((s,x)=>s+Math.abs(x.m-top[0].m),0)/top.length;
  const T = Math.max(1e-6, eps*(spread + Math.abs(top[0].m)*0.1));
  let total=0;
  top.forEach(x=>{ x.p = Math.exp((x.m-top[0].m)/T); total += x.p; });
  let r = aiRand(root)*total;
  for(const x of top){ r -= x.p; if(r<=0) return x.a; }
  return top[top.length-1].a;
}
function aiKernelAct(){
  const p=cp();
  const a = aiKernelDecide();
  if(!a){ logMsg(`${p.name} 无可执行动作,跳过回合`); nextTurn(); return; }
  if(a.kind==="buy") buyCard(a.card, a.fromRes, a.level);
  else if(a.kind==="res") reserveCard(a.card, a.level);
  else if(a.kind==="resdeck") reserveCard(null, a.level);
  else { S.gemSel = a.sel; takeGems(); }
}
function aiKernelDiscard(){
  const p=cp(), v=aiBaseView(), pv=v.players[v.me];
  const discarded=emptyGemSelection();
  while(aiTotalTok(pv)>10){
    let worst=null, ws=Infinity;
    [...COLORS,GOLD].forEach(c=>{
      if(pv.tokens[c]<=0) return;
      const val=aiTokenKeepValue(v,v.me,c);
      if(val<ws){ ws=val; worst=c; }
    });
    if(worst===null) break;
    pv.tokens[worst]--; v.tokens[worst]++;
    p.tokens[worst]--; S.tokens[worst]++;
    discarded[worst]++;
  }
  return discarded;
}
/* 多贵族来访时择优:分值都是 +3,取「最能卡住对手」的那位 */
function aiPickNoble(player, eligible){
  if(eligible.length<2) return eligible[0];
  let best=eligible[0], bs=-Infinity;
  eligible.forEach(n=>{
    let s=0;
    S.players.forEach(op=>{
      if(op===player) return;
      const gap = COLORS.reduce((a,c)=>a+Math.max(0,(n.cost[c]||0)-op.bonus[c]),0);
      s += 3/(gap+1);
    });
    if(s>bs){ bs=s; best=n; }
  });
  return best;
}

function aiTakeAction(){ aiKernelAct(); }
function runAITurn(){
  aiTimer = null;
  if(!isAITurn()) return;
  if(S.phase==="discard"){
    aiDiscardTokens();
    return;
  }
  if(S.phase==="action") aiTakeAction();
}
function scheduleAITurn(delay=1450){
  clearTimeout(aiTimer);
  if(!isAITurn()) return;
  aiTimer = setTimeout(runAITurn,delay);
}

/* ───────────────────────── 回合动作 ───────────────────────── */
function takeGems(){
  if(S.actionTaken) return;
  const sel = S.gemSel;
  const p = cp();
  const total = COLORS.reduce((s,c)=>s+sel[c],0);
  if(total<1) return;

  /* 拿宝石动画:修改状态前先捕获宝石库中各选中色的位置并克隆 */
  const flyers = [];
  for(const c of COLORS){
    const count = sel[c];
    if(count<=0) continue;
    if(S.tokens[c]<count){ msg("该颜色宝石不足!"); return; }
    const bankGem = document.querySelector(`#bank .gem[data-c="${c}"]`);
    if(bankGem){
      const rect = bankGem.getBoundingClientRect();
      for(let i=0;i<count;i++){
        const clone = bankGem.cloneNode(true);
        clone.classList.remove('sel','empty');
        flyers.push({flyer:clone, sourceRect:rect, color:c});
      }
    }
  }

  for(const c of COLORS){
    const k = sel[c];
    for(let i=0;i<k;i++){ S.tokens[c]--; p.tokens[c]++; }
  }
  logMsg(`${p.name} 拿了 ${gemSelText(sel)}`);
  S.gemSel = {W:0,B:0,G:0,R:0,K:0};
  S.actionTaken = true;

  if(flyers.length && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    flyGemsToPlayer(flyers, ()=>afterAction());
  }else{
    afterAction();
  }
}
function gemSelText(sel){
  const parts=[];
  for(const c of COLORS) if(sel[c]) parts.push(sel[c]>1?`${sel[c]}个${COLOR_NAME[c]}`:`${COLOR_NAME[c]}宝石`);
  return parts.join("+");
}

function buyCard(card, fromReserved, levelIdx){
  if(S.actionTaken) return;
  const p = cp();
  if(!canAfford(p, card)){ msg("宝石不够,买不了这张卡"); return; }

  /* 买牌动画:修改状态前先捕获源卡牌位置并克隆 */
  let sourceEl = null;
  if(!fromReserved && levelIdx){
    const cid = S.board[levelIdx].indexOf(card);
    sourceEl = document.querySelector(`.card[data-lv="${levelIdx}"][data-cid="${cid}"]`);
  }else if(fromReserved){
    const resIdx = p.reserved.indexOf(card);
    const pEl = document.querySelectorAll('.player')[S.cur];
    if(pEl) sourceEl = pEl.querySelectorAll('.rmini')[resIdx] || null;
  }
  const sourceRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
  const flyer = sourceEl ? sourceEl.cloneNode(true) : null;
  if(flyer) flyer.classList.remove('afford','sel');

  const pay = costFor(p, card);
  for(const c of COLORS){ p.tokens[c] -= pay[c]; S.tokens[c] += pay[c]; }
  p.tokens.O -= pay.O; S.tokens.O += pay.O;
  p.bonus[card.color]++; p.cards++; p.pts += card.pts;
  p.purchased.push(card);

  if(fromReserved) p.reserved = p.reserved.filter(x=>x!==card);
  else {
    const b = S.board[card.lv];
    b.splice(b.indexOf(card),1);
    if(S.decks[card.lv].length) b.push(S.decks[card.lv].pop());
  }
  logMsg(`${p.name} 购买了 ${COLOR_NAME[card.color]}色 ${card.pts}分卡(花费 ${costText(pay)})`);
  S.actionTaken = true;
  S.sel = null;

  if(flyer && sourceRect && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    flyCardAnimate(flyer, sourceRect, ()=>{
      const pEl = document.querySelectorAll('.player')[S.cur];
      if(!pEl) return null;
      const st = pEl.querySelectorAll('.owned-stack')[COLORS.indexOf(card.color)];
      if(!st) return null;
      const oc = st.querySelectorAll('.owned-card');
      return oc.length ? oc[oc.length-1] : null;
    }, ()=>afterAction());
  }else{
    afterAction();
  }
}

/* 动画收尾兜底:onfinish 是「回合交接」的唯一推进路径(→ afterAction → finishTurn → 下一位),
   但标签页被冻结、webview 省电、无合成环境等情况下 Web Animations 的时间轴可能永不推进,
   onfinish 不触发就会表现成「AI 永远不思考」的假死。这里把收尾包成「最多执行一次」,
   并挂一个比动画时长更长的定时器:谁先到谁负责清理,后到的那个是空操作。 */
function guardedDone(done, ms){
  let fired = false;
  const settle = ()=>{ if(fired) return; fired = true; done(); };
  setTimeout(settle, ms);
  return settle;
}

/* 卡牌飞行动画:克隆卡牌从源位置滑入目标位置 */
function flyCardAnimate(flyer, sourceRect, findTarget, done){
  render();
  const targetEl = findTarget();
  if(!targetEl){ flyer.remove(); done(); return; }
  const tgtRect = targetEl.getBoundingClientRect();
  flyer.style.cssText = `position:fixed;left:${sourceRect.left}px;top:${sourceRect.top}px;width:${sourceRect.width}px;height:${sourceRect.height}px;margin:0;padding:0;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.6);transition:none;`;
  document.body.appendChild(flyer);
  targetEl.style.visibility = 'hidden';
  const dx = (tgtRect.left+tgtRect.width/2)-(sourceRect.left+sourceRect.width/2);
  const dy = (tgtRect.top+tgtRect.height/2)-(sourceRect.top+sourceRect.height/2);
  const scale = tgtRect.width / sourceRect.width;
  const settle = guardedDone(()=>{
    flyer.remove();
    targetEl.style.visibility = '';
    done();
  }, 560 + 600);
  flyer.animate([
    {transform:'translate(0,0) scale(1)', opacity:1},
    {transform:`translate(${dx}px,${dy}px) scale(${scale})`, opacity:1, offset:.82},
    {transform:`translate(${dx}px,${dy}px) scale(${scale})`, opacity:0}
  ], {duration:560, easing:'cubic-bezier(.4,0,.2,1)'}).onfinish = settle;
}

/* 拿宝石飞行动画:克隆宝石从宝石库滑入玩家面板 */
function flyGemsToPlayer(flyers, done){
  render();
  const playerEl = document.querySelectorAll('.player')[S.cur];
  let remaining = flyers.length;
  const finish = ()=>{ if(--remaining===0) done(); };
  flyers.forEach(({flyer,sourceRect,color}, idx)=>{
    let targetEl = null;
    if(playerEl) targetEl = playerEl.querySelector(`.resource-slots .gem[data-c="${color}"]`);
    if(!targetEl){ flyer.remove(); finish(); return; }
    const tgtRect = targetEl.getBoundingClientRect();
    flyer.style.cssText = `position:fixed;left:${sourceRect.left}px;top:${sourceRect.top}px;width:${sourceRect.width}px;height:${sourceRect.height}px;margin:0;padding:0;z-index:100;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.5);transition:none;`;
    document.body.appendChild(flyer);
    targetEl.style.visibility = 'hidden';
    const dx = (tgtRect.left+tgtRect.width/2)-(sourceRect.left+sourceRect.width/2);
    const dy = (tgtRect.top+tgtRect.height/2)-(sourceRect.top+sourceRect.height/2);
    const scale = tgtRect.width / sourceRect.width;
    const settle = guardedDone(()=>{
      flyer.remove();
      targetEl.style.visibility = '';
      finish();
    }, 440 + idx*90 + 600);
    flyer.animate([
      {transform:'translate(0,0) scale(1)', opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(${scale})`, opacity:1, offset:.82},
      {transform:`translate(${dx}px,${dy}px) scale(${scale})`, opacity:0}
    ], {duration:440, delay:idx*90, easing:'cubic-bezier(.4,0,.2,1)'}).onfinish = settle;
  });
}
function costText(pay){
  const parts=[];
  for(const c of [...COLORS,GOLD]) if(pay[c]) parts.push(`${pay[c]}${COLOR_NAME[c]}`);
  return parts.join(" ");
}

function reserveCard(card, level){
  if(S.actionTaken) return;
  const p = cp();
  if(p.reserved.length>=3){ msg("最多预留 3 张卡"); return; }

  /* 预留动画:修改状态前先捕获源卡牌位置并克隆 */
  let sourceEl = null;
  if(card){
    const cid = S.board[level].indexOf(card);
    sourceEl = document.querySelector(`.card[data-lv="${level}"][data-cid="${cid}"]`);
  }else{
    sourceEl = document.querySelector(`.deck[data-lv="${level}"]`);
  }
  const sourceRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
  const flyer = sourceEl ? sourceEl.cloneNode(true) : null;
  if(flyer) flyer.classList.remove('afford','sel');

  if(card){
    const b = S.board[level];
    b.splice(b.indexOf(card),1);
    if(S.decks[level].length) b.push(S.decks[level].pop());
    p.reserved.push(card);
  }else{
    const c = S.decks[level].pop();
    if(!c){ msg("牌库已空"); return; }
    p.reserved.push(c);
  }
  const gotGold = S.tokens.O>0;
  if(S.tokens.O>0){ S.tokens.O--; p.tokens.O++; }
  S.actionTaken = true;
  S.sel = null;
  logMsg(`${p.name} 预留了${card?"场上":"牌库"}一张卡${gotGold?"(+1金币)":"(金币已空,未获得)"}`);

  if(flyer && sourceRect && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    flyCardAnimate(flyer, sourceRect, ()=>{
      const pEl = document.querySelectorAll('.player')[S.cur];
      if(!pEl) return null;
      const rm = pEl.querySelectorAll('.rmini');
      return rm.length ? rm[rm.length-1] : null;
    }, ()=>afterAction());
  }else{
    afterAction();
  }
}

/* 动作之后:弃币 → 贵族 → 下一回合 */
function afterAction(){
  const p = cp();
  if(totalTokens(p) > 10){
    S.phase = "discard";
    render();
    msg(p.isAI
      ? `${p.name} 正在弃置多余宝石...`
      : `${p.name} 超过 10 个宝石,点击自己面板中的宝石弃掉多余的(还需弃 ${totalTokens(p)-10} 个)`);
    if(p.isAI) scheduleAITurn(450);
    return;
  }
  finishTurn();
}

function finishTurn(){
  // 贵族来访
  const p = cp();
  const eligible = S.nobles.filter(n=>n.taken===null && COLORS.every(c=>p.bonus[c]>=(n.cost[c]||0)));
  if(eligible.length===1){
    grantNoble(eligible[0]);
  }else if(eligible.length>1){
    if(p.isAI){
      grantNoble(aiPickNoble(p, eligible));
      return;
    }
    S.phase = "noble";
    render();
    showModal(`<h2>👑 多位贵族同时来访!</h2><p style="color:#8a9bb0;">只能选择一位(每位 +3 分)</p>`, eligible.map(n=>nobleHTML(n,true)).join(""),
      el=>{ el.querySelectorAll(".noble").forEach(x=>x.onclick=()=>{ grantNoble(S.nobles[+x.dataset.id]); hideModal(); }); });
    return;
  }
  nextTurn();
}
function grantNoble(n){
  const p = cp();
  n.taken = p.name;
  p.nobles.push(n);
  p.pts += 3;
  logMsg(`👑 贵族来访!${p.name} +3 分(当前 ${p.pts} 分)`);
  nextTurn();
}

function nextTurn(){
  const p = cp();
  if(p.pts>=15 && S.endTriggeredBy<0){
    S.endTriggeredBy = S.cur;
    logMsg(`⭐ ${p.name} 达到 ${p.pts} 分!完成本轮后结算`);
  }
  // 轮到触发者本人时,所有人回合数已相等,游戏结束
  const next = (S.cur+1) % S.players.length;
  if(S.endTriggeredBy>=0 && next===S.endTriggeredBy){
    gameOver(); return;
  }
  S.cur = next;
  S.turnCount++;
  S.phase = "action";
  S.actionTaken = false;
  S.gemSel = {W:0,B:0,G:0,R:0,K:0};
  S.sel = null;
  showTurnBanner(cp().name);
  render();
  scheduleAITurn();
}

/* 回合切换横幅:闪现 1.2 秒 */
let bannerTimer = null;
function showTurnBanner(name){
  const b = $("turnBanner");
  b.textContent = `轮到 ${name}`;
  b.classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(()=>b.classList.remove("show"), 1200);
}

function gameOver(){
  clearTimeout(aiTimer);
  S.phase = "over";
  render();
  showGameOverModal();
}

function showGameOverModal(){
  const ranked = [...S.players].sort((a,b)=> b.pts-a.pts || a.cards-b.cards);
  const win = ranked[0];
  showModal(`<h2>🏆 游戏结束</h2><div class="winner">冠军:${win.name}(${win.pts} 分)</div>`,
    ranked.map((p,i)=>`<div>${i+1}. ${p.name} — ${p.pts} 分 / ${p.cards} 张卡 / 贵族 ${p.nobles.length} 位</div>`).join("")
    + `<div style="margin-top:10px; font-weight:bold; color:#f0d98c;">总轮次：${roundNumber()}</div>`
    + `<div style="display:flex;gap:10px;margin-top:16px;">`
    + `<button class="btn" style="flex:1;" id="viewBoardBtn">👁 看终局场面</button>`
    + `<button class="btn gold" style="flex:1;" onclick="location.reload()">再来一局</button>`
    + `</div>`,
    el=>{
      el.querySelector('#viewBoardBtn').onclick = ()=>{
        hideModal();
        $('returnResultsBtn').hidden = false;
      };
    });
}
$('returnResultsBtn').onclick = ()=>{
  $('returnResultsBtn').hidden = true;
  showGameOverModal();
};
function msg(t){ $("msg").textContent = t; }

/* ───────────────────────── 渲染 ───────────────────────── */
function render(){
  renderTurn(); renderRound(); renderNobles(); renderBoard(); renderBank(); renderPlayers(); renderSel();
  renderAIThinking();
  if(S.phase==="action") msg(turnHintText());
  $("cancelBtn").disabled = S.phase!=="action" || cp().isAI;
  $("surrenderBtn").disabled = S.phase!=="action" || cp().isAI;
  $("log").innerHTML = [...S.log].reverse().map(t=>`<div>${t}</div>`).join("");
}
function renderTurn(){
  const aiLabel = cp().isAI ? ` · AI(${aiProfile().label})` : "";
  $("turnHint").textContent = `第 ${S.cur+1} 位玩家 · ${cp().name}${aiLabel} · ${cp().pts} 分` + (S.endTriggeredBy>=0?` ⏹ 终局轮`:"");
}
/* 一轮 = 每位玩家各行动一次 */
function roundNumber(){ return Math.floor(S.turnCount / S.players.length) + 1; }
function renderRound(){
  $("roundHint").textContent = `第 ${roundNumber()} 轮`;
}
function renderAIThinking(){
  const active = isAITurn();
  const panel = $("aiThinking");
  panel.classList.toggle("show",active);
  panel.setAttribute("aria-hidden",String(!active));
  document.body.classList.toggle("ai-thinking",active);
  if(!active) return;
  $("aiThinkingTitle").textContent = `${cp().name} 正在思考`;
  $("aiThinkingDetail").textContent = S.phase==="discard"
    ? "正在整理多余宝石"
    : `${aiProfile().label}难度 · 正在评估卡牌、宝石与对手`;
}
function nobleHTML(n, clickable){
  const reqs = Object.entries(n.cost).map(([c,k])=>`<div class="cost-gem ${COLOR_CLASS(c)}">${k}</div>`).join("");
  return `<div class="noble" ${clickable?`data-id="${n.id}" title="点击选择"`:""}>
    <div class="noble-art">
      <img src="${nobleArtURL(n)}" alt="贵族肖像 ${n.artIndex+1}" loading="eager" decoding="async"
        onerror="this.parentElement.classList.add('art-failed');this.remove()">
    </div>
    <span class="pts"><span>3</span></span>
    <div class="noble-info">
      <span class="noble-title">贵族</span>
      <span class="req">${reqs}</span>
      ${n.taken?`<span class="noble-taken">→ ${n.taken}</span>`:""}
    </div>
  </div>`;
}
function renderNobles(){
  $("nobles").innerHTML = S.nobles.filter(n=>n.taken===null).map(n=>nobleHTML(n,false)).join("")
    || `<span style="color:#8a9bb0;">贵族已被领完</span>`;
}
function costGemsHTML(cost, player){
  return Object.entries(cost).filter(([c])=>c!==GOLD).map(([c,k])=>{
    const disc = player && (player.bonus[c]||0) >= k;   // 折扣完全覆盖该成本
    return `<div class="cost-gem ${COLOR_CLASS(c)} ${disc?"disc":""}" title="${COLOR_NAME[c]}${disc?"(折扣已覆盖)":""}">${k}</div>`;
  }).join("");
}
function cardHTML(card, extra="", cls=""){
  const afford = S.phase==="action" && !cp().isAI && canAfford(cp(), card);
  return `<div class="card ${afford?"afford":""}${cls}" ${extra}>
    <div class="card-art">
      <img src="${cardArtURL(card)}" alt="${card.lv}级${COLOR_NAME[card.color]}色发展卡插画"
        loading="eager" decoding="async"
        onerror="this.parentElement.classList.add('art-failed');this.remove()">
      <div class="card-top-strip"></div>
      <div class="bonus-mark cost-gem ${COLOR_CLASS(card.color)}" title="永久${COLOR_NAME[card.color]}色折扣"></div>
      ${card.pts?`<div class="corner hasPts"><div class="pts">${card.pts}</div></div>`:""}
      <span class="level-mark">${["","I","II","III"][card.lv]} 级</span>
    </div>
    <div class="card-body">
      <div class="cost">${costGemsHTML(card.cost, cp())}</div>
    </div>
  </div>`;
}
function renderBoard(){
  const box = $("board");
  let html = "";
  for(const lv of [3,2,1]){
    html += `<div class="levelRow"><div class="deck" data-lv="${lv}" title="点击盲留一张(暗牌)+1金币">
      <div class="dlabel"><span class="dlvl">${lv}</span><span class="dname"> 级牌库</span></div><div class="cnt">${S.decks[lv].length}</div><div class="blind">点击盲留</div></div>`;
    for(let i=0;i<S.board[lv].length;i++){
      const card = S.board[lv][i];
      const picked = S.sel && S.sel.src==="board" && S.sel.lv===lv && S.sel.idx===i;
      html += cardHTML(card, `data-lv="${lv}" data-cid="${i}"`, picked?" sel":"");
    }
    html += `</div>`;
  }
  box.innerHTML = html;
  // 点击卡牌 = 选中 / 取消选中,买与留由宝石库右侧的按钮触发
  box.querySelectorAll(".card").forEach(el=>{
    const lv = +el.dataset.lv, idx = +el.dataset.cid;
    if(!S.board[lv]?.[idx]) return;
    el.onclick = ()=>selectCard({src:"board", lv, idx});
  });
  box.querySelectorAll(".deck").forEach(el=>{
    const lv = +el.dataset.lv;
    el.onclick = ()=>{ if(S.phase==="action" && !cp().isAI) reserveCard(null,lv); };
  });
}

/* ── 卡牌选中态 ── */
function selectedCard(){
  const s = S.sel;
  if(!s) return null;
  return s.src==="board" ? (S.board[s.lv]?.[s.idx] || null) : (cp().reserved[s.idx] || null);
}
function selectCard(sel){
  if(S.phase!=="action" || cp().isAI || S.actionTaken) return;
  const cur = S.sel;
  S.sel = (cur && cur.src===sel.src && cur.lv===sel.lv && cur.idx===sel.idx) ? null : sel;
  if(S.sel) S.gemSel = {W:0,B:0,G:0,R:0,K:0};   // 拿宝石与买/留互斥:选卡时清空已选宝石
  renderBoard(); renderPlayers(); renderBank(); renderSel();
  const card = selectedCard();
  msg(card ? `已选 ${COLOR_NAME[card.color]}色 ${card.pts}分 ${card.lv}级卡 —— 点「买」或「留」执行`
           : turnHintText());
}
function turnHintText(){
  /* 玩家回合不再显示操作提示(玩法说明见开始页),仅 AI 回合保留"正在思考" */
  return cp().isAI ? `${cp().name} 正在思考...` : "";
}
function renderBank(){
  let gems = "";
  for(const c of COLORS){
    const n = S.tokens[c];
    const sel = S.gemSel[c];
    const disabled = S.phase!=="action" || cp().isAI || n<=0;
    gems += `<button type="button" class="gem ${COLOR_CLASS(c)} ${n?"":"empty"} ${sel?"sel":""}"
      data-c="${c}" aria-label="${COLOR_NAME[c]}色宝石,剩余 ${n}" ${disabled?"disabled":""}>
      <span class="n">${n}</span></button>`;
  }
  gems += `<div class="gem gold t" title="金币:预留卡时获得,可当任意颜色"><span class="n">${S.tokens.O}</span></div>`;
  /* 宝石单独成组,配合 #bank 的三列网格在整行里居中(右侧买/留不参与居中基准) */
  let html = `<div class="bank-gems">${gems}</div>`;
  /* 宝石库右侧:先选卡,再买/留 */
  const p = cp();
  const sc = selectedCard();
  const canAct = S.phase==="action" && !p.isAI && !S.actionTaken && !!sc;
  const buyOk = canAct && canAfford(p, sc);
  const resOk = canAct && S.sel.src==="board" && p.reserved.length<3;
  html += `<div id="cardActs">
    <span class="cap">${sc?`已选 ${COLOR_NAME[sc.color]}色 ${sc.pts}分`:"未选卡牌"}</span>
    <button type="button" class="btn ${buyOk?"gold":""}" id="buyBtn" title="购买选中的卡牌" ${buyOk?"":"disabled"}>买</button>
    <button type="button" class="btn" id="resBtn" title="预留选中的卡牌(+1金币)" ${resOk?"":"disabled"}>留</button>
  </div>`;
  $("bank").innerHTML = html;
  $("bank").querySelectorAll(".gem[data-c]").forEach(el=>{
    el.onclick = ()=>{ if(!cp().isAI) clickBankGem(el.dataset.c); };
  });
  $("buyBtn").onclick = ()=>{
    const s = S.sel; if(!s) return;
    if(s.src==="board") buyCard(S.board[s.lv][s.idx], false, s.lv);
    else buyCard(cp().reserved[s.idx], true);
  };
  $("resBtn").onclick = ()=>{
    const s = S.sel; if(!s || s.src!=="board") return;
    reserveCard(S.board[s.lv][s.idx], s.lv);
  };
}
function clickBankGem(c){
  if(S.phase!=="action" || S.actionTaken || cp().isAI) return;
  if(S.tokens[c]<=0){ msg(`${COLOR_NAME[c]}色宝石已没了`); return; }
  const sel = S.gemSel;
  const total = COLORS.reduce((s,x)=>s+sel[x],0);
  if(sel[c]>0){                         // 取消选择
    sel[c] = 0;
    renderBank(); renderSel();
    return;
  }
  if(total>=3){ msg("最多拿 3 个宝石"); return; }
  // 是否已有颜色选了 2 个(同色双拿时不能再拿第三个)
  const doubled = COLORS.some(x=>sel[x]===2);
  if(doubled){ msg("已选择同色 2 个,不能再拿第三个"); return; }
  sel[c] = 1;
  if(S.sel){ S.sel = null; renderBoard(); renderPlayers(); }  // 拿宝石与买/留互斥
  renderBank(); renderSel();
  msg(turnHintText());
}
// 同色双拿:点击自己已选中的宝石一次 → 变成拿 2 个
function clickSelGem(c){
  if(S.phase!=="action" || S.actionTaken || cp().isAI) return;
  const sel = S.gemSel;
  if(sel[c]===1 && S.tokens[c]>=4 && S.tokens[c]>=2){
    sel[c]=2;
  }else if(sel[c]===2){
    sel[c]=1;
  }
  renderBank(); renderSel();
}
function renderSel(){
  const sel = S.gemSel;
  let html = `<span style="color:#8a9bb0;font-size:13px;">已选:</span>`;
  let any=false;
  for(const c of COLORS){
    for(let i=0;i<sel[c];i++){
      html += `<button type="button" class="gem ${COLOR_CLASS(c)}" data-c="${c}"
        aria-label="调整已选${COLOR_NAME[c]}色宝石"><span class="n">${S.tokens[c]}</span></button>`;
      any=true;
    }
  }
  $("selGems").innerHTML = any?html+`<span style="color:#8a9bb0;font-size:12px;">(再点同色宝石可双拿)</span>`:"<span style='color:#556;font-size:12px;'>未选择</span>";
  $("selGems").querySelectorAll(".gem").forEach(el=>{ el.onclick=()=>{ if(!cp().isAI) clickSelGem(el.dataset.c); }; });
  const total = COLORS.reduce((s,c)=>s+sel[c],0);
  $("okBtn").disabled = !(S.phase==="action" && !cp().isAI && total>=1);
}

function renderPlayers(){
  $("players").innerHTML = S.players.map((p,i)=>{
    const isCur = i===S.cur;
    const gems = [...COLORS,GOLD].map(c=>{
      const amount = p.tokens[c];
      const clickable = amount>0 && isCur && !p.isAI && S.phase==="discard";
      return `<div class="gem ${COLOR_CLASS(c)} ${amount?"":"empty"} ${clickable?"clickable":""}"
        data-p="${i}" data-c="${c}" title="${COLOR_NAME[c]}色宝石 ×${amount}">
        <span class="n">${amount}</span>
      </div>`;
    }).join("");
    const bonus = COLORS.map(c=>{
      const amount = p.bonus[c];
      return `<div class="bgem ${COLOR_CLASS(c)} ${amount?"":"empty"}"
        title="永久${COLOR_NAME[c]}折扣 ×${amount}"><span class="bonus-count">${amount}</span></div>`;
    }).join("");
    const reserved = p.reserved.map((card,j)=>{
      const afford = isCur && S.phase==="action" && canAfford(p,card);
      const picked = isCur && S.sel && S.sel.src==="res" && S.sel.idx===j;
      return `<div class="rmini ${afford?"afford":""}${picked?" sel":""}" data-res="${j}">
        <div class="rmini-art">
          <img src="${cardArtURL(card)}" alt="${card.lv}级${COLOR_NAME[card.color]}色预留卡插画"
            loading="lazy" decoding="async"
            onerror="this.parentElement.classList.add('art-failed');this.remove()">
          <div class="rmini-top-strip"></div>
          <div class="mini-bonus cost-gem ${COLOR_CLASS(card.color)}"></div>
          ${card.pts?`<span class="pts">${card.pts}</span>`:""}
        </div>
        <div class="rmini-body">
          <div class="cost" style="display:flex; flex-wrap:wrap; gap:3px;">${costGemsHTML(card.cost, p)}</div>
        </div>
      </div>`;
    }).join("");
    const purchased = p.purchased || [];
    const purchasedStacks = COLORS.map(c=>{
      const cards = purchased.filter(card=>card.color===c);
      return `<div class="owned-stack" style="padding-bottom:${Math.max(0,cards.length-1)*22}px">${
        cards.map((card,j)=>`<div class="owned-card"
          style="--stack-offset:${j*22}px;--stack-z:${j+1}"
          title="${COLOR_NAME[c]}色发展卡 · ${card.pts} 分 · ${["","I","II","III"][card.lv]} 级 · 成本${costText(card.cost)}">
          <img src="${cardArtURL(card)}" alt="${card.lv}级${COLOR_NAME[c]}色已购发展卡插画"
            loading="lazy" decoding="async"
            onerror="this.parentElement.classList.add('art-failed');this.remove()">
          <div class="owned-card-top"></div>
          ${card.pts?`<span class="owned-card-score">${card.pts}</span>`:""}
          <span class="owned-card-bonus cost-gem ${COLOR_CLASS(c)}"></span>
          <div class="owned-card-cost">${costGemsHTML(card.cost, null)}</div>
          <span class="owned-card-level">${["","I","II","III"][card.lv]}</span>
        </div>`).join("")
      }</div>`;
    }).join("");
    const nobles = p.nobles.length?`<div class="row"><span class="tag">贵族</span><div class="player-nobles">${
      p.nobles.map(n=>`<span class="player-noble" title="贵族 · 3 分">
        <img src="${nobleArtURL(n)}" alt="已获得的贵族肖像" loading="lazy" decoding="async">
      </span>`).join("")
    }</div></div>`:"";
    return `<div class="player ${isCur?"cur":""} ${isCur&&p.isAI?"ai-turn":""}">
      <div class="head"><span class="name">${isCur?"▶ ":""}${p.name}${p.isAI?" · AI":""}</span><span class="score">${p.pts}</span></div>
      <div class="row resource-row gems"><span class="tag">宝石</span><div class="resource-slots">${gems}</div></div>
      <div class="row resource-row"><span class="tag">折扣</span><div class="resource-slots">${bonus}<span aria-hidden="true"></span></div></div>
      ${nobles}
      ${reserved?`<div class="row"><span class="tag">预留</span><div class="reserved">${reserved}</div></div>`:""}
      ${purchased.length?`<div class="row purchased-row"><span class="tag">卡牌</span><div class="purchased-grid">${purchasedStacks}</div></div>`:""}
    </div>`;
  }).join("");
  // 弃币阶段:点击当前玩家的宝石
  $("players").querySelectorAll(".gem.clickable").forEach(el=>{
    el.onclick = ()=>{
      if(S.phase!=="discard") return;
      const p = cp(), c = el.dataset.c;
      if(p.tokens[c]<=0) return;
      p.tokens[c]--; S.tokens[c]++;
      if(totalTokens(p)<=10){
        S.phase="action";
        S.gemSel = {W:0,B:0,G:0,R:0,K:0};
        logMsg(`${p.name} 弃置宝石至 10 个`);
        finishTurn();
      }else{
        render();   // 全量刷新:宝石库(含金币)数量也要同步更新
        msg(`还需弃 ${totalTokens(p)-10} 个宝石`);
      }
    };
  });
  // 点击自己的预留卡 = 选中,再按宝石库右侧的「买」
  const curEl = $("players").querySelectorAll(".player")[S.cur];
  if(curEl) curEl.querySelectorAll(".rmini").forEach(el=>{
    const j = +el.dataset.res;
    el.onclick = ()=>selectCard({src:"res", lv:null, idx:j});
  });
}

/* ───────────────────────── 弹窗 ───────────────────────── */
function showModal(head, body, after){
  $("overlay").hidden = false;
  $("modalBox").innerHTML = head + body;
  after && after($("modalBox"));
}
function hideModal(){ $("overlay").hidden = true; }

/* ───────────────────────── 事件绑定 ───────────────────────── */
$("okBtn").onclick = ()=>{
  if(S.phase!=="action" || cp().isAI) return;
  const total = COLORS.reduce((s,c)=>s+S.gemSel[c],0);
  if(total<1) return;
  // 校验:同色 2 个时不能有第三个
  if(COLORS.some(c=>S.gemSel[c]===2) && total>2){ msg("同色双拿时只能拿这 2 个"); return; }
  takeGems();
};
$("cancelBtn").onclick = ()=>{
  if(cp().isAI) return;
  S.gemSel = {W:0,B:0,G:0,R:0,K:0};
  renderBank(); renderSel();
};
$("surrenderBtn").onclick = ()=>{
  if(S.phase!=="action" || cp().isAI) return;
  if(confirm("确定要认输吗?将直接进入终局结算。")) gameOver();
};

// 设置界面:模式、人数与名字
const modeSelect = $("modeSelect");
const difficultySelect = $("difficultySelect");
const pcSelect = $("pcSelect");
function renderNameInputs(){
  const box = $("nameInputs");
  const previous = [...box.querySelectorAll(".pname")].map(input=>input.value);
  const aiMode = modeSelect.value==="ai";
  $("difficultyLabel").classList.toggle("setup-hidden", !aiMode);
  difficultySelect.classList.toggle("setup-hidden", !aiMode);
  difficultySelect.disabled = !aiMode;
  $("pcLabel").classList.toggle("setup-hidden", aiMode);
  pcSelect.classList.toggle("setup-hidden", aiMode);
  pcSelect.disabled = aiMode;
  box.replaceChildren();
  const addField = (labelText,value,{player=false,disabled=false}={})=>{
    const label = document.createElement("label");
    const input = document.createElement("input");
    label.textContent = labelText;
    input.value = value;
    input.disabled = disabled;
    if(player) input.className = "pname";
    box.append(label,input);
  };
  if(aiMode){
    addField("玩家名字",previous[0]||"玩家1",{player:true});
    addField("电脑对手","电脑",{disabled:true});
    return;
  }
  const n = +pcSelect.value;
  for(let i=0;i<n;i++) addField(`玩家 ${i+1} 名字`,previous[i]||`玩家${i+1}`,{player:true});
}
modeSelect.onchange = renderNameInputs;
pcSelect.onchange = renderNameInputs;
renderNameInputs();
$("startBtn").onclick = ()=>{
  const names = [...document.querySelectorAll(".pname")].map(x=>x.value.trim()||"玩家");
  const aiMode = modeSelect.value==="ai";
  const participants = aiMode
    ? [{name:names[0], isAI:false}, {name:names[0]==="电脑"?"电脑对手":"电脑", isAI:true}]
    : names.map(name=>({name, isAI:false}));
  if(new Set(participants.map(player=>player.name)).size !== participants.length){
    alert("玩家名字不能重复"); return;
  }
  initGame(participants, modeSelect.value, aiMode?difficultySelect.value:"normal");
};
</script>
